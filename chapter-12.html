:root{font-family:"Microsoft JhengHei",sans-serif;color:#173d32;background:#f5f4ed}*{box-sizing:border-box}body{margin:0}header{background:#173d32;color:#fff;padding:22px max(20px,calc((100vw - 850px)/2));}header small{color:#d7ed8a;letter-spacing:3px}h1{font-size:clamp(26px,5vw,40px);margin:12px 0}header p{color:#c7d7cf;line-height:1.7}main{max-width:850px;margin:auto;padding:24px 18px 60px}.toolbar{display:flex;justify-content:space-between;gap:15px;align-items:center;position:sticky;top:0;background:#f5f4edf5;padding:14px 0;z-index:2}button{font:inherit;cursor:pointer;border:1px solid #cdd9d0;background:white;color:#173d32;border-radius:12px;padding:12px 18px}button:focus-visible,input:focus-visible{outline:3px solid #9ebf36;outline-offset:3px}.primary{background:#173d32;color:white;border:0}.question{background:white;border-radius:20px;padding:24px;margin:18px 0;border:1px solid #e0e5dd}.question h2{font-size:19px;line-height:1.7;margin:10px 0 20px}.number{font-size:12px;font-weight:bold;color:#608070}label{display:flex;align-items:flex-start;gap:12px;padding:14px;border:1px solid #e0e5dd;border-radius:12px;margin:10px 0;cursor:pointer;line-height:1.6}label:has(input:checked){background:#edf5da;border-color:#779a45}input{accent-color:#286247;margin-top:5px;flex-shrink:0}.correct{background:#e6f3e8!important;border-color:#58a16a!important}.wrong{background:#fce9e5!important;border-color:#c66b5e!important}.feedback{color:#42664f;font-size:14px;line-height:1.8}.bottom{display:grid;gap:15px;text-align:center}.bottom button{padding:18px}.note{color:#6c7e72;font-size:13px;line-height:1.7}.result{background:#173d32;color:white;border-radius:24px;padding:32px;text-align:center;margin:20px 0}.result strong{display:block;font-size:70px;color:#d7ed8a}.result p{line-height:1.8}.hidden{display:none}progress{width:100%;height:7px;accent-color:#6e982d}dialog{border:0;border-radius:20px;max-width:90vw;padding:26px;text-align:center}dialog::backdrop{background:#173d3299}dialog img{max-width:250px;width:100%}.share-url{overflow-wrap:anywhere;font-size:12px;max-width:300px}.badge{display:inline-block;background:#edf5da;color:#42664f;padding:5px 10px;border-radius:30px;font-size:12px}@media(max-width:480px){.question{padding:18px}label{padding:12px}.toolbar{font-size:13px}button{padding:11px 13px}}
header{display:flex;justify-content:space-between;align-items:center;gap:24px}.teacher-credit{text-align:right;flex-shrink:0;line-height:1.9}.teacher-credit strong{display:block;color:#d7ed8a;font-size:20px}.teacher-credit span{font-size:17px}@media(max-width:650px){header{flex-wrap:wrap;gap:8px}.teacher-credit{margin-left:auto}.teacher-credit strong{font-size:18px}.teacher-credit span{font-size:15px}}
</style></head><body><header><div><small>FINTECH PRACTICE · CHAPTER 12</small><h1>純網銀與開放銀行</h1><p>50 題單選 · 每題 2 分 · 滿分 100 分<br>依自己的步調練習，完成後立即查看得分與正確答案。</p></div><div class="teacher-credit"><strong>數位金融服務</strong><span>楊智宇老師</span></div></header><main><div class="toolbar"><span id="count" aria-live="polite">已作答 0 / 50 題</span></div><progress id="progress" max="50" value="0" aria-label="作答進度"></progress><section id="result" class="result hidden" tabindex="-1"></section><form id="quiz"><div id="questions"></div><div class="bottom"><button class="primary" type="submit">完成作答，查看得分</button><p class="note">無須登入。姓名、學號及成績不會上傳。<br>題目與選項每次練習會重新排列。</p></div></form><button id="retry" class="primary hidden" style="width:100%">重新練習</button></main><script>const QUESTIONS=[{"id":"c12q1","stem":"銀行主要透過網路與行動通路提供服務、通常沒有傳統分行，最接近什麼？","options":[{"id":"a","text":"純網路銀行"},{"id":"b","text":"只有網拍收款服務"},{"id":"c","text":"純粹資訊網站"},{"id":"d","text":"一般電商賣場"}],"correct":"a","difficulty":"easy"},{"id":"c12q2","stem":"傳統銀行提供手機 App，是否因此就成為純網路銀行？","options":[{"id":"b","text":"一定，只要有 App 就算"},{"id":"c","text":"只有提供優惠時才算"},{"id":"d","text":"只看 App 安裝數"},{"id":"a","text":"不一定，須看銀行整體營運型態"}],"correct":"a","difficulty":"easy"},{"id":"c12q3","stem":"純網銀沒有傳統分行，是否代表不能有人員客服？","options":[{"id":"c","text":"是，不能僱用任何員工"},{"id":"d","text":"是，客戶只能自行解決"},{"id":"a","text":"不是，仍可配置客服與適當支援"},{"id":"b","text":"是，所有客訴只能由程式處理"}],"correct":"a","difficulty":"easy"},{"id":"c12q4","stem":"純網銀競爭促使既有銀行改善服務，通常稱為什麼？","options":[{"id":"d","text":"資料壓縮"},{"id":"a","text":"鯰魚效應"},{"id":"b","text":"股權稀釋"},{"id":"c","text":"逆選擇"}],"correct":"a","difficulty":"easy"},{"id":"c12q5","stem":"開放銀行分享個人帳戶資訊時，核心條件之一是什麼？","options":[{"id":"a","text":"客戶的適當授權與控制"},{"id":"b","text":"銀行可任意永久公開"},{"id":"c","text":"所有資料都沒有隱私"},{"id":"d","text":"只需第三方自行宣稱有益"}],"correct":"a","difficulty":"easy"},{"id":"c12q6","stem":"API 在開放銀行中主要扮演什麼角色？","options":[{"id":"b","text":"替代所有風險治理"},{"id":"c","text":"把資料自動變公開"},{"id":"d","text":"保證所有程式無漏洞"},{"id":"a","text":"讓系統依約定介面交換資料或功能"}],"correct":"a","difficulty":"easy"},{"id":"c12q7","stem":"不涉及個別客戶的牌告利率與分行位置，較接近哪類資料？","options":[{"id":"c","text":"銀行機密演算法"},{"id":"d","text":"客戶驗證密碼"},{"id":"a","text":"公開產品或服務資料"},{"id":"b","text":"個人交易明細"}],"correct":"a","difficulty":"easy"},{"id":"c12q8","stem":"客戶同意後在單一 App 查看不同銀行餘額，屬於什麼應用？","options":[{"id":"d","text":"純粹廣告投放"},{"id":"a","text":"帳戶資訊聚合"},{"id":"b","text":"現金運送"},{"id":"c","text":"票據背書"}],"correct":"a","difficulty":"easy"},{"id":"c12q9","stem":"TSP 在開放銀行情境通常指什麼？","options":[{"id":"a","text":"第三方服務提供者"},{"id":"b","text":"中央銀行貨幣"},{"id":"c","text":"個人交易密碼"},{"id":"d","text":"存款準備率"}],"correct":"a","difficulty":"easy"},{"id":"c12q10","stem":"只供機構內部系統使用的介面，通常稱為什麼？","options":[{"id":"b","text":"對外公開資料庫"},{"id":"c","text":"任何人可用的客戶密碼"},{"id":"d","text":"共享現金帳戶"},{"id":"a","text":"私有或內部 API"}],"correct":"a","difficulty":"easy"},{"id":"c12q11","stem":"科技或電商背景股東參與純網銀，可能提供什麼優勢？","options":[{"id":"c","text":"必然消除資本需求"},{"id":"d","text":"保證所有服務都免費"},{"id":"a","text":"既有數位通路與客戶場景"},{"id":"b","text":"自動取得所有銀行資料"}],"correct":"a","difficulty":"medium"},{"id":"c12q12","stem":"純網銀降低部分分行成本後，仍有哪些投入？","options":[{"id":"d","text":"只有網站網址費"},{"id":"a","text":"科技、資安、法遵與客戶服務"},{"id":"b","text":"完全沒有固定成本"},{"id":"c","text":"只需廣告費"}],"correct":"a","difficulty":"medium"},{"id":"c12q13","stem":"客戶可隨時線上轉出存款，銀行需注意什麼？","options":[{"id":"a","text":"資金流動速度與流動性管理"},{"id":"b","text":"所有存款必然長期不動"},{"id":"c","text":"網路存款不屬於資金"},{"id":"d","text":"只有招牌顏色"}],"correct":"a","difficulty":"medium"},{"id":"c12q14","stem":"純網銀主要系統依賴外部廠商，應強化什麼？","options":[{"id":"b","text":"取消所有維運合約"},{"id":"c","text":"假定廠商負責就無風險"},{"id":"d","text":"只比較手機畫面"},{"id":"a","text":"第三方監督與營運持續管理"}],"correct":"a","difficulty":"medium"},{"id":"c12q15","stem":"銀行與科技公司合作，法遵責任應如何處理？","options":[{"id":"c","text":"科技公司不受重視即可"},{"id":"d","text":"只要客戶同意就不需合規"},{"id":"a","text":"依角色明確分工並維持有效治理"},{"id":"b","text":"全部自動轉給科技公司"}],"correct":"a","difficulty":"medium"},{"id":"c12q16","stem":"App 全天可開啟，是否代表每種業務都即時完成？","options":[{"id":"d","text":"代表無須揭露任何服務時間"},{"id":"a","text":"不代表，仍受系統、流程及服務條件限制"},{"id":"b","text":"代表所有清算都即時且無例外"},{"id":"c","text":"代表所有金融商品都能隨時成交"}],"correct":"a","difficulty":"medium"},{"id":"c12q17","stem":"開放銀行讓客戶選擇分享對象，主要增加什麼？","options":[{"id":"a","text":"對資料運用與服務選擇的控制"},{"id":"b","text":"對其他人的資料所有權"},{"id":"c","text":"任意改寫銀行帳本的權力"},{"id":"d","text":"保證所有服務相同價格"}],"correct":"a","difficulty":"medium"},{"id":"c12q18","stem":"客戶授權查餘額，第三方卻取得轉帳權限，問題在哪裡？","options":[{"id":"b","text":"只要有一次同意就可任意擴張"},{"id":"c","text":"查詢與轉帳權限完全一樣"},{"id":"d","text":"第三方註冊就可全面操作"},{"id":"a","text":"權限超過原本同意範圍"}],"correct":"a","difficulty":"medium"},{"id":"c12q19","stem":"授權頁面應較清楚呈現什麼？","options":[{"id":"c","text":"所有條件藏在無法開啟頁面"},{"id":"d","text":"只顯示優惠倒數"},{"id":"a","text":"分享對象、資料、用途與期間"},{"id":"b","text":"只有同意按鈕"}],"correct":"a","difficulty":"medium"},{"id":"c12q20","stem":"客戶不想再分享資訊，服務應提供什麼？","options":[{"id":"d","text":"只能更換姓名"},{"id":"a","text":"可理解的撤銷或管理授權方式"},{"id":"b","text":"永久不能撤銷"},{"id":"c","text":"只能重新買手機"}],"correct":"a","difficulty":"medium"},{"id":"c12q21","stem":"第三方整合房貸、存款與基金資訊，主要幫助什麼？","options":[{"id":"a","text":"形成較完整的個人財務視圖"},{"id":"b","text":"自動消除全部負債"},{"id":"c","text":"保證所有基金獲利"},{"id":"d","text":"取代所有資金保管機構"}],"correct":"a","difficulty":"medium"},{"id":"c12q22","stem":"銀行內部定價模型與策略規則，通常較接近哪類資料？","options":[{"id":"b","text":"所有人皆可用的公開商品資訊"},{"id":"c","text":"單一客戶提供的證件"},{"id":"d","text":"公共 ATM 地點"},{"id":"a","text":"商業敏感資料"}],"correct":"a","difficulty":"medium"},{"id":"c12q23","stem":"把區域提款金額彙整成月平均，較接近哪種資料？","options":[{"id":"c","text":"原始身分證件"},{"id":"d","text":"單筆交易授權碼"},{"id":"a","text":"聚合資料"},{"id":"b","text":"單一個人的密碼"}],"correct":"a","difficulty":"medium"},{"id":"c12q24","stem":"公開資料 API 與客戶資料 API 的權限需求，應如何區分？","options":[{"id":"d","text":"只需檢查介面名稱"},{"id":"a","text":"依敏感度與用途設計不同存取控制"},{"id":"b","text":"所有 API 一律匿名即可"},{"id":"c","text":"公開規格等同公開個資"}],"correct":"a","difficulty":"medium"},{"id":"c12q25","stem":"Open API 的「開放」較適當的理解是什麼？","options":[{"id":"a","text":"可供外部開發與介接，不表示毫無限制"},{"id":"b","text":"所有內部資料皆可任意下載"},{"id":"c","text":"任何人可取得銀行管理員權限"},{"id":"d","text":"介接一定完全免費"}],"correct":"a","difficulty":"medium"},{"id":"c12q26","stem":"API 資料採共同欄位與格式，有助於什麼？","options":[{"id":"b","text":"自動免除客戶授權"},{"id":"c","text":"保證資料一定即時正確"},{"id":"d","text":"消除全部風險"},{"id":"a","text":"降低跨系統整合成本"}],"correct":"a","difficulty":"medium"},{"id":"c12q27","stem":"金融商品比較網站透過 API 更新利率，主要改善什麼？","options":[{"id":"c","text":"取消商品條件差異"},{"id":"d","text":"替使用者決定全部交易"},{"id":"a","text":"減少人工重複蒐集與更新"},{"id":"b","text":"保證所有產品都最低價"}],"correct":"a","difficulty":"medium"},{"id":"c12q28","stem":"將金融功能接到生活平台，可為銀行創造什麼？","options":[{"id":"d","text":"直接取消金融監理"},{"id":"a","text":"接觸新客群與新服務場景"},{"id":"b","text":"保證客戶全部轉移到同一家"},{"id":"c","text":"讓銀行不再需要信任"}],"correct":"a","difficulty":"medium"},{"id":"c12q29","stem":"開放資料有助詐欺分析時，仍應控制什麼？","options":[{"id":"a","text":"合法用途、品質與必要分享範圍"},{"id":"b","text":"所有資料任意外流"},{"id":"c","text":"以分析為名永久無限蒐集"},{"id":"d","text":"不需追蹤查詢者"}],"correct":"a","difficulty":"medium"},{"id":"c12q30","stem":"分階段開放查詢與交易功能，主要能協助什麼？","options":[{"id":"b","text":"保證後續一定無風險"},{"id":"c","text":"永遠不需建立責任制度"},{"id":"d","text":"只為增加頁面數"},{"id":"a","text":"逐步驗證安全、流程與市場運作"}],"correct":"a","difficulty":"medium"},{"id":"c12q31","stem":"公開產品查詢與交易發起最大的風險差異之一為何？","options":[{"id":"c","text":"產品查詢必然風險更高"},{"id":"d","text":"兩者都不需任何控制"},{"id":"a","text":"後者可能直接造成資金移動"},{"id":"b","text":"兩者都不影響客戶"}],"correct":"a","difficulty":"medium"},{"id":"c12q32","stem":"第三方介面故障造成資料顯示錯誤，應具備什麼安排？","options":[{"id":"d","text":"所有人都不負責"},{"id":"a","text":"定位來源、責任與更正及客戶協助流程"},{"id":"b","text":"讓客戶自行找所有業者"},{"id":"c","text":"只刪除錯誤畫面"}],"correct":"a","difficulty":"medium"},{"id":"c12q33","stem":"銀行與新創共享資料，主要可能提升什麼？","options":[{"id":"a","text":"產品組合與服務創新"},{"id":"b","text":"所有創新成功率至百分之百"},{"id":"c","text":"所有銀行利率一致"},{"id":"d","text":"所有平台免費經營"}],"correct":"a","difficulty":"medium"},{"id":"c12q34","stem":"銀行客戶入口被外部平台掌握，可能帶來什麼挑戰？","options":[{"id":"b","text":"法定銀行資格自動消失"},{"id":"c","text":"所有存款立即轉為股票"},{"id":"d","text":"所有分行必須立刻關閉"},{"id":"a","text":"顧客關係與中介角色改變"}],"correct":"a","difficulty":"medium"},{"id":"c12q35","stem":"第三方不持有用戶存款，也能提供什麼？","options":[{"id":"c","text":"發行央行貨幣"},{"id":"d","text":"保證所有存款收益"},{"id":"a","text":"依授權整理資訊與提供相關應用"},{"id":"b","text":"無限制動用所有帳戶"}],"correct":"a","difficulty":"medium"},{"id":"c12q36","stem":"授權憑證遭竊時，服務端應能做什麼？","options":[{"id":"d","text":"不留下任何紀錄"},{"id":"a","text":"撤銷憑證、限制影響並追蹤異常"},{"id":"b","text":"只要求客戶刪除 App"},{"id":"c","text":"讓所有憑證永久有效"}],"correct":"a","difficulty":"medium"},{"id":"c12q37","stem":"API 介接完成後，仍需什麼持續工作？","options":[{"id":"a","text":"監控、版本管理與安全維護"},{"id":"b","text":"永久停止更新"},{"id":"c","text":"取消測試環境"},{"id":"d","text":"只增加行銷活動"}],"correct":"a","difficulty":"medium"},{"id":"c12q38","stem":"純網銀以高利率吸引用戶，評估經營時應同時看什麼？","options":[{"id":"b","text":"只有開戶數"},{"id":"c","text":"只看首次下載"},{"id":"d","text":"優惠越高就一定越賺"},{"id":"a","text":"資金成本、客戶留存與可持續收入"}],"correct":"a","difficulty":"medium"},{"id":"c12q39","stem":"數位服務對部分客群使用困難，較合適的改善為何？","options":[{"id":"c","text":"只服務最新機型"},{"id":"d","text":"增加複雜手勢操作"},{"id":"a","text":"無障礙介面與適當替代協助"},{"id":"b","text":"排除全部不熟悉手機者"}],"correct":"a","difficulty":"medium"},{"id":"c12q40","stem":"評估開放銀行的成功，哪組指標較完整？","options":[{"id":"d","text":"只看程式行數"},{"id":"a","text":"授權使用、服務品質、客戶價值與風險事件"},{"id":"b","text":"只看發布的 API 數量"},{"id":"c","text":"只看第三方註冊數"}],"correct":"a","difficulty":"medium"},{"id":"c12q41","stem":"客戶撤銷授權，但第三方繼續以舊憑證取得新資料，主要缺陷在哪裡？","options":[{"id":"a","text":"撤銷狀態未有效傳遞或執行"},{"id":"b","text":"客戶撤銷本來不需生效"},{"id":"c","text":"資料曾被分享就永久可取"},{"id":"d","text":"只要第三方知名就可忽略"}],"correct":"a","difficulty":"hard"},{"id":"c12q42","stem":"帳戶聚合畫面未標示更新時間，可能讓客戶產生什麼誤解？","options":[{"id":"b","text":"誤以為所有資金都已被扣除"},{"id":"c","text":"一定提高存款利率"},{"id":"d","text":"自動降低借款成本"},{"id":"a","text":"把舊餘額當成即時可用資金"}],"correct":"a","difficulty":"hard"},{"id":"c12q43","stem":"第三方只需分析月總支出卻申請全部多年明細，應如何調整？","options":[{"id":"c","text":"先全部取得再決定用途"},{"id":"d","text":"改成不同檔案名稱即可"},{"id":"a","text":"按必要用途縮小資料與期間"},{"id":"b","text":"資料越多越符合開放精神"}],"correct":"a","difficulty":"hard"},{"id":"c12q44","stem":"純網銀多個關鍵服務共用同一家雲端供應商，應關注什麼？","options":[{"id":"d","text":"資料量大就自然安全"},{"id":"a","text":"集中依賴與共同故障風險"},{"id":"b","text":"有多個 App 就保證獨立"},{"id":"c","text":"只看供應商廣告"}],"correct":"a","difficulty":"hard"},{"id":"c12q45","stem":"銀行把 API 控制做得嚴密，但第三方客服可任意下載資料，問題是什麼？","options":[{"id":"a","text":"生態系安全須涵蓋資料流後續環節"},{"id":"b","text":"銀行端安全就已保護全部利用"},{"id":"c","text":"第三方不需資料治理"},{"id":"d","text":"只要加上浮水印就可解決"}],"correct":"a","difficulty":"hard"},{"id":"c12q46","stem":"促銷結束後純網銀存款快速流失，應優先檢視什麼？","options":[{"id":"b","text":"只看累積開戶數"},{"id":"c","text":"把短期資金視為永久資本"},{"id":"d","text":"停止顯示轉出功能"},{"id":"a","text":"客戶黏著與資金來源穩定性"}],"correct":"a","difficulty":"hard"},{"id":"c12q47","stem":"不同銀行都使用同一欄位名稱「餘額」，實際定義卻不同，如何整合？","options":[{"id":"c","text":"只統一畫面小數位數"},{"id":"d","text":"讓客戶自行猜測"},{"id":"a","text":"對齊業務語意與可用範圍後呈現"},{"id":"b","text":"欄位名相同就直接相加"}],"correct":"a","difficulty":"hard"},{"id":"c12q48","stem":"客戶把銀行密碼交給宣稱是開放銀行的網站，較安全的處理為何？","options":[{"id":"d","text":"只用無痕模式即可安全"},{"id":"a","text":"確認官方授權流程與對象，避免直接交付登入秘密"},{"id":"b","text":"網站寫開放就必然可信"},{"id":"c","text":"有銀行標誌就可提供"}],"correct":"a","difficulty":"hard"},{"id":"c12q49","stem":"開放銀行讓多方共同提供服務，為何仍需單一清楚的申訴入口？","options":[{"id":"a","text":"避免責任分散讓客戶無法有效解決問題"},{"id":"b","text":"申訴入口只影響美觀"},{"id":"c","text":"客戶必須懂全部技術架構"},{"id":"d","text":"多方合作就不需客服"}],"correct":"a","difficulty":"hard"},{"id":"c12q50","stem":"API 技術標準一致，但合作方對資料用途認定不同，還需什麼？","options":[{"id":"b","text":"只再提高傳輸速度"},{"id":"c","text":"只增加 API 文件頁數"},{"id":"d","text":"讓資料無限制公開"},{"id":"a","text":"契約、治理與業務規則協調"}],"correct":"a","difficulty":"hard"}];</script><script>
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=crypto.getRandomValues(new Uint32Array(1))[0]%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
let questions=[],answers={},finished=false;const $=id=>document.getElementById(id);const escapeHtml=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){questions=shuffle(QUESTIONS).map(q=>({...q,options:shuffle(q.options)}));answers={};finished=false;$('result').classList.add('hidden');$('retry').classList.add('hidden');$('quiz').classList.remove('hidden');$('quiz').querySelector('.bottom').classList.remove('hidden');$('questions').innerHTML=questions.map((q,i)=>`<section class="question" id="${q.id}"><span class="number">QUESTION ${String(i+1).padStart(2,'0')} / 50</span><h2>${escapeHtml(q.stem)}</h2>${q.options.map((o,j)=>`<label><input type="radio" name="${q.id}" value="${o.id}"><span>${String.fromCharCode(65+j)}. ${escapeHtml(o.text)}</span></label>`).join('')}<div class="feedback"></div></section>`).join('');update()}
function update(){$('count').textContent=`已作答 ${Object.keys(answers).length} / 50 題`;$('progress').value=Object.keys(answers).length}
$('quiz').addEventListener('change',e=>{if(!finished&&e.target.type==='radio'){answers[e.target.name]=e.target.value;update()}});
$('quiz').addEventListener('submit',e=>{e.preventDefault();if(finished)return;const missing=50-Object.keys(answers).length;if(missing&&!confirm(`還有 ${missing} 題未作答，未答題以 0 分計算。確定完成？`))return;finished=true;let right=0;for(const q of questions){const section=$(q.id);const ok=answers[q.id]===q.correct;if(ok)right++;for(const input of section.querySelectorAll('input')){input.disabled=true;if(input.value===q.correct)input.closest('label').classList.add('correct');else if(input.checked)input.closest('label').classList.add('wrong')}section.querySelector('.feedback').textContent=ok?'答對了！':`${answers[q.id]?'本題答錯':'本題未作答'}。正確答案：${q.options.find(o=>o.id===q.correct).text}`}$('result').innerHTML=`<span>本次練習得分</span><strong>${right*2}<small style="font-size:22px"> 分</small></strong><p>答對 ${right} 題 · 答錯 ${50-right-missing} 題 · 未答 ${missing} 題</p><p>往下查看每題答案，或重新練習一次。</p>`;$('result').classList.remove('hidden');$('quiz').querySelector('.bottom').classList.add('hidden');$('retry').classList.remove('hidden');$('result').scrollIntoView({behavior:'smooth'});$('result').focus({preventScroll:true})});
$('retry').onclick=()=>{render();window.scrollTo({top:0,behavior:'smooth'})};render();
</script></body></html>
