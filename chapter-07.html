<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第7章｜支付練習</title><style>
:root{font-family:"Microsoft JhengHei",sans-serif;color:#173d32;background:#f5f4ed}*{box-sizing:border-box}body{margin:0}header{background:#173d32;color:#fff;padding:22px max(20px,calc((100vw - 850px)/2));}header small{color:#d7ed8a;letter-spacing:3px}h1{font-size:clamp(26px,5vw,40px);margin:12px 0}header p{color:#c7d7cf;line-height:1.7}main{max-width:850px;margin:auto;padding:24px 18px 60px}.toolbar{display:flex;justify-content:space-between;gap:15px;align-items:center;position:sticky;top:0;background:#f5f4edf5;padding:14px 0;z-index:2}button{font:inherit;cursor:pointer;border:1px solid #cdd9d0;background:white;color:#173d32;border-radius:12px;padding:12px 18px}button:focus-visible,input:focus-visible{outline:3px solid #9ebf36;outline-offset:3px}.primary{background:#173d32;color:white;border:0}.question{background:white;border-radius:20px;padding:24px;margin:18px 0;border:1px solid #e0e5dd}.question h2{font-size:19px;line-height:1.7;margin:10px 0 20px}.number{font-size:12px;font-weight:bold;color:#608070}label{display:flex;align-items:flex-start;gap:12px;padding:14px;border:1px solid #e0e5dd;border-radius:12px;margin:10px 0;cursor:pointer;line-height:1.6}label:has(input:checked){background:#edf5da;border-color:#779a45}input{accent-color:#286247;margin-top:5px;flex-shrink:0}.correct{background:#e6f3e8!important;border-color:#58a16a!important}.wrong{background:#fce9e5!important;border-color:#c66b5e!important}.feedback{color:#42664f;font-size:14px;line-height:1.8}.bottom{display:grid;gap:15px;text-align:center}.bottom button{padding:18px}.note{color:#6c7e72;font-size:13px;line-height:1.7}.result{background:#173d32;color:white;border-radius:24px;padding:32px;text-align:center;margin:20px 0}.result strong{display:block;font-size:70px;color:#d7ed8a}.result p{line-height:1.8}.hidden{display:none}progress{width:100%;height:7px;accent-color:#6e982d}dialog{border:0;border-radius:20px;max-width:90vw;padding:26px;text-align:center}dialog::backdrop{background:#173d3299}dialog img{max-width:250px;width:100%}.share-url{overflow-wrap:anywhere;font-size:12px;max-width:300px}.badge{display:inline-block;background:#edf5da;color:#42664f;padding:5px 10px;border-radius:30px;font-size:12px}@media(max-width:480px){.question{padding:18px}label{padding:12px}.toolbar{font-size:13px}button{padding:11px 13px}}
header{display:flex;justify-content:space-between;align-items:center;gap:24px}.teacher-credit{text-align:right;flex-shrink:0;line-height:1.9}.teacher-credit strong{display:block;color:#d7ed8a;font-size:20px}.teacher-credit span{font-size:17px}@media(max-width:650px){header{flex-wrap:wrap;gap:8px}.teacher-credit{margin-left:auto}.teacher-credit strong{font-size:18px}.teacher-credit span{font-size:15px}}
</style></head><body><header><div><small>FINTECH PRACTICE · CHAPTER 07</small><h1>支付</h1><p>50 題單選 · 每題 2 分 · 滿分 100 分<br>依自己的步調練習，完成後立即查看得分與正確答案。</p></div><div class="teacher-credit"><strong>數位金融服務</strong><span>楊智宇老師</span></div></header><main><div class="toolbar"><span id="count" aria-live="polite">已作答 0 / 50 題</span></div><progress id="progress" max="50" value="0" aria-label="作答進度"></progress><section id="result" class="result hidden" tabindex="-1"></section><form id="quiz"><div id="questions"></div><div class="bottom"><button class="primary" type="submit">完成作答，查看得分</button><p class="note">無須登入。姓名、學號及成績不會上傳。<br>題目與選項每次練習會重新排列。</p></div></form><button id="retry" class="primary hidden" style="width:100%">重新練習</button></main><script>const QUESTIONS=[{"id":"c7q1","stem":"用手機在購物網站結帳，不必靠近實體讀卡設備，屬於什麼？","options":[{"id":"a","text":"遠端支付"},{"id":"b","text":"近端感應支付"},{"id":"c","text":"現金交付"},{"id":"d","text":"紙本票據交換"}],"correct":"a","difficulty":"easy"},{"id":"c7q2","stem":"手機靠近商店終端設備完成感應付款，較接近什麼？","options":[{"id":"b","text":"單純遠端訂閱"},{"id":"c","text":"紙本匯款"},{"id":"d","text":"現金找零"},{"id":"a","text":"近端支付"}],"correct":"a","difficulty":"easy"},{"id":"c7q3","stem":"NFC 支付主要使用哪種通訊特性？","options":[{"id":"c","text":"只有有線連接"},{"id":"d","text":"紙本光學掃描"},{"id":"a","text":"近距離無線通訊"},{"id":"b","text":"長距離衛星廣播"}],"correct":"a","difficulty":"easy"},{"id":"c7q4","stem":"支付代碼化的主要作用是什麼？","options":[{"id":"d","text":"把卡號公開給所有商家"},{"id":"a","text":"用代碼代替原始卡號以降低暴露"},{"id":"b","text":"把交易金額改為零"},{"id":"c","text":"讓持卡人不需授權"}],"correct":"a","difficulty":"easy"},{"id":"c7q5","stem":"商家用手機搭配外接收單設備接受刷卡，最接近哪種方式？","options":[{"id":"a","text":"mPOS"},{"id":"b","text":"純現金櫃檯"},{"id":"c","text":"銀行保管箱"},{"id":"d","text":"股票跟單"}],"correct":"a","difficulty":"easy"},{"id":"c7q6","stem":"顧客出示付款圖碼供店家掃描，主要使用哪種技術？","options":[{"id":"b","text":"虹膜掃描"},{"id":"c","text":"工作量證明"},{"id":"d","text":"文件雜湊"},{"id":"a","text":"QR Code"}],"correct":"a","difficulty":"easy"},{"id":"c7q7","stem":"用手機內的應用與主機端配合模擬卡片功能，較接近什麼？","options":[{"id":"c","text":"紙本存摺補登"},{"id":"d","text":"固定密碼卡"},{"id":"a","text":"HCE"},{"id":"b","text":"實體票據交換"}],"correct":"a","difficulty":"easy"},{"id":"c7q8","stem":"數位錢包中用來保護敏感支付資訊的安全元件，通常縮寫為何？","options":[{"id":"d","text":"NLP"},{"id":"a","text":"SE"},{"id":"b","text":"ETF"},{"id":"c","text":"AUM"}],"correct":"a","difficulty":"easy"},{"id":"c7q9","stem":"非現金支付是否一定表示社會完全沒有紙鈔？","options":[{"id":"a","text":"不一定，指交易採非現金方式"},{"id":"b","text":"一定要先廢除所有紙鈔"},{"id":"c","text":"只有加密貨幣才算"},{"id":"d","text":"只有銀行轉帳才算"}],"correct":"a","difficulty":"easy"},{"id":"c7q10","stem":"定期以綁定支付工具扣繳會員費，最接近哪種付款安排？","options":[{"id":"b","text":"現金預找零"},{"id":"c","text":"票據背書"},{"id":"d","text":"股票增資"},{"id":"a","text":"訂閱或週期付款"}],"correct":"a","difficulty":"easy"},{"id":"c7q11","stem":"評估支付普及度，除了交易總額也應看什麼？","options":[{"id":"c","text":"只有下載檔案大小"},{"id":"d","text":"只有手機售價"},{"id":"a","text":"交易筆數與使用情境"},{"id":"b","text":"只有廣告曝光"}],"correct":"a","difficulty":"medium"},{"id":"c7q12","stem":"現金交易的實體特性，會帶來哪種營運成本？","options":[{"id":"d","text":"每筆都需雲端伺服器"},{"id":"a","text":"運送、保管與清點成本"},{"id":"b","text":"必然沒有保管成本"},{"id":"c","text":"只剩網路傳輸費"}],"correct":"a","difficulty":"medium"},{"id":"c7q13","stem":"店家接受電子支付前，需確認什麼？","options":[{"id":"a","text":"收款方式、費率與入帳流程"},{"id":"b","text":"只確認顧客有手機"},{"id":"c","text":"只確認店招字體"},{"id":"d","text":"只確認平台追蹤人數"}],"correct":"a","difficulty":"medium"},{"id":"c7q14","stem":"付款者看到成功畫面，店家仍宜確認什麼？","options":[{"id":"b","text":"顧客手機桌布"},{"id":"c","text":"付款者的社群暱稱"},{"id":"d","text":"只看顧客口頭保證"},{"id":"a","text":"自身收款系統的交易狀態"}],"correct":"a","difficulty":"medium"},{"id":"c7q15","stem":"店家只接受一種錢包，顧客使用另一種，主要反映什麼問題？","options":[{"id":"c","text":"卡片無法計息"},{"id":"d","text":"現金供給不足"},{"id":"a","text":"支付工具與收款環境互通性"},{"id":"b","text":"付款金額必然錯誤"}],"correct":"a","difficulty":"medium"},{"id":"c7q16","stem":"支付工具以代碼替代卡號，仍須保護什麼？","options":[{"id":"d","text":"只要代碼化就不需任何控制"},{"id":"a","text":"代碼使用範圍與交易授權機制"},{"id":"b","text":"只有手機背蓋"},{"id":"c","text":"只有店家招牌"}],"correct":"a","difficulty":"medium"},{"id":"c7q17","stem":"HCE 與硬體安全元件方案的主要差異之一是什麼？","options":[{"id":"a","text":"卡片模擬與敏感資訊管理的實作位置不同"},{"id":"b","text":"HCE 不需要任何安全設計"},{"id":"c","text":"硬體元件只可存放圖片"},{"id":"d","text":"兩者都只靠紙本確認"}],"correct":"a","difficulty":"medium"},{"id":"c7q18","stem":"TSM 在行動支付生態系中，較典型的角色是什麼？","options":[{"id":"b","text":"決定央行利率"},{"id":"c","text":"為所有消費保本"},{"id":"d","text":"只發放折價券"},{"id":"a","text":"協調安全元件應用的部署與管理"}],"correct":"a","difficulty":"medium"},{"id":"c7q19","stem":"靜態商店 QR 圖碼被他人貼紙覆蓋，付款前最應核對什麼？","options":[{"id":"c","text":"店家裝潢是否漂亮"},{"id":"d","text":"手機是否為最新款"},{"id":"a","text":"收款對象與金額"},{"id":"b","text":"圖碼是否有顏色"}],"correct":"a","difficulty":"medium"},{"id":"c7q20","stem":"採用動態圖碼帶入本次金額，主要可降低哪種作業錯誤？","options":[{"id":"d","text":"全部帳務差異"},{"id":"a","text":"人工輸入付款資訊的錯誤"},{"id":"b","text":"所有詐欺與盜刷"},{"id":"c","text":"所有網路故障"}],"correct":"a","difficulty":"medium"},{"id":"c7q21","stem":"支付 App 加入指紋確認，主要改善哪項流程？","options":[{"id":"a","text":"付款授權時的身分確認與便利性"},{"id":"b","text":"保證商品一定出貨"},{"id":"c","text":"消除退款爭議"},{"id":"d","text":"讓商店不需對帳"}],"correct":"a","difficulty":"medium"},{"id":"c7q22","stem":"可穿戴裝置付款，較完整的安全設計為何？","options":[{"id":"b","text":"任何人拿到就能無限使用"},{"id":"c","text":"只看裝置外觀"},{"id":"d","text":"讓支付憑證永久公開"},{"id":"a","text":"結合裝置綁定與適當解鎖或授權控制"}],"correct":"a","difficulty":"medium"},{"id":"c7q23","stem":"無人商店利用感測器辨識取貨並扣款，仍需何種服務？","options":[{"id":"c","text":"所有扣款皆不得查詢"},{"id":"d","text":"只接受系統不可更正的結論"},{"id":"a","text":"誤判處理與帳單申訴"},{"id":"b","text":"完全取消交易紀錄"}],"correct":"a","difficulty":"medium"},{"id":"c7q24","stem":"小型攤商導入電子支付，常需克服什麼？","options":[{"id":"d","text":"必須拒收所有現金"},{"id":"a","text":"設備、費用、操作與結算習慣"},{"id":"b","text":"一定要先設立多家分店"},{"id":"c","text":"必須使用昂貴主機"}],"correct":"a","difficulty":"medium"},{"id":"c7q25","stem":"支付回饋吸引首購後，如何較能提高持續使用？","options":[{"id":"a","text":"改善實際可用場域與結帳體驗"},{"id":"b","text":"只增加一次性廣告"},{"id":"c","text":"把操作步驟變複雜"},{"id":"d","text":"讓收款更不穩定"}],"correct":"a","difficulty":"medium"},{"id":"c7q26","stem":"平台增加合作店家，主要能為使用者帶來什麼？","options":[{"id":"b","text":"保證所有商品最低價"},{"id":"c","text":"免除所有身分確認"},{"id":"d","text":"取消所有交易限制"},{"id":"a","text":"更多可使用支付工具的場景"}],"correct":"a","difficulty":"medium"},{"id":"c7q27","stem":"比較跨境匯款成本時，最應採哪種方式？","options":[{"id":"c","text":"只看網站顏色"},{"id":"d","text":"只看匯款人數"},{"id":"a","text":"比較到帳金額、匯差與全部費用"},{"id":"b","text":"只看宣傳中的零手續費"}],"correct":"a","difficulty":"medium"},{"id":"c7q28","stem":"匯款平台報價與成交之間有時間差，可能面臨什麼？","options":[{"id":"d","text":"所有平台都會自動補差額"},{"id":"a","text":"匯率變動導致實收金額不同"},{"id":"b","text":"金額必然保持不變"},{"id":"c","text":"匯率只會往有利方向走"}],"correct":"a","difficulty":"medium"},{"id":"c7q29","stem":"P2P 匯兌的核心安排較接近什麼？","options":[{"id":"a","text":"媒合相對方向的換匯需求"},{"id":"b","text":"完全不需任何服務平台"},{"id":"c","text":"所有交易都以比特幣完成"},{"id":"d","text":"只有同一家銀行內轉帳"}],"correct":"a","difficulty":"medium"},{"id":"c7q30","stem":"若某幣別只有大量買方、幾乎沒有賣方，平台可能面臨什麼？","options":[{"id":"b","text":"交易自然無限擴張"},{"id":"c","text":"匯率必然固定"},{"id":"d","text":"所有付款自動免等待"},{"id":"a","text":"媒合失衡與流動性壓力"}],"correct":"a","difficulty":"medium"},{"id":"c7q31","stem":"跨境匯款速度除了介面操作，還受何者影響？","options":[{"id":"c","text":"只有手機解析度"},{"id":"d","text":"只有付款者年齡"},{"id":"a","text":"身分審查、資金調度與收款端處理"},{"id":"b","text":"只有 App 圖示"}],"correct":"a","difficulty":"medium"},{"id":"c7q32","stem":"線上匯款仍需客戶身分調查，主要為何？","options":[{"id":"d","text":"讓所有交易永久不可追蹤"},{"id":"a","text":"辨識客戶並管理洗錢與詐欺風險"},{"id":"b","text":"純網路服務不會有金融風險"},{"id":"c","text":"只為增加點擊率"}],"correct":"a","difficulty":"medium"},{"id":"c7q33","stem":"回饋點數與銀行存款，應如何區分？","options":[{"id":"a","text":"須比較發行承諾、可用範圍與贖回條件"},{"id":"b","text":"只要能顯示數字就完全相同"},{"id":"c","text":"點數必然具有法償地位"},{"id":"d","text":"任何點數都由央行發行"}],"correct":"a","difficulty":"medium"},{"id":"c7q34","stem":"穩定的付款體驗主要需要什麼？","options":[{"id":"b","text":"只降低首頁文字量"},{"id":"c","text":"把所有例外都隱藏"},{"id":"d","text":"取消交易查詢"},{"id":"a","text":"可靠連線、清楚狀態與適當錯誤處理"}],"correct":"a","difficulty":"medium"},{"id":"c7q35","stem":"付款逾時後直接重按，系統最應避免什麼？","options":[{"id":"c","text":"讓客戶看到處理中"},{"id":"d","text":"保留原始請求紀錄"},{"id":"a","text":"同一筆消費重複扣款"},{"id":"b","text":"顯示訂單編號"}],"correct":"a","difficulty":"medium"},{"id":"c7q36","stem":"支付平台採用交易限額，主要用意是什麼？","options":[{"id":"d","text":"只為降低畫面字數"},{"id":"a","text":"依風險限制可能損失與異常活動"},{"id":"b","text":"保證每筆都是合法交易"},{"id":"c","text":"完全取代身分驗證"}],"correct":"a","difficulty":"medium"},{"id":"c7q37","stem":"兩家支付機構互通轉帳，除了技術連接還應確認什麼？","options":[{"id":"a","text":"身分、清算、責任與爭議處理安排"},{"id":"b","text":"雙方標誌同色"},{"id":"c","text":"所有帳號位數完全相同"},{"id":"d","text":"取消所有對帳工作"}],"correct":"a","difficulty":"medium"},{"id":"c7q38","stem":"商店收款與客戶付款紀錄不一致，較適當的處理是什麼？","options":[{"id":"b","text":"要求客戶立即再付一筆且不留紀錄"},{"id":"c","text":"只依付款截圖永久結案"},{"id":"d","text":"直接刪除有差異的交易"},{"id":"a","text":"依交易編號核對並走正式查核流程"}],"correct":"a","difficulty":"medium"},{"id":"c7q39","stem":"電子支付推廣也提供無障礙操作，主要支援什麼？","options":[{"id":"c","text":"讓所有人共享帳號"},{"id":"d","text":"取消全部風險管理"},{"id":"a","text":"不同能力使用者的支付可近性"},{"id":"b","text":"只降低商家稅率"}],"correct":"a","difficulty":"medium"},{"id":"c7q40","stem":"數位支付交易資料具有分析價值，但使用時仍應怎樣？","options":[{"id":"d","text":"只要是消費資料就沒有隱私"},{"id":"a","text":"符合適當用途並保護個人資訊"},{"id":"b","text":"無限制轉賣所有明細"},{"id":"c","text":"匿名顯示姓名即可任意使用"}],"correct":"a","difficulty":"medium"},{"id":"c7q41","stem":"同一支付代碼被限制於特定裝置，即使外洩仍可能降低什麼？","options":[{"id":"a","text":"跨裝置濫用的機會"},{"id":"b","text":"原始商店商品缺陷"},{"id":"c","text":"所有申訴成本"},{"id":"d","text":"所有幣別匯差"}],"correct":"a","difficulty":"hard"},{"id":"c7q42","stem":"某匯款服務零手續費卻採不利匯率，應如何判斷？","options":[{"id":"b","text":"零手續費即代表最便宜"},{"id":"c","text":"只要標榜即時就可忽略匯率"},{"id":"d","text":"匯差不是匯款成本"},{"id":"a","text":"以實際到帳金額比較總成本"}],"correct":"a","difficulty":"hard"},{"id":"c7q43","stem":"平台補貼帶來高交易量，補貼停止後多數人離開，應檢視什麼？","options":[{"id":"c","text":"把補貼當成永久獲利"},{"id":"d","text":"提高廣告字體即可解決"},{"id":"a","text":"自然留存、實際使用價值與可持續收入"},{"id":"b","text":"只公布累積下載量"}],"correct":"a","difficulty":"hard"},{"id":"c7q44","stem":"付款系統顯示失敗但資金已扣，重試設計應如何處理？","options":[{"id":"d","text":"讓使用者自行猜測"},{"id":"a","text":"先核對原交易狀態並防止重複執行"},{"id":"b","text":"每次直接建立新扣款"},{"id":"c","text":"把紀錄全部清空"}],"correct":"a","difficulty":"hard"},{"id":"c7q45","stem":"近端感應可在某些條件下離線處理，能否推論任何交易皆可離線完成？","options":[{"id":"a","text":"不能，仍取決於工具、風險與授權安排"},{"id":"b","text":"可以，NFC 必然無限離線支付"},{"id":"c","text":"可以，所有款項不需結算"},{"id":"d","text":"可以，離線就沒有詐欺"}],"correct":"a","difficulty":"hard"},{"id":"c7q46","stem":"支付資料分析能提供個人化優惠，設計上仍需平衡什麼？","options":[{"id":"b","text":"只有最高資料蒐集量"},{"id":"c","text":"只要優惠多就可略過用途限制"},{"id":"d","text":"只比較演算法執行速度"},{"id":"a","text":"服務價值、透明度與隱私控制"}],"correct":"a","difficulty":"hard"},{"id":"c7q47","stem":"一家市場全面取消現金但部分民眾無智慧裝置，可能造成什麼？","options":[{"id":"c","text":"資料安全必然提升"},{"id":"d","text":"所有交易費用必然下降"},{"id":"a","text":"支付排除與可近性問題"},{"id":"b","text":"所有使用者立即受益"}],"correct":"a","difficulty":"hard"},{"id":"c7q48","stem":"P2P 匯兌遇到單邊需求暴增，較完整的營運準備是什麼？","options":[{"id":"d","text":"以新客資金任意填補全部缺口"},{"id":"a","text":"資金調度、外部合作與清楚的報價及延遲告知"},{"id":"b","text":"保證所有方向永遠完全平衡"},{"id":"c","text":"隱藏等待時間"}],"correct":"a","difficulty":"hard"},{"id":"c7q49","stem":"支付工具綁定成功，但帳戶復原只憑公開資料，存在何種弱點？","options":[{"id":"a","text":"攻擊者可由復原流程取得支付控制"},{"id":"b","text":"綁定完成即可永久安全"},{"id":"c","text":"復原不會影響支付風險"},{"id":"d","text":"只要有回饋點數就能防盜"}],"correct":"a","difficulty":"hard"},{"id":"c7q50","stem":"交易筆數成長而詐欺損失同步上升，平台應如何評估成果？","options":[{"id":"b","text":"只看交易總額"},{"id":"c","text":"把所有損失歸零不列入"},{"id":"d","text":"只計算使用者註冊數"},{"id":"a","text":"綜合使用量、損失率、客訴與營運品質"}],"correct":"a","difficulty":"hard"}];</script><script>
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=crypto.getRandomValues(new Uint32Array(1))[0]%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
let questions=[],answers={},finished=false;const $=id=>document.getElementById(id);const escapeHtml=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){questions=shuffle(QUESTIONS).map(q=>({...q,options:shuffle(q.options)}));answers={};finished=false;$('result').classList.add('hidden');$('retry').classList.add('hidden');$('quiz').classList.remove('hidden');$('quiz').querySelector('.bottom').classList.remove('hidden');$('questions').innerHTML=questions.map((q,i)=>`<section class="question" id="${q.id}"><span class="number">QUESTION ${String(i+1).padStart(2,'0')} / 50</span><h2>${escapeHtml(q.stem)}</h2>${q.options.map((o,j)=>`<label><input type="radio" name="${q.id}" value="${o.id}"><span>${String.fromCharCode(65+j)}. ${escapeHtml(o.text)}</span></label>`).join('')}<div class="feedback"></div></section>`).join('');update()}
function update(){$('count').textContent=`已作答 ${Object.keys(answers).length} / 50 題`;$('progress').value=Object.keys(answers).length}
$('quiz').addEventListener('change',e=>{if(!finished&&e.target.type==='radio'){answers[e.target.name]=e.target.value;update()}});
$('quiz').addEventListener('submit',e=>{e.preventDefault();if(finished)return;const missing=50-Object.keys(answers).length;if(missing&&!confirm(`還有 ${missing} 題未作答，未答題以 0 分計算。確定完成？`))return;finished=true;let right=0;for(const q of questions){const section=$(q.id);const ok=answers[q.id]===q.correct;if(ok)right++;for(const input of section.querySelectorAll('input')){input.disabled=true;if(input.value===q.correct)input.closest('label').classList.add('correct');else if(input.checked)input.closest('label').classList.add('wrong')}section.querySelector('.feedback').textContent=ok?'答對了！':`${answers[q.id]?'本題答錯':'本題未作答'}。正確答案：${q.options.find(o=>o.id===q.correct).text}`}$('result').innerHTML=`<span>本次練習得分</span><strong>${right*2}<small style="font-size:22px"> 分</small></strong><p>答對 ${right} 題 · 答錯 ${50-right-missing} 題 · 未答 ${missing} 題</p><p>往下查看每題答案，或重新練習一次。</p>`;$('result').classList.remove('hidden');$('quiz').querySelector('.bottom').classList.add('hidden');$('retry').classList.remove('hidden');$('result').scrollIntoView({behavior:'smooth'});$('result').focus({preventScroll:true})});
$('retry').onclick=()=>{render();window.scrollTo({top:0,behavior:'smooth'})};render();
</script></body></html>
