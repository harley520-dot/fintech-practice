<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第一章｜金融科技練習</title><style>

mg{max-width:250px;width:100%}.share-url{overflow-wrap:anywhere;font-size:12px;max-width:300px}.badge{display:inline-block;background:#edf5da;color:#42664f;padding:5px 10px;border-radius:30px;font-size:12px}@media(max-width:480px){.question{padding:18px}label{padding:12px}.toolbar{font-size:13px}button{padding:11px 13px}}
header{display:flex;justify-content:space-between;align-items:center;gap:24px}.teacher-credit{text-align:right;flex-shrink:0;line-height:1.9}.teacher-credit strong{display:block;color:#d7ed8a;font-size:20px}.teacher-credit span{font-size:17px}@media(max-width:650px){header{flex-wrap:wrap;gap:8px}.teacher-credit{margin-left:auto}.teacher-credit strong{font-size:18px}.teacher-credit span{font-size:15px}}
</style></head><body><header><div><small>FINTECH PRACTICE · CHAPTER 01</small><h1>金融科技的發展演進</h1><p>50 題單選 · 每題 2 分 · 滿分 100 分<br>依自己的步調練習，完成後立即查看得分與正確答案。</p></div><div class="teacher-credit"><strong>數位金融服務</strong><span>楊智宇老師</span></div></header><main><div class="toolbar"><span id="count" aria-live="polite">已作答 0 / 50 題</span></div><progress id="progress" max="50" value="0" aria-label="作答進度"></progress><section id="result" class="result hidden" tabindex="-1"></section><form id="quiz"><div id="questions"></div><div class="bottom"><button class="primary" type="submit">完成作答，查看得分</button><p class="note">無須登入。姓名、學號及成績不會上傳。<br>題目與選項每次練習會重新排列。</p></div></form><button id="retry" class="primary hidden" style="width:100%">重新練習</button></main><script>const QUESTIONS=[{"id":"q1","stem":"金融科技最貼近下列哪一種描述？","options":[{"id":"a","text":"只把紙本帳單掃描成圖片"},{"id":"b","text":"利用科技推動金融服務、流程或商業模式創新"},{"id":"c","text":"完全以虛擬貨幣取代法定貨幣"},{"id":"d","text":"只在銀行內部更新電腦設備"}],"correct":"b","difficulty":"easy"},{"id":"q2","stem":"跨國金融資訊因海底電報線而能更快交換，最能代表哪個早期階段？","options":[{"id":"a","text":"FinTech 1.0"},{"id":"b","text":"FinTech 2.0"},{"id":"c","text":"FinTech 3.0"},{"id":"d","text":"FinTech 4.0"}],"correct":"a","difficulty":"easy"},{"id":"q3","stem":"SWIFT 與現代化自動清算機構的出現，通常歸在哪個階段？","options":[{"id":"a","text":"FinTech 4.0"},{"id":"b","text":"FinTech 1.0"},{"id":"c","text":"FinTech 2.0"},{"id":"d","text":"FinTech 3.0"}],"correct":"c","difficulty":"easy"},{"id":"q4","stem":"2008 年金融危機後，非銀行新創快速進入金融市場，最符合哪個階段？","options":[{"id":"a","text":"FinTech 2.0"},{"id":"b","text":"FinTech 3.0"},{"id":"c","text":"FinTech 1.0"},{"id":"d","text":"FinTech 4.0"}],"correct":"b","difficulty":"easy"},{"id":"q5","stem":"以 BigTech、數位平台與高度數位化為主要推力的發展，最接近哪個階段？","options":[{"id":"a","text":"FinTech 4.0"},{"id":"b","text":"FinTech 2.0"},{"id":"c","text":"FinTech 1.0"},{"id":"d","text":"FinTech 3.0"}],"correct":"a","difficulty":"easy"},{"id":"q6","stem":"P2P 借貸平台直接連結資金供需雙方，最能呈現哪種現象？","options":[{"id":"a","text":"再中介化"},{"id":"b","text":"流程內部化"},{"id":"c","text":"去中介化"},{"id":"d","text":"分行集中化"}],"correct":"c","difficulty":"easy"},{"id":"q7","stem":"銀行把基礎設施與功能透過 API 提供第三方使用，稱為什麼？","options":[{"id":"a","text":"銀行即服務"},{"id":"b","text":"封閉式銀行"},{"id":"c","text":"實體分行服務"},{"id":"d","text":"單一窗口清算"}],"correct":"a","difficulty":"easy"},{"id":"q8","stem":"監理沙盒的主要用途是什麼？","options":[{"id":"a","text":"永久免除所有法規"},{"id":"b","text":"在受控環境中測試創新並管理風險"},{"id":"c","text":"限制所有新創進入市場"},{"id":"d","text":"取代主管機關"}],"correct":"b","difficulty":"easy"},{"id":"q9","stem":"開放銀行最核心的概念是什麼？","options":[{"id":"a","text":"只讓銀行自行使用客戶資料"},{"id":"b","text":"停止提供 API"},{"id":"c","text":"在授權與規範下讓第三方存取或運用金融資料與服務"},{"id":"d","text":"全面取消身分驗證"}],"correct":"c","difficulty":"easy"},{"id":"q10","stem":"普惠金融最關心的目標是什麼？","options":[{"id":"a","text":"讓金融服務更容易被不同族群取得與使用"},{"id":"b","text":"只服務高資產客戶"},{"id":"c","text":"減少數位工具"},{"id":"d","text":"讓所有金融商品價格相同"}],"correct":"a","difficulty":"easy"},{"id":"q11","stem":"一家銀行用即時資料模型快速調整風險價格，主要反映智慧型機器的哪項特性？","options":[{"id":"a","text":"快速化"},{"id":"b","text":"紙本化"},{"id":"c","text":"區域化"},{"id":"d","text":"人工化"}],"correct":"a","difficulty":"medium"},{"id":"q12","stem":"自動化與標準化使部分金融流程可交由外部專業公司處理，這種變化稱為什麼？","options":[{"id":"a","text":"流程外部化"},{"id":"b","text":"顧客內部化"},{"id":"c","text":"市場封閉化"},{"id":"d","text":"資訊去識別化"}],"correct":"a","difficulty":"medium"},{"id":"q13","stem":"若非金融平台也能滿足日常金融需求，傳統銀行最可能面臨哪種改變？","options":[{"id":"a","text":"顧客關係主導權下降"},{"id":"b","text":"實體分行必然增加"},{"id":"c","text":"交叉銷售能力必然增強"},{"id":"d","text":"市場新進者完全消失"}],"correct":"a","difficulty":"medium"},{"id":"q14","stem":"傳統銀行從『一站購足』轉向服務特定族群，最可能產生哪個結果？","options":[{"id":"a","text":"規模優勢與交叉補貼能力受到挑戰"},{"id":"b","text":"所有商品都會免費"},{"id":"c","text":"不再需要資料分析"},{"id":"d","text":"法規自動失效"}],"correct":"a","difficulty":"medium"},{"id":"q15","stem":"銀行與電商合作，把付款、授信嵌入購物流程，最符合哪項策略？","options":[{"id":"a","text":"退出客戶生活場景"},{"id":"b","text":"跨業合作並延伸金融價值鏈"},{"id":"c","text":"只保留臨櫃交易"},{"id":"d","text":"停止數位轉型"}],"correct":"b","difficulty":"medium"},{"id":"q16","stem":"分行轉型後，行員較可能扮演哪種角色？","options":[{"id":"a","text":"協助客戶使用自助與數位工具"},{"id":"b","text":"只做手寫帳務"},{"id":"c","text":"拒絕遠端服務"},{"id":"d","text":"取代所有資訊系統"}],"correct":"a","difficulty":"medium"},{"id":"q17","stem":"銀行決策若以數據為基礎，科技在數位轉型中通常扮演什麼角色？","options":[{"id":"a","text":"核心能力與決策支援"},{"id":"b","text":"純裝飾用途"},{"id":"c","text":"只負責廣告排版"},{"id":"d","text":"與組織文化完全無關"}],"correct":"a","difficulty":"medium"},{"id":"q18","stem":"下列哪個組合最能描述完整的銀行數位轉型？","options":[{"id":"a","text":"技術導入、流程重設與組織文化改變"},{"id":"b","text":"只更換網站顏色"},{"id":"c","text":"只關閉分行"},{"id":"d","text":"只增加紙本表單"}],"correct":"a","difficulty":"medium"},{"id":"q19","stem":"某銀行開放帳戶查詢 API，讓獲授權的理財 App 顯示餘額。這最接近開放銀行的哪一類服務？","options":[{"id":"a","text":"公開產品資料"},{"id":"b","text":"消費者資訊查詢"},{"id":"c","text":"現金運送"},{"id":"d","text":"實體保管箱"}],"correct":"b","difficulty":"medium"},{"id":"q20","stem":"開放銀行採分階段推動的主要治理理由是什麼？","options":[{"id":"a","text":"讓風險、技術與責任可逐步驗證"},{"id":"b","text":"確保永遠不進入交易服務"},{"id":"c","text":"排除消費者授權"},{"id":"d","text":"避免任何跨業合作"}],"correct":"a","difficulty":"medium"},{"id":"q21","stem":"一家新創想在限定人數與金額下測試新型授信服務，最適合先採用哪個制度？","options":[{"id":"a","text":"監理沙盒或業務試辦"},{"id":"b","text":"完全無監管營運"},{"id":"c","text":"只申請商標"},{"id":"d","text":"關閉測試紀錄"}],"correct":"a","difficulty":"medium"},{"id":"q22","stem":"監理沙盒同時強調創新與風險控制，這表示主管機關採取何種思維？","options":[{"id":"a","text":"風險為基礎的監理"},{"id":"b","text":"零風險才准創新"},{"id":"c","text":"技術決定一切"},{"id":"d","text":"只看公司規模"}],"correct":"a","difficulty":"medium"},{"id":"q23","stem":"純網路銀行被期待產生『鯰魚效應』，主要意義為何？","options":[{"id":"a","text":"刺激既有業者改善數位服務與競爭"},{"id":"b","text":"讓所有實體銀行立即停業"},{"id":"c","text":"取消金融消費者保護"},{"id":"d","text":"使利率完全一致"}],"correct":"a","difficulty":"medium"},{"id":"q24","stem":"提升電子支付普及率時，下列何者最不合理？","options":[{"id":"a","text":"建立友善法規"},{"id":"b","text":"整合共通基礎設施"},{"id":"c","text":"強化消費者保護"},{"id":"d","text":"禁止跨機構合作"}],"correct":"d","difficulty":"medium"},{"id":"q25","stem":"下列哪一項不是典型金融科技底層或應用技術？","options":[{"id":"a","text":"雲端運算"},{"id":"b","text":"機器學習"},{"id":"c","text":"區塊鏈"},{"id":"d","text":"保險公司的組織名稱"}],"correct":"d","difficulty":"medium"},{"id":"q26","stem":"智慧型機器能減少人為錯誤，最直接對應哪項效益？","options":[{"id":"a","text":"準確化"},{"id":"b","text":"去中心化"},{"id":"c","text":"匿名化"},{"id":"d","text":"實體化"}],"correct":"a","difficulty":"medium"},{"id":"q27","stem":"智慧型機器要可靠運作，為什麼常需先建立精密衡量標準？","options":[{"id":"a","text":"讓判斷可被一致執行與比較"},{"id":"b","text":"讓資料完全消失"},{"id":"c","text":"避免使用任何模型"},{"id":"d","text":"強制每次產出不同結果"}],"correct":"a","difficulty":"medium"},{"id":"q28","stem":"金融機構從單獨提供商品，轉為與同業、異業共同提供服務，最符合哪項趨勢？","options":[{"id":"a","text":"合作式生態系"},{"id":"b","text":"市場完全封閉"},{"id":"c","text":"純紙本作業"},{"id":"d","text":"撤除所有通路"}],"correct":"a","difficulty":"medium"},{"id":"q29","stem":"線上服務從查餘額擴展到生活服務平台，主要想達成什麼？","options":[{"id":"a","text":"增加與客戶互動並融入日常情境"},{"id":"b","text":"降低服務可近性"},{"id":"c","text":"只服務內部員工"},{"id":"d","text":"排除非金融服務"}],"correct":"a","difficulty":"medium"},{"id":"q30","stem":"數位能力成為金融業核心競爭力時，分行較可能如何改變？","options":[{"id":"a","text":"轉為支援與顧問功能"},{"id":"b","text":"回到只收紙本"},{"id":"c","text":"成為唯一服務通路"},{"id":"d","text":"完全不使用資料"}],"correct":"a","difficulty":"medium"},{"id":"q31","stem":"下列哪個情境最能改善金融服務的可近性？","options":[{"id":"a","text":"用手機完成低成本的小額帳戶申請"},{"id":"b","text":"只接受都市總行臨櫃辦理"},{"id":"c","text":"提高所有服務的最低資產門檻"},{"id":"d","text":"取消遠端身分驗證"}],"correct":"a","difficulty":"medium"},{"id":"q32","stem":"金融科技可能增加市場集中風險，最需要關注哪類參與者的資料與平台優勢？","options":[{"id":"a","text":"大型科技平台"},{"id":"b","text":"單一自動櫃員機"},{"id":"c","text":"紙本帳本供應商"},{"id":"d","text":"一般文具店"}],"correct":"a","difficulty":"medium"},{"id":"q33","stem":"若平台掌握客戶入口，而銀行只負責後端商品，銀行可能逐漸成為什麼？","options":[{"id":"a","text":"金融商品供應商"},{"id":"b","text":"電信基地台"},{"id":"c","text":"主管機關"},{"id":"d","text":"會計準則制定者"}],"correct":"a","difficulty":"medium"},{"id":"q34","stem":"銀行規模優勢可能因交叉銷售下降而減弱，背後最直接的原因是什麼？","options":[{"id":"a","text":"客戶可在不同平台分別選擇最合適服務"},{"id":"b","text":"客戶只能向一家銀行購買全部商品"},{"id":"c","text":"網路完全停止運作"},{"id":"d","text":"所有新創都退出市場"}],"correct":"a","difficulty":"medium"},{"id":"q35","stem":"傳統銀行受到法規、資本與風險偏好限制，可能留下什麼市場空間？","options":[{"id":"a","text":"新平台服務未被充分滿足的資金供需"},{"id":"b","text":"所有借貸需求消失"},{"id":"c","text":"只剩紙本存款"},{"id":"d","text":"禁止任何風險定價"}],"correct":"a","difficulty":"medium"},{"id":"q36","stem":"金融危機後投資銀行降低風險承擔，可能如何促成去中介化？","options":[{"id":"a","text":"部分需求改由新平台直接媒合"},{"id":"b","text":"所有交易都改回現金"},{"id":"c","text":"客戶不再需要資金"},{"id":"d","text":"清算制度完全消失"}],"correct":"a","difficulty":"medium"},{"id":"q37","stem":"下列哪個設計最符合『以消費者為中心』的數位金融？","options":[{"id":"a","text":"依旅程整合通路，讓客戶可無縫續辦"},{"id":"b","text":"每個通路資料完全不互通"},{"id":"c","text":"只用內部術語呈現"},{"id":"d","text":"每次轉換裝置都要重新填全部資料"}],"correct":"a","difficulty":"medium"},{"id":"q38","stem":"銀行即服務與開放銀行的共同基礎通常是什麼？","options":[{"id":"a","text":"標準化且受控的 API"},{"id":"b","text":"手寫傳票"},{"id":"c","text":"封閉的單機程式"},{"id":"d","text":"實體印章交換"}],"correct":"a","difficulty":"medium"},{"id":"q39","stem":"若 API 合作缺乏權限管理，最可能直接增加哪項風險？","options":[{"id":"a","text":"資料被未授權存取"},{"id":"b","text":"分行租金下降"},{"id":"c","text":"紙張成本增加"},{"id":"d","text":"硬幣重量改變"}],"correct":"a","difficulty":"medium"},{"id":"q40","stem":"金融科技政策同時建設行動通訊、雲端、大數據、生物辨識與區塊鏈，主要目的為何？","options":[{"id":"a","text":"建立支持多種創新服務的共同技術基礎"},{"id":"b","text":"指定所有業者只能用一項技術"},{"id":"c","text":"排除跨領域應用"},{"id":"d","text":"只改善紙本保存"}],"correct":"a","difficulty":"medium"},{"id":"q41","stem":"某平台撮合借貸但仍負責信用評估、資訊揭露與還款管理。這說明去中介化的哪個重要限制？","options":[{"id":"a","text":"中介功能可能被拆分或轉移，而非完全消失"},{"id":"b","text":"任何中介功能都必然消失"},{"id":"c","text":"平台不需治理風險"},{"id":"d","text":"信用資訊已不再重要"}],"correct":"a","difficulty":"hard"},{"id":"q42","stem":"大型平台同時掌握流量、資料與金融入口。下列哪組政策最能兼顧創新與競爭？","options":[{"id":"a","text":"資料可攜、API 規範與競爭監測"},{"id":"b","text":"永久禁止新服務"},{"id":"c","text":"只補助最大平台"},{"id":"d","text":"取消消費者授權"}],"correct":"a","difficulty":"hard"},{"id":"q43","stem":"銀行導入自動決策後速度提升，但同一偏誤也被大量複製。這最能說明哪項治理原則？","options":[{"id":"a","text":"標準化必須搭配模型監控與人工覆核"},{"id":"b","text":"速度可取代所有控制"},{"id":"c","text":"資料越多就不會偏誤"},{"id":"d","text":"外包後銀行不再負責"}],"correct":"a","difficulty":"hard"},{"id":"q44","stem":"某銀行把授信模型外包給科技商。發生錯誤時，最合理的責任配置為何？","options":[{"id":"a","text":"銀行仍須治理委外風險，供應商依契約與專業責任配合"},{"id":"b","text":"責任全部自動轉給客戶"},{"id":"c","text":"外包後無人需負責"},{"id":"d","text":"只要模型保密就無須稽核"}],"correct":"a","difficulty":"hard"},{"id":"q45","stem":"開放銀行進入交易階段，比單純公開產品資訊多出的關鍵風險是什麼？","options":[{"id":"a","text":"未授權交易與操作風險"},{"id":"b","text":"網站顏色不一致"},{"id":"c","text":"產品名稱太短"},{"id":"d","text":"分行招牌老舊"}],"correct":"a","difficulty":"hard"},{"id":"q46","stem":"監理沙盒測試成功後，為何仍不能直接推論服務可無限制全面上線？","options":[{"id":"a","text":"小規模受控結果仍需法規調整、擴充測試與持續監理"},{"id":"b","text":"沙盒結果永遠無效"},{"id":"c","text":"創新服務不需要市場驗證"},{"id":"d","text":"只有技術速度會影響上線"}],"correct":"a","difficulty":"hard"},{"id":"q47","stem":"銀行把服務嵌入外部平台後，最需要避免哪種策略盲點？","options":[{"id":"a","text":"只追求流量而忽略客戶關係、資料權利與風險責任"},{"id":"b","text":"保留清楚的授權流程"},{"id":"c","text":"設定 API 權限"},{"id":"d","text":"持續監測合作夥伴"}],"correct":"a","difficulty":"hard"},{"id":"q48","stem":"若數位金融讓弱勢族群更易開戶，卻因模型資料不足而提高其拒絕率，應如何評價？","options":[{"id":"a","text":"可近性改善但公平性可能惡化，需同時衡量"},{"id":"b","text":"只要能線上申請就已達成普惠"},{"id":"c","text":"拒絕率與普惠完全無關"},{"id":"d","text":"應取消所有風險評估"}],"correct":"a","difficulty":"hard"},{"id":"q49","stem":"一家銀行同時推動 API、生態合作與分行顧問化。三者共同指向哪個轉型方向？","options":[{"id":"a","text":"從封閉產品通路轉向多接點服務平台"},{"id":"b","text":"回到單一臨櫃模式"},{"id":"c","text":"縮減所有客戶互動"},{"id":"d","text":"讓科技與業務完全分離"}],"correct":"a","difficulty":"hard"},{"id":"q50","stem":"面對 BigTech 的集中優勢，傳統銀行最具韌性的回應組合為何？","options":[{"id":"a","text":"可信任的資料治理、開放合作與差異化服務"},{"id":"b","text":"只增加分行數量且停止 API"},{"id":"c","text":"模仿平台但忽略法遵"},{"id":"d","text":"完全退出數位通路"}],"correct":"a","difficulty":"hard"}];</script><script>
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=crypto.getRandomValues(new Uint32Array(1))[0]%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
let questions=[],answers={},finished=false;const $=id=>document.getElementById(id);const escapeHtml=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){questions=shuffle(QUESTIONS).map(q=>({...q,options:shuffle(q.options)}));answers={};finished=false;$('result').classList.add('hidden');$('retry').classList.add('hidden');$('quiz').classList.remove('hidden');$('quiz').querySelector('.bottom').classList.remove('hidden');$('questions').innerHTML=questions.map((q,i)=>`<section class="question" id="${q.id}"><span class="number">QUESTION ${String(i+1).padStart(2,'0')} / 50</span><h2>${escapeHtml(q.stem)}</h2>${q.options.map((o,j)=>`<label><input type="radio" name="${q.id}" value="${o.id}"><span>${String.fromCharCode(65+j)}. ${escapeHtml(o.text)}</span></label>`).join('')}<div class="feedback"></div></section>`).join('');update()}
function update(){$('count').textContent=`已作答 ${Object.keys(answers).length} / 50 題`;$('progress').value=Object.keys(answers).length}
$('quiz').addEventListener('change',e=>{if(!finished&&e.target.type==='radio'){answers[e.target.name]=e.target.value;update()}});
$('quiz').addEventListener('submit',e=>{e.preventDefault();if(finished)return;const missing=50-Object.keys(answers).length;if(missing&&!confirm(`還有 ${missing} 題未作答，未答題以 0 分計算。確定完成？`))return;finished=true;let right=0;for(const q of questions){const section=$(q.id);const ok=answers[q.id]===q.correct;if(ok)right++;for(const input of section.querySelectorAll('input')){input.disabled=true;if(input.value===q.correct)input.closest('label').classList.add('correct');else if(input.checked)input.closest('label').classList.add('wrong')}section.querySelector('.feedback').textContent=ok?'答對了！':`${answers[q.id]?'本題答錯':'本題未作答'}。正確答案：${q.options.find(o=>o.id===q.correct).text}`}$('result').innerHTML=`<span>本次練習得分</span><strong>${right*2}<small style="font-size:22px"> 分</small></strong><p>答對 ${right} 題 · 答錯 ${50-right-missing} 題 · 未答 ${missing} 題</p><p>往下查看每題答案，或重新練習一次。</p>`;$('result').classList.remove('hidden');$('quiz').querySelector('.bottom').classList.add('hidden');$('retry').classList.remove('hidden');$('result').scrollIntoView({behavior:'smooth'});$('result').focus({preventScroll:true})});
$('retry').onclick=()=>{render();window.scrollTo({top:0,behavior:'smooth'})};render();
</script></body></html>
