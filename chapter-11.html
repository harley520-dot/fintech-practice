<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第11章｜金融科技與投資管理練習</title><style>
:root{font-family:"Microsoft JhengHei",sans-serif;color:#173d32;background:#f5f4ed}*{box-sizing:border-box}body{margin:0}header{background:#173d32;color:#fff;padding:22px max(20px,calc((100vw - 850px)/2));}header small{color:#d7ed8a;letter-spacing:3px}h1{font-size:clamp(26px,5vw,40px);margin:12px 0}header p{color:#c7d7cf;line-height:1.7}main{max-width:850px;margin:auto;padding:24px 18px 60px}.toolbar{display:flex;justify-content:space-between;gap:15px;align-items:center;position:sticky;top:0;background:#f5f4edf5;padding:14px 0;z-index:2}button{font:inherit;cursor:pointer;border:1px solid #cdd9d0;background:white;color:#173d32;border-radius:12px;padding:12px 18px}button:focus-visible,input:focus-visible{outline:3px solid #9ebf36;outline-offset:3px}.primary{background:#173d32;color:white;border:0}.question{background:white;border-radius:20px;padding:24px;margin:18px 0;border:1px solid #e0e5dd}.question h2{font-size:19px;line-height:1.7;margin:10px 0 20px}.number{font-size:12px;font-weight:bold;color:#608070}label{display:flex;align-items:flex-start;gap:12px;padding:14px;border:1px solid #e0e5dd;border-radius:12px;margin:10px 0;cursor:pointer;line-height:1.6}label:has(input:checked){background:#edf5da;border-color:#779a45}input{accent-color:#286247;margin-top:5px;flex-shrink:0}.correct{background:#e6f3e8!important;border-color:#58a16a!important}.wrong{background:#fce9e5!important;border-color:#c66b5e!important}.feedback{color:#42664f;font-size:14px;line-height:1.8}.bottom{display:grid;gap:15px;text-align:center}.bottom button{padding:18px}.note{color:#6c7e72;font-size:13px;line-height:1.7}.result{background:#173d32;color:white;border-radius:24px;padding:32px;text-align:center;margin:20px 0}.result strong{display:block;font-size:70px;color:#d7ed8a}.result p{line-height:1.8}.hidden{display:none}progress{width:100%;height:7px;accent-color:#6e982d}dialog{border:0;border-radius:20px;max-width:90vw;padding:26px;text-align:center}dialog::backdrop{background:#173d3299}dialog img{max-width:250px;width:100%}.share-url{overflow-wrap:anywhere;font-size:12px;max-width:300px}.badge{display:inline-block;background:#edf5da;color:#42664f;padding:5px 10px;border-radius:30px;font-size:12px}@media(max-width:480px){.question{padding:18px}label{padding:12px}.toolbar{font-size:13px}button{padding:11px 13px}}
header{display:flex;justify-content:space-between;align-items:center;gap:24px}.teacher-credit{text-align:right;flex-shrink:0;line-height:1.9}.teacher-credit strong{display:block;color:#d7ed8a;font-size:20px}.teacher-credit span{font-size:17px}@media(max-width:650px){header{flex-wrap:wrap;gap:8px}.teacher-credit{margin-left:auto}.teacher-credit strong{font-size:18px}.teacher-credit span{font-size:15px}}
</style></head><body><header><div><small>FINTECH PRACTICE · CHAPTER 11</small><h1>金融科技與投資管理</h1><p>50 題單選 · 每題 2 分 · 滿分 100 分<br>依自己的步調練習，完成後立即查看得分與正確答案。</p></div><div class="teacher-credit"><strong>數位金融服務</strong><span>楊智宇老師</span></div></header><main><div class="toolbar"><span id="count" aria-live="polite">已作答 0 / 50 題</span></div><progress id="progress" max="50" value="0" aria-label="作答進度"></progress><section id="result" class="result hidden" tabindex="-1"></section><form id="quiz"><div id="questions"></div><div class="bottom"><button class="primary" type="submit">完成作答，查看得分</button><p class="note">無須登入。姓名、學號及成績不會上傳。<br>題目與選項每次練習會重新排列。</p></div></form><button id="retry" class="primary hidden" style="width:100%">重新練習</button></main><script>const QUESTIONS=[{"id":"c11q1","stem":"平台讓小額投資人取得資訊與工具自行選擇組合，主要體現什麼？","options":[{"id":"a","text":"投資者賦權"},{"id":"b","text":"強制同價"},{"id":"c","text":"保證收益"},{"id":"d","text":"貨幣發行"}],"correct":"a","difficulty":"easy"},{"id":"c11q2","stem":"把部分投資管理流程交給外部專業系統支援，稱為什麼？","options":[{"id":"b","text":"資產稀釋"},{"id":"c","text":"金融清算"},{"id":"d","text":"紙本封存"},{"id":"a","text":"流程外部化"}],"correct":"a","difficulty":"easy"},{"id":"c11q3","stem":"客戶填問卷後取得系統產生的組合建議，屬於什麼？","options":[{"id":"c","text":"保險核保"},{"id":"d","text":"存摺補登"},{"id":"a","text":"自動化投資顧問"},{"id":"b","text":"支付收單"}],"correct":"a","difficulty":"easy"},{"id":"c11q4","stem":"了解客戶投資目標與風險承受度，主要屬於哪個步驟？","options":[{"id":"d","text":"帳單寄送"},{"id":"a","text":"了解客戶作業"},{"id":"b","text":"市場撮合"},{"id":"c","text":"交易清算"}],"correct":"a","difficulty":"easy"},{"id":"c11q5","stem":"系統把偏離目標的股票與債券比例調回，這是什麼？","options":[{"id":"a","text":"再平衡"},{"id":"b","text":"股權稀釋"},{"id":"c","text":"信用核貸"},{"id":"d","text":"資料去重"}],"correct":"a","difficulty":"easy"},{"id":"c11q6","stem":"AUM 的意思最接近什麼？","options":[{"id":"b","text":"固定保證報酬率"},{"id":"c","text":"當日成交筆數"},{"id":"d","text":"廣告觸及人數"},{"id":"a","text":"管理資產規模"}],"correct":"a","difficulty":"easy"},{"id":"c11q7","stem":"複製另一位交易者的買賣操作，較接近什麼？","options":[{"id":"c","text":"存款保管"},{"id":"d","text":"票據背書"},{"id":"a","text":"跟單交易"},{"id":"b","text":"產品預購"}],"correct":"a","difficulty":"easy"},{"id":"c11q8","stem":"程式依策略決定下單時間、價格與數量，屬於什麼？","options":[{"id":"d","text":"純資料備份"},{"id":"a","text":"演算法交易"},{"id":"b","text":"手寫報表"},{"id":"c","text":"保險理賠"}],"correct":"a","difficulty":"easy"},{"id":"c11q9","stem":"以極低延遲與高速運算爭取短暫交易機會，最接近什麼？","options":[{"id":"a","text":"高頻交易"},{"id":"b","text":"長期固定存款"},{"id":"c","text":"捐贈募資"},{"id":"d","text":"紙本交易"}],"correct":"a","difficulty":"easy"},{"id":"c11q10","stem":"演算法與真人顧問搭配提供服務，較接近什麼模式？","options":[{"id":"b","text":"純人工抄錄"},{"id":"c","text":"只有資訊公告"},{"id":"d","text":"不提供任何建議"},{"id":"a","text":"人機結合理財"}],"correct":"a","difficulty":"easy"},{"id":"c11q11","stem":"客戶想兩年後支付學費，組合設計最應先考量什麼？","options":[{"id":"c","text":"只看平台首頁推薦"},{"id":"d","text":"把所有人放在同一組合"},{"id":"a","text":"資金用途、期間與風險承受能力"},{"id":"b","text":"只挑十年報酬最高商品"}],"correct":"a","difficulty":"medium"},{"id":"c11q12","stem":"問卷答覆互相矛盾，較合理的處理為何？","options":[{"id":"d","text":"把矛盾當作高風險偏好"},{"id":"a","text":"釐清後再提出適當建議"},{"id":"b","text":"直接挑最積極答案"},{"id":"c","text":"全部忽略採預設值"}],"correct":"a","difficulty":"medium"},{"id":"c11q13","stem":"自動化服務降低最低投資門檻，主要可能改善什麼？","options":[{"id":"a","text":"小額投資者取得服務的機會"},{"id":"b","text":"所有商品的保本程度"},{"id":"c","text":"所有市場風險"},{"id":"d","text":"每位客戶投資報酬"}],"correct":"a","difficulty":"medium"},{"id":"c11q14","stem":"標準化產品與流程較容易規模化，主要原因為何？","options":[{"id":"b","text":"所有客戶需求完全一致"},{"id":"c","text":"完全不需客戶資料"},{"id":"d","text":"任何商品都能無限交易"},{"id":"a","text":"可重複使用系統與降低單位服務成本"}],"correct":"a","difficulty":"medium"},{"id":"c11q15","stem":"系統提供建議但由客戶自行決定交易，較接近什麼？","options":[{"id":"c","text":"保證收益帳戶"},{"id":"d","text":"純現金保管"},{"id":"a","text":"諮詢建議型服務"},{"id":"b","text":"自動全權執行所有交易"}],"correct":"a","difficulty":"medium"},{"id":"c11q16","stem":"系統依約管理資產並執行交易，與純建議型的差異在何處？","options":[{"id":"d","text":"是否可計算報酬"},{"id":"a","text":"交易執行與資產管理授權範圍"},{"id":"b","text":"是否一定使用紙本"},{"id":"c","text":"是否顯示手機畫面"}],"correct":"a","difficulty":"medium"},{"id":"c11q17","stem":"向財富管理機構提供演算法工具而不直接服務散戶，較接近什麼？","options":[{"id":"a","text":"B2B 投顧平台"},{"id":"b","text":"回饋型募資"},{"id":"c","text":"消費收單"},{"id":"d","text":"現金運送"}],"correct":"a","difficulty":"medium"},{"id":"c11q18","stem":"ETF 常被自動化投資服務使用，較合理的考量為何？","options":[{"id":"b","text":"所有 ETF 都沒有風險"},{"id":"c","text":"ETF 一定提供固定收益"},{"id":"d","text":"所有 ETF 都有相同費用"},{"id":"a","text":"可提供相對標準化的資產配置工具"}],"correct":"a","difficulty":"medium"},{"id":"c11q19","stem":"比較理財平台費用時，應納入什麼？","options":[{"id":"c","text":"只有帳戶開戶禮"},{"id":"d","text":"只看優惠天數"},{"id":"a","text":"顧問費、商品費用與交易成本"},{"id":"b","text":"只有廣告中的最低費率"}],"correct":"a","difficulty":"medium"},{"id":"c11q20","stem":"管理資產 100 萬元、年費率 0.5%，不考慮其他變動時年費為多少？","options":[{"id":"d","text":"50 元"},{"id":"a","text":"5,000 元"},{"id":"b","text":"500 元"},{"id":"c","text":"50,000 元"}],"correct":"a","difficulty":"medium"},{"id":"c11q21","stem":"依 AUM 收費，服務收入通常受什麼影響？","options":[{"id":"a","text":"管理規模與適用費率"},{"id":"b","text":"只受 App 下載量影響"},{"id":"c","text":"與客戶資產完全無關"},{"id":"d","text":"只看交易訊號次數"}],"correct":"a","difficulty":"medium"},{"id":"c11q22","stem":"組合股票由 60% 升至 75%，再平衡的主要目的為何？","options":[{"id":"b","text":"保證短期一定獲利"},{"id":"c","text":"永遠追買漲最多的資產"},{"id":"d","text":"直接提高借款額度"},{"id":"a","text":"讓風險暴露回到約定配置附近"}],"correct":"a","difficulty":"medium"},{"id":"c11q23","stem":"以新增資金買入低於目標比例的資產，可用來做什麼？","options":[{"id":"c","text":"免除所有授權"},{"id":"d","text":"把資產價格固定"},{"id":"a","text":"協助再平衡並可能減少賣出需求"},{"id":"b","text":"保證沒有交易成本"}],"correct":"a","difficulty":"medium"},{"id":"c11q24","stem":"自動再平衡啟動前，客戶應理解什麼？","options":[{"id":"d","text":"程式會忽略原有約定"},{"id":"a","text":"觸發條件、執行方式與可能成本"},{"id":"b","text":"只需知道系統名稱"},{"id":"c","text":"所有交易都不可能虧損"}],"correct":"a","difficulty":"medium"},{"id":"c11q25","stem":"客戶不再需要自動調整服務，應有什麼功能？","options":[{"id":"a","text":"依約終止或變更授權的機制"},{"id":"b","text":"只允許刪除 App 圖示"},{"id":"c","text":"永遠不能停止交易"},{"id":"d","text":"以換手機代替正式終止"}],"correct":"a","difficulty":"medium"},{"id":"c11q26","stem":"客戶財務狀況改變後，應如何處理原建議？","options":[{"id":"b","text":"永遠沿用首次問卷"},{"id":"c","text":"只提高交易頻率"},{"id":"d","text":"只更改姓名欄位"},{"id":"a","text":"更新資料並重新評估適合性"}],"correct":"a","difficulty":"medium"},{"id":"c11q27","stem":"上線前測試演算法，主要確認什麼？","options":[{"id":"c","text":"只確認畫面配色"},{"id":"d","text":"宣傳影片是否流暢"},{"id":"a","text":"方法與輸出是否符合預期及服務範圍"},{"id":"b","text":"只看程式行數"}],"correct":"a","difficulty":"medium"},{"id":"c11q28","stem":"上線後定期審核，主要為了什麼？","options":[{"id":"d","text":"只更新商標"},{"id":"a","text":"持續檢查模型、資料與運作表現"},{"id":"b","text":"證明第一次測試永遠有效"},{"id":"c","text":"取消所有維護"}],"correct":"a","difficulty":"medium"},{"id":"c11q29","stem":"市場劇烈變動時，自動投顧應具備什麼？","options":[{"id":"a","text":"風險處理、監控與必要的服務控制程序"},{"id":"b","text":"假定歷史模型必然有效"},{"id":"c","text":"持續無限制下單"},{"id":"d","text":"只發布促銷訊息"}],"correct":"a","difficulty":"medium"},{"id":"c11q30","stem":"推薦自家費用較高商品，卻未說明選擇理由，主要涉及什麼？","options":[{"id":"b","text":"純粹網路延遲"},{"id":"c","text":"市場流動性必然提高"},{"id":"d","text":"帳戶持股稀釋"},{"id":"a","text":"利益衝突與建議客觀性"}],"correct":"a","difficulty":"medium"},{"id":"c11q31","stem":"社群投資顯示高手歷史報酬，追隨者仍需注意什麼？","options":[{"id":"c","text":"粉絲越多虧損越少"},{"id":"d","text":"跟單沒有任何交易成本"},{"id":"a","text":"風險、期間、費用及未來不確定性"},{"id":"b","text":"過去獲利即保證未來獲利"}],"correct":"a","difficulty":"medium"},{"id":"c11q32","stem":"手動跟單與自動跟單最直接差異為何？","options":[{"id":"d","text":"是否能完全消除風險"},{"id":"a","text":"是否逐次由使用者決定執行"},{"id":"b","text":"是否一定投資不同商品"},{"id":"c","text":"是否具備政府保證"}],"correct":"a","difficulty":"medium"},{"id":"c11q33","stem":"跟單者資金較少，最低交易單位不同，可能造成什麼？","options":[{"id":"a","text":"實際持倉比例與被跟隨者不同"},{"id":"b","text":"兩人報酬一定相同"},{"id":"c","text":"系統自動補貼全部差額"},{"id":"d","text":"小額資金沒有市場風險"}],"correct":"a","difficulty":"medium"},{"id":"c11q34","stem":"演算法把大訂單拆成多次執行，主要可考量什麼？","options":[{"id":"b","text":"所有部位必然立刻獲利"},{"id":"c","text":"把商品變成保本"},{"id":"d","text":"讓交易不需資金"},{"id":"a","text":"市場衝擊與執行成本"}],"correct":"a","difficulty":"medium"},{"id":"c11q35","stem":"高頻交易把伺服器設在交易所附近，主要為了什麼？","options":[{"id":"c","text":"提高每股面額"},{"id":"d","text":"保證所有掛單成交"},{"id":"a","text":"降低通訊延遲"},{"id":"b","text":"降低公司所得稅"}],"correct":"a","difficulty":"medium"},{"id":"c11q36","stem":"掛單量很大但多數迅速撤回，解讀流動性時應注意什麼？","options":[{"id":"d","text":"全部掛單都必須成交"},{"id":"a","text":"可見委託未必轉為可持續成交深度"},{"id":"b","text":"掛單越多就一定穩定"},{"id":"c","text":"撤單不會影響任何人"}],"correct":"a","difficulty":"medium"},{"id":"c11q37","stem":"程式錯誤導致持續異常下單，最需要什麼控制？","options":[{"id":"a","text":"可即時停止與限制異常交易"},{"id":"b","text":"只增加下單速度"},{"id":"c","text":"停止保存日誌"},{"id":"d","text":"只更換首頁文字"}],"correct":"a","difficulty":"medium"},{"id":"c11q38","stem":"外部投資系統故障，金融機構的合理安排為何？","options":[{"id":"b","text":"全部責任自動消失"},{"id":"c","text":"只等供應商自行處理"},{"id":"d","text":"不需告知任何受影響客戶"},{"id":"a","text":"有監控、責任分工與備援處置"}],"correct":"a","difficulty":"medium"},{"id":"c11q39","stem":"使用低費率服務時，投資人仍須理解什麼？","options":[{"id":"c","text":"便宜服務只能投資現金"},{"id":"d","text":"低門檻等於高報酬"},{"id":"a","text":"費用較低不代表投資風險較低"},{"id":"b","text":"低費用即表示本金有保障"}],"correct":"a","difficulty":"medium"},{"id":"c11q40","stem":"評估自動理財品質，較完整的方式為何？","options":[{"id":"d","text":"只看使用者下載數"},{"id":"a","text":"適合性、成本、風險與服務可靠性並看"},{"id":"b","text":"只看單月報酬"},{"id":"c","text":"只看模型名稱"}],"correct":"a","difficulty":"medium"},{"id":"c11q41","stem":"回測排除已下市公司，策略績效很好，可能有什麼偏差？","options":[{"id":"a","text":"存活者偏差"},{"id":"b","text":"生物誤拒"},{"id":"c","text":"支付代碼化"},{"id":"d","text":"全有或全無"}],"correct":"a","difficulty":"hard"},{"id":"c11q42","stem":"模型把未來公布的財報用於過去交易決策，主要有何問題？","options":[{"id":"b","text":"資料格式過於標準"},{"id":"c","text":"交易費率太低"},{"id":"d","text":"投資期限過長"},{"id":"a","text":"前視偏差或資訊洩漏"}],"correct":"a","difficulty":"hard"},{"id":"c11q43","stem":"兩個組合報酬相同，但一個承擔更高波動，該怎麼比較？","options":[{"id":"c","text":"波動越大一定越好"},{"id":"d","text":"風險與建議無關"},{"id":"a","text":"同時比較風險與客戶目標"},{"id":"b","text":"只看報酬便認定同等合適"}],"correct":"a","difficulty":"hard"},{"id":"c11q44","stem":"再平衡門檻設得過小而頻繁買賣，可能導致什麼？","options":[{"id":"d","text":"交易越多淨報酬必然越高"},{"id":"a","text":"交易成本侵蝕配置效益"},{"id":"b","text":"所有風險自動歸零"},{"id":"c","text":"每次都保證低買高賣"}],"correct":"a","difficulty":"hard"},{"id":"c11q45","stem":"股票 60 萬、債券 40 萬，股票漲至 90 萬而債券不變；股票新比例約多少？","options":[{"id":"a","text":"69.2%"},{"id":"b","text":"60%"},{"id":"c","text":"75%"},{"id":"d","text":"90%"}],"correct":"a","difficulty":"hard"},{"id":"c11q46","stem":"大型事件使市場流動性消失，模型依歷史價格下單仍可能怎樣？","options":[{"id":"b","text":"必然按歷史價格成交"},{"id":"c","text":"演算法可消除所有交易限制"},{"id":"d","text":"電腦速度可代替市場買方"},{"id":"a","text":"遭遇滑價、未成交與風險放大"}],"correct":"a","difficulty":"hard"},{"id":"c11q47","stem":"多家理財系統同時觸發相似賣出策略，可能產生什麼？","options":[{"id":"c","text":"完全獨立的價格變動"},{"id":"d","text":"資產價格自動固定"},{"id":"a","text":"同步交易放大市場壓力"},{"id":"b","text":"必然提升所有市場深度"}],"correct":"a","difficulty":"hard"},{"id":"c11q48","stem":"高手只展示最成功帳號而隱藏失敗帳號，跟單者應注意什麼？","options":[{"id":"d","text":"平台不需要任何資料驗證"},{"id":"a","text":"選擇性揭露扭曲真實績效"},{"id":"b","text":"成功案例足以代表全部策略"},{"id":"c","text":"帳號越多就一定分散"}],"correct":"a","difficulty":"hard"},{"id":"c11q49","stem":"人機結合服務加入真人顧問後，應如何分配責任？","options":[{"id":"a","text":"明確界定系統、顧問與機構的工作及監督"},{"id":"b","text":"有真人即不需模型治理"},{"id":"c","text":"有模型即顧問不需理解"},{"id":"d","text":"讓客戶自行承擔全部服務錯誤"}],"correct":"a","difficulty":"hard"},{"id":"c11q50","stem":"平台按交易量獎勵推薦團隊，卻主張以客戶長期目標為本，應檢查什麼？","options":[{"id":"b","text":"只看獎金名稱"},{"id":"c","text":"交易越多就一定符合目標"},{"id":"d","text":"只調整問卷配色"},{"id":"a","text":"激勵是否誘發不必要的交易"}],"correct":"a","difficulty":"hard"}];</script><script>
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=crypto.getRandomValues(new Uint32Array(1))[0]%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
let questions=[],answers={},finished=false;const $=id=>document.getElementById(id);const escapeHtml=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){questions=shuffle(QUESTIONS).map(q=>({...q,options:shuffle(q.options)}));answers={};finished=false;$('result').classList.add('hidden');$('retry').classList.add('hidden');$('quiz').classList.remove('hidden');$('quiz').querySelector('.bottom').classList.remove('hidden');$('questions').innerHTML=questions.map((q,i)=>`<section class="question" id="${q.id}"><span class="number">QUESTION ${String(i+1).padStart(2,'0')} / 50</span><h2>${escapeHtml(q.stem)}</h2>${q.options.map((o,j)=>`<label><input type="radio" name="${q.id}" value="${o.id}"><span>${String.fromCharCode(65+j)}. ${escapeHtml(o.text)}</span></label>`).join('')}<div class="feedback"></div></section>`).join('');update()}
function update(){$('count').textContent=`已作答 ${Object.keys(answers).length} / 50 題`;$('progress').value=Object.keys(answers).length}
$('quiz').addEventListener('change',e=>{if(!finished&&e.target.type==='radio'){answers[e.target.name]=e.target.value;update()}});
$('quiz').addEventListener('submit',e=>{e.preventDefault();if(finished)return;const missing=50-Object.keys(answers).length;if(missing&&!confirm(`還有 ${missing} 題未作答，未答題以 0 分計算。確定完成？`))return;finished=true;let right=0;for(const q of questions){const section=$(q.id);const ok=answers[q.id]===q.correct;if(ok)right++;for(const input of section.querySelectorAll('input')){input.disabled=true;if(input.value===q.correct)input.closest('label').classList.add('correct');else if(input.checked)input.closest('label').classList.add('wrong')}section.querySelector('.feedback').textContent=ok?'答對了！':`${answers[q.id]?'本題答錯':'本題未作答'}。正確答案：${q.options.find(o=>o.id===q.correct).text}`}$('result').innerHTML=`<span>本次練習得分</span><strong>${right*2}<small style="font-size:22px"> 分</small></strong><p>答對 ${right} 題 · 答錯 ${50-right-missing} 題 · 未答 ${missing} 題</p><p>往下查看每題答案，或重新練習一次。</p>`;$('result').classList.remove('hidden');$('quiz').querySelector('.bottom').classList.add('hidden');$('retry').classList.remove('hidden');$('result').scrollIntoView({behavior:'smooth'});$('result').focus({preventScroll:true})});
$('retry').onclick=()=>{render();window.scrollTo({top:0,behavior:'smooth'})};render();
</script></body></html>
