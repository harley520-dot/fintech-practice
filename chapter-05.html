<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第5章｜區塊鏈練習</title><style>
:root{font-family:"Microsoft JhengHei",sans-serif;color:#173d32;background:#f5f4ed}*{box-sizing:border-box}body{margin:0}header{background:#173d32;color:#fff;padding:22px max(20px,calc((100vw - 850px)/2));}header small{color:#d7ed8a;letter-spacing:3px}h1{font-size:clamp(26px,5vw,40px);margin:12px 0}header p{color:#c7d7cf;line-height:1.7}main{max-width:850px;margin:auto;padding:24px 18px 60px}.toolbar{display:flex;justify-content:space-between;gap:15px;align-items:center;position:sticky;top:0;background:#f5f4edf5;padding:14px 0;z-index:2}button{font:inherit;cursor:pointer;border:1px solid #cdd9d0;background:white;color:#173d32;border-radius:12px;padding:12px 18px}button:focus-visible,input:focus-visible{outline:3px solid #9ebf36;outline-offset:3px}.primary{background:#173d32;color:white;border:0}.question{background:white;border-radius:20px;padding:24px;margin:18px 0;border:1px solid #e0e5dd}.question h2{font-size:19px;line-height:1.7;margin:10px 0 20px}.number{font-size:12px;font-weight:bold;color:#608070}label{display:flex;align-items:flex-start;gap:12px;padding:14px;border:1px solid #e0e5dd;border-radius:12px;margin:10px 0;cursor:pointer;line-height:1.6}label:has(input:checked){background:#edf5da;border-color:#779a45}input{accent-color:#286247;margin-top:5px;flex-shrink:0}.correct{background:#e6f3e8!important;border-color:#58a16a!important}.wrong{background:#fce9e5!important;border-color:#c66b5e!important}.feedback{color:#42664f;font-size:14px;line-height:1.8}.bottom{display:grid;gap:15px;text-align:center}.bottom button{padding:18px}.note{color:#6c7e72;font-size:13px;line-height:1.7}.result{background:#173d32;color:white;border-radius:24px;padding:32px;text-align:center;margin:20px 0}.result strong{display:block;font-size:70px;color:#d7ed8a}.result p{line-height:1.8}.hidden{display:none}progress{width:100%;height:7px;accent-color:#6e982d}dialog{border:0;border-radius:20px;max-width:90vw;padding:26px;text-align:center}dialog::backdrop{background:#173d3299}dialog img{max-width:250px;width:100%}.share-url{overflow-wrap:anywhere;font-size:12px;max-width:300px}.badge{display:inline-block;background:#edf5da;color:#42664f;padding:5px 10px;border-radius:30px;font-size:12px}@media(max-width:480px){.question{padding:18px}label{padding:12px}.toolbar{font-size:13px}button{padding:11px 13px}}
header{display:flex;justify-content:space-between;align-items:center;gap:24px}.teacher-credit{text-align:right;flex-shrink:0;line-height:1.9}.teacher-credit strong{display:block;color:#d7ed8a;font-size:20px}.teacher-credit span{font-size:17px}@media(max-width:650px){header{flex-wrap:wrap;gap:8px}.teacher-credit{margin-left:auto}.teacher-credit strong{font-size:18px}.teacher-credit span{font-size:15px}}
</style></head><body><header><div><small>FINTECH PRACTICE · CHAPTER 05</small><h1>區塊鏈</h1><p>50 題單選 · 每題 2 分 · 滿分 100 分<br>依自己的步調練習，完成後立即查看得分與正確答案。</p></div><div class="teacher-credit"><strong>數位金融服務</strong><span>楊智宇老師</span></div></header><main><div class="toolbar"><span id="count" aria-live="polite">已作答 0 / 50 題</span></div><progress id="progress" max="50" value="0" aria-label="作答進度"></progress><section id="result" class="result hidden" tabindex="-1"></section><form id="quiz"><div id="questions"></div><div class="bottom"><button class="primary" type="submit">完成作答，查看得分</button><p class="note">無須登入。姓名、學號及成績不會上傳。<br>題目與選項每次練習會重新排列。</p></div></form><button id="retry" class="primary hidden" style="width:100%">重新練習</button></main><script>const QUESTIONS=[{"id":"c5q1","stem":"多個參與者共同保存與驗證交易紀錄，主要呈現哪項概念？","options":[{"id":"a","text":"分散式帳本"},{"id":"b","text":"單一紙本總帳"},{"id":"c","text":"個人試算表"},{"id":"d","text":"只讀影像檔"}],"correct":"a","difficulty":"easy"},{"id":"c5q2","stem":"比特幣與區塊鏈的關係，哪個說法較適當？","options":[{"id":"b","text":"兩個名詞表示完全相同事物"},{"id":"c","text":"所有區塊鏈都必須使用比特幣"},{"id":"d","text":"區塊鏈只能記錄比特幣價格"},{"id":"a","text":"比特幣是區塊鏈的一種應用"}],"correct":"a","difficulty":"easy"},{"id":"c5q3","stem":"在點對點網路中，節點主要透過什麼方式參與？","options":[{"id":"c","text":"以紙本郵寄帳單"},{"id":"d","text":"只保存自己的密碼而不通訊"},{"id":"a","text":"依協定交換與驗證資訊"},{"id":"b","text":"全部只連到同一部個人電腦"}],"correct":"a","difficulty":"easy"},{"id":"c5q4","stem":"持有人用來授權交易、應妥善保密的資訊是什麼？","options":[{"id":"d","text":"公開交易編號"},{"id":"a","text":"私鑰"},{"id":"b","text":"公開收款地址"},{"id":"c","text":"區塊高度"}],"correct":"a","difficulty":"easy"},{"id":"c5q5","stem":"對交易產生數位簽章時，通常使用哪一把金鑰？","options":[{"id":"a","text":"簽署者的私鑰"},{"id":"b","text":"接收者的私鑰"},{"id":"c","text":"任意公開地址"},{"id":"d","text":"區塊的時間戳"}],"correct":"a","difficulty":"easy"},{"id":"c5q6","stem":"驗證某數位簽章時，主要使用什麼？","options":[{"id":"b","text":"簽署者的私鑰原文"},{"id":"c","text":"交易手續費"},{"id":"d","text":"礦工的用電量"},{"id":"a","text":"對應的公鑰"}],"correct":"a","difficulty":"easy"},{"id":"c5q7","stem":"SHA-256 對不同長度的輸入產生何種長度的摘要？","options":[{"id":"c","text":"與輸入長度完全相同"},{"id":"d","text":"依手續費決定"},{"id":"a","text":"固定 256 位元"},{"id":"b","text":"固定 256 位元組"}],"correct":"a","difficulty":"easy"},{"id":"c5q8","stem":"鏈上後一區塊記錄前一區塊的雜湊，主要作用是什麼？","options":[{"id":"d","text":"讓全部資料免費儲存"},{"id":"a","text":"形成可驗證的前後連結"},{"id":"b","text":"直接公開所有私鑰"},{"id":"c","text":"讓交易一定匿名"}],"correct":"a","difficulty":"easy"},{"id":"c5q9","stem":"參與者依共同規則協調帳本狀態，這類方法稱為什麼？","options":[{"id":"a","text":"共識機制"},{"id":"b","text":"文字轉錄"},{"id":"c","text":"資料壓縮"},{"id":"d","text":"個人信用評分"}],"correct":"a","difficulty":"easy"},{"id":"c5q10","stem":"以持有或質押權益參與驗證，而非主要靠雜湊競算，較接近哪種機制？","options":[{"id":"b","text":"工作量證明 PoW"},{"id":"c","text":"客服語意辨識"},{"id":"d","text":"單純雲端計費"},{"id":"a","text":"權益證明 PoS"}],"correct":"a","difficulty":"easy"},{"id":"c5q11","stem":"某文件只改了一個字，密碼學雜湊通常會出現何種結果？","options":[{"id":"c","text":"摘要必然保持不變"},{"id":"d","text":"摘要長度增加一倍"},{"id":"a","text":"產生明顯不同的摘要"},{"id":"b","text":"摘要只改同一位置的一個字"}],"correct":"a","difficulty":"medium"},{"id":"c5q12","stem":"想由雜湊值還原原始輸入，對安全雜湊應如何理解？","options":[{"id":"d","text":"與解壓縮完全相同"},{"id":"a","text":"一般設計上難以逆推原始內容"},{"id":"b","text":"可直接用公鑰解密還原"},{"id":"c","text":"只要知道摘要長度就能還原"}],"correct":"a","difficulty":"medium"},{"id":"c5q13","stem":"交易簽章通過驗證，最直接支持什麼判斷？","options":[{"id":"a","text":"交易與對應私鑰的授權及內容完整性有關"},{"id":"b","text":"交易商品必然真實存在"},{"id":"c","text":"持有人一定具備法定資格"},{"id":"d","text":"投資必然沒有風險"}],"correct":"a","difficulty":"medium"},{"id":"c5q14","stem":"數位簽章與加密的目的，哪項區分較準確？","options":[{"id":"b","text":"簽章只會壓縮資料"},{"id":"c","text":"加密等於公開資料"},{"id":"d","text":"兩者都一定隱藏收款地址"},{"id":"a","text":"簽章重在驗證授權與完整性，加密重在保護內容機密性"}],"correct":"a","difficulty":"medium"},{"id":"c5q15","stem":"有人要求轉帳人把私鑰一併傳給收款方，合理回應是什麼？","options":[{"id":"c","text":"只需把私鑰改成圖片即可傳送"},{"id":"d","text":"交易後再收回私鑰便安全"},{"id":"a","text":"只提供必要交易資訊，私鑰不應交付他人"},{"id":"b","text":"為了驗證應公開所有私鑰"}],"correct":"a","difficulty":"medium"},{"id":"c5q16","stem":"收到交易廣播的節點，為何不能只看簽章就接受所有花費？","options":[{"id":"d","text":"所有交易都由礦工保本"},{"id":"a","text":"還須檢查可用資金與重複花費等規則"},{"id":"b","text":"簽章有效就代表無限資金"},{"id":"c","text":"廣播者一定已替全網清算"}],"correct":"a","difficulty":"medium"},{"id":"c5q17","stem":"區塊內許多交易組成默克樹，主要有助於什麼？","options":[{"id":"a","text":"用樹根承諾交易集合並支援有效驗證"},{"id":"b","text":"讓所有交易都不需簽章"},{"id":"c","text":"自動消除所有交易費"},{"id":"d","text":"直接隱藏所有交易金額"}],"correct":"a","difficulty":"medium"},{"id":"c5q18","stem":"工作量證明中的礦工不斷嘗試不同輸入，主要為了什麼？","options":[{"id":"b","text":"解密所有其他人的私鑰"},{"id":"c","text":"把交易金額改成零"},{"id":"d","text":"讓所有礦工同時取得相同獎勵"},{"id":"a","text":"找到符合難度目標的區塊雜湊"}],"correct":"a","difficulty":"medium"},{"id":"c5q19","stem":"PoW 的一項重要特性是什麼？","options":[{"id":"c","text":"結果只能由中央銀行檢驗"},{"id":"d","text":"每次嘗試都必然成功"},{"id":"a","text":"尋找合格結果成本高，檢驗結果相對容易"},{"id":"b","text":"尋找結果與查驗都不需成本"}],"correct":"a","difficulty":"medium"},{"id":"c5q20","stem":"比特幣區塊競爭中，較多算力通常代表什麼？","options":[{"id":"d","text":"可自行改變所有節點規則"},{"id":"a","text":"較高的找到合格區塊機率"},{"id":"b","text":"保證下一次必然獲勝"},{"id":"c","text":"可以任意替他人簽章"}],"correct":"a","difficulty":"medium"},{"id":"c5q21","stem":"礦工的經濟誘因通常來自哪些來源？","options":[{"id":"a","text":"區塊補貼與所收錄交易的手續費"},{"id":"b","text":"所有客戶銀行存款利息"},{"id":"c","text":"任意增發法定貨幣"},{"id":"d","text":"每位節點固定薪資"}],"correct":"a","difficulty":"medium"},{"id":"c5q22","stem":"較早區塊之後累積更多工作量，通常會讓什麼變得更困難？","options":[{"id":"b","text":"讀取公開區塊資訊"},{"id":"c","text":"產生自己的公開地址"},{"id":"d","text":"查詢交易編號"},{"id":"a","text":"重寫該段歷史並追上有效鏈"}],"correct":"a","difficulty":"medium"},{"id":"c5q23","stem":"PoW 網路遭多數算力控制時，較值得擔心哪種行為？","options":[{"id":"c","text":"直接改寫他人有效簽章"},{"id":"d","text":"無條件取消全部共識規則"},{"id":"a","text":"重組近期區塊與嘗試雙重花費"},{"id":"b","text":"任意推算出所有私鑰"}],"correct":"a","difficulty":"medium"},{"id":"c5q24","stem":"公開鏈以地址表示交易雙方，隱私上應如何理解？","options":[{"id":"d","text":"只要換地址就沒有任何關聯風險"},{"id":"a","text":"地址可被追蹤與交叉分析，不等於絕對匿名"},{"id":"b","text":"任何交易都完全不可追蹤"},{"id":"c","text":"公開地址可直接推算所有密碼"}],"correct":"a","difficulty":"medium"},{"id":"c5q25","stem":"數家銀行限制參與資格並共同維運帳本，最接近哪種架構？","options":[{"id":"a","text":"聯盟鏈"},{"id":"b","text":"完全開放的公有鏈"},{"id":"c","text":"個人離線記事本"},{"id":"d","text":"無網路的單一試算表"}],"correct":"a","difficulty":"medium"},{"id":"c5q26","stem":"只有特定組織允許的成員能參與驗證，這是哪種設計？","options":[{"id":"b","text":"任何人無須許可的開放參與"},{"id":"c","text":"無條件公開全部權限"},{"id":"d","text":"去除所有身分管理"},{"id":"a","text":"認許制"}],"correct":"a","difficulty":"medium"},{"id":"c5q27","stem":"認許制金融網路採用身分與權限控制，主要交換條件是什麼？","options":[{"id":"c","text":"保證所有資料永遠不外洩"},{"id":"d","text":"自動沒有營運成本"},{"id":"a","text":"提高治理與資料控制，但開放參與程度較低"},{"id":"b","text":"必然達到完全匿名"}],"correct":"a","difficulty":"medium"},{"id":"c5q28","stem":"預先寫好的合約程式在條件滿足時執行，這描述什麼？","options":[{"id":"d","text":"純粹文件掃描"},{"id":"a","text":"智能合約"},{"id":"b","text":"專家訪談逐字稿"},{"id":"c","text":"人工電話確認"}],"correct":"a","difficulty":"medium"},{"id":"c5q29","stem":"智能合約需要知道鏈外的貨品是否到貨，常需哪類機制提供資訊？","options":[{"id":"a","text":"預言機或外部資料介接"},{"id":"b","text":"直接從雜湊還原貨物"},{"id":"c","text":"只讀礦工電費"},{"id":"d","text":"由區塊大小判定"}],"correct":"a","difficulty":"medium"},{"id":"c5q30","stem":"DeFi 將借貸與交換等流程放在鏈上程式執行，主要依賴什麼？","options":[{"id":"b","text":"必須由同一家實體分行手動確認"},{"id":"c","text":"所有商品都無風險"},{"id":"d","text":"全部資料只存在紙本"},{"id":"a","text":"區塊鏈與智能合約的共同運作"}],"correct":"a","difficulty":"medium"},{"id":"c5q31","stem":"穩定幣設定價格錨定目標，主要想降低什麼問題？","options":[{"id":"c","text":"所有私鑰外洩"},{"id":"d","text":"所有投資損失"},{"id":"a","text":"一般加密資產價格波動過大的使用障礙"},{"id":"b","text":"所有網路延遲"}],"correct":"a","difficulty":"medium"},{"id":"c5q32","stem":"法幣儲備型穩定幣最需要檢查哪項支持條件？","options":[{"id":"d","text":"區塊瀏覽器配色"},{"id":"a","text":"儲備品質、保管與贖回安排"},{"id":"b","text":"只有代幣圖示設計"},{"id":"c","text":"社群追蹤人數"}],"correct":"a","difficulty":"medium"},{"id":"c5q33","stem":"以加密資產作擔保發行穩定幣，為何可能需要超額抵押？","options":[{"id":"a","text":"抵押品價格可能波動"},{"id":"b","text":"可因此保證永遠沒有清算"},{"id":"c","text":"抵押品與法幣價值一定相同"},{"id":"d","text":"越少抵押就越穩定"}],"correct":"a","difficulty":"medium"},{"id":"c5q34","stem":"CBDC 與私人穩定幣最關鍵的區別之一是什麼？","options":[{"id":"b","text":"是否一定使用手機"},{"id":"c","text":"是否都有交易紀錄"},{"id":"d","text":"是否都可透過網路傳送"},{"id":"a","text":"發行與負債主體是否為中央銀行"}],"correct":"a","difficulty":"medium"},{"id":"c5q35","stem":"只供金融機構用於跨行資金移轉的 CBDC 安排，較接近哪種類型？","options":[{"id":"c","text":"單一企業點數"},{"id":"d","text":"私人收藏代幣"},{"id":"a","text":"批發型"},{"id":"b","text":"供一般民眾使用的零售型"}],"correct":"a","difficulty":"medium"},{"id":"c5q36","stem":"面向一般民眾日常支付的 CBDC 安排，較接近哪種類型？","options":[{"id":"d","text":"股權憑證"},{"id":"a","text":"零售型或通用型"},{"id":"b","text":"只供銀行清算的批發型"},{"id":"c","text":"礦工獎勵"}],"correct":"a","difficulty":"medium"},{"id":"c5q37","stem":"發行代幣向參與者募集資金，是哪種籌資概念？","options":[{"id":"a","text":"ICO"},{"id":"b","text":"ATM"},{"id":"c","text":"NLP"},{"id":"d","text":"IaaS"}],"correct":"a","difficulty":"medium"},{"id":"c5q38","stem":"評估代幣是否涉及證券性質時，較應重視什麼？","options":[{"id":"b","text":"代幣名稱是否包含藝術"},{"id":"c","text":"網站是否使用深色背景"},{"id":"d","text":"發行人把它稱為禮物即可"},{"id":"a","text":"實際權利、收益安排與經濟實質"}],"correct":"a","difficulty":"medium"},{"id":"c5q39","stem":"NFT 的非同質性主要表示什麼？","options":[{"id":"c","text":"每一枚一定具有相同價格"},{"id":"d","text":"任何人都不能轉讓"},{"id":"a","text":"特定代幣可有獨立識別與權利描述"},{"id":"b","text":"所有圖像都不能複製"}],"correct":"a","difficulty":"medium"},{"id":"c5q40","stem":"藝術 NFT 只記錄外部圖片的連結，持有者仍應關注什麼？","options":[{"id":"d","text":"原圖片一定永久寫入每個區塊"},{"id":"a","text":"鏈外檔案是否可持續存取與相應權利"},{"id":"b","text":"鏈上紀錄可保證外部網址永遠有效"},{"id":"c","text":"買入就必然取得全部著作權"}],"correct":"a","difficulty":"medium"},{"id":"c5q41","stem":"數家銀行想減少貿易融資的重複核對，哪個前提最有助於區塊鏈發揮價值？","options":[{"id":"a","text":"參與者同意資料規格、權限與共同驗證規則"},{"id":"b","text":"各自維持互不相容欄位"},{"id":"c","text":"所有上鏈文件都不需來源驗證"},{"id":"d","text":"把所有商業資料公開給全球"}],"correct":"a","difficulty":"hard"},{"id":"c5q42","stem":"供應商把虛假出貨資料寫入區塊鏈，鏈上可追蹤仍不能保證什麼？","options":[{"id":"b","text":"提交紀錄可否被查到"},{"id":"c","text":"寫入順序可否檢查"},{"id":"d","text":"雜湊能否用於完整性比對"},{"id":"a","text":"原始事件在現實世界的真實性"}],"correct":"a","difficulty":"hard"},{"id":"c5q43","stem":"一個 DeFi 協議依賴另一協議提供抵押價格，主要增加什麼風險？","options":[{"id":"c","text":"協議數量越多風險必然越小"},{"id":"d","text":"價格來源不會影響清算"},{"id":"a","text":"依賴與可組合性帶來的連鎖影響"},{"id":"b","text":"所有協議必然互不影響"}],"correct":"a","difficulty":"hard"},{"id":"c5q44","stem":"交易具有正確簽章，卻因誤導介面而授權了不利操作，說明什麼？","options":[{"id":"d","text":"公開公鑰會自動解決介面問題"},{"id":"a","text":"技術授權有效不等於使用者充分理解交易"},{"id":"b","text":"簽章可保證全部交易適合使用者"},{"id":"c","text":"只要上鏈就無詐騙"}],"correct":"a","difficulty":"hard"},{"id":"c5q45","stem":"穩定幣宣稱一比一錨定，但儲備無法及時變現，仍可能出現什麼？","options":[{"id":"a","text":"贖回壓力與脫鉤風險"},{"id":"b","text":"由錨定名稱保證流動性"},{"id":"c","text":"所有持有人可同時無條件贖回"},{"id":"d","text":"區塊鏈會自動補足儲備"}],"correct":"a","difficulty":"hard"},{"id":"c5q46","stem":"金融聯盟鏈提供各節點共同帳本，卻未區分商業機密的讀取權，應優先改善什麼？","options":[{"id":"b","text":"只增加節點數量"},{"id":"c","text":"只降低交易費"},{"id":"d","text":"把驗證規則完全刪除"},{"id":"a","text":"資料可見範圍與成員權限設計"}],"correct":"a","difficulty":"hard"},{"id":"c5q47","stem":"支付方案需要極高交易量，設計者能否只因採用區塊鏈就認定效能足夠？","options":[{"id":"c","text":"節點越多吞吐量必然等比例增加"},{"id":"d","text":"只要有代幣就無須壓力測試"},{"id":"a","text":"仍須測試吞吐量、延遲與故障情境"},{"id":"b","text":"區塊鏈一定比任何資料庫快"}],"correct":"a","difficulty":"hard"},{"id":"c5q48","stem":"同一筆資產移轉在兩個系統完成前後需相互核對，哪個設計問題最重要？","options":[{"id":"d","text":"用相同標誌取代技術協調"},{"id":"a","text":"跨系統狀態一致性與失敗時的處理"},{"id":"b","text":"所有地址是否一樣長"},{"id":"c","text":"只看首頁載入速度"}],"correct":"a","difficulty":"hard"},{"id":"c5q49","stem":"NFT 持有人看到圖片仍可被他人下載，應如何解釋？","options":[{"id":"a","text":"代幣識別與檔案複製及著作權是不同層面的事"},{"id":"b","text":"NFT 技術因此必然失效"},{"id":"c","text":"鏈上所有權可自動禁止網路下載"},{"id":"d","text":"圖片被複製就代表私鑰已被破解"}],"correct":"a","difficulty":"hard"},{"id":"c5q50","stem":"單一公司可完全決定資料寫入，其他人只需查詢，選型時應如何思考？","options":[{"id":"b","text":"只要有金融資料就必須用公有鏈"},{"id":"c","text":"任何資料庫都不能留下稽核紀錄"},{"id":"d","text":"所有上鏈方案成本都比資料庫低"},{"id":"a","text":"比較傳統資料庫與分散式帳本的實際治理需求"}],"correct":"a","difficulty":"hard"}];</script><script>
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=crypto.getRandomValues(new Uint32Array(1))[0]%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
let questions=[],answers={},finished=false;const $=id=>document.getElementById(id);const escapeHtml=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){questions=shuffle(QUESTIONS).map(q=>({...q,options:shuffle(q.options)}));answers={};finished=false;$('result').classList.add('hidden');$('retry').classList.add('hidden');$('quiz').classList.remove('hidden');$('quiz').querySelector('.bottom').classList.remove('hidden');$('questions').innerHTML=questions.map((q,i)=>`<section class="question" id="${q.id}"><span class="number">QUESTION ${String(i+1).padStart(2,'0')} / 50</span><h2>${escapeHtml(q.stem)}</h2>${q.options.map((o,j)=>`<label><input type="radio" name="${q.id}" value="${o.id}"><span>${String.fromCharCode(65+j)}. ${escapeHtml(o.text)}</span></label>`).join('')}<div class="feedback"></div></section>`).join('');update()}
function update(){$('count').textContent=`已作答 ${Object.keys(answers).length} / 50 題`;$('progress').value=Object.keys(answers).length}
$('quiz').addEventListener('change',e=>{if(!finished&&e.target.type==='radio'){answers[e.target.name]=e.target.value;update()}});
$('quiz').addEventListener('submit',e=>{e.preventDefault();if(finished)return;const missing=50-Object.keys(answers).length;if(missing&&!confirm(`還有 ${missing} 題未作答，未答題以 0 分計算。確定完成？`))return;finished=true;let right=0;for(const q of questions){const section=$(q.id);const ok=answers[q.id]===q.correct;if(ok)right++;for(const input of section.querySelectorAll('input')){input.disabled=true;if(input.value===q.correct)input.closest('label').classList.add('correct');else if(input.checked)input.closest('label').classList.add('wrong')}section.querySelector('.feedback').textContent=ok?'答對了！':`${answers[q.id]?'本題答錯':'本題未作答'}。正確答案：${q.options.find(o=>o.id===q.correct).text}`}$('result').innerHTML=`<span>本次練習得分</span><strong>${right*2}<small style="font-size:22px"> 分</small></strong><p>答對 ${right} 題 · 答錯 ${50-right-missing} 題 · 未答 ${missing} 題</p><p>往下查看每題答案，或重新練習一次。</p>`;$('result').classList.remove('hidden');$('quiz').querySelector('.bottom').classList.add('hidden');$('retry').classList.remove('hidden');$('result').scrollIntoView({behavior:'smooth'});$('result').focus({preventScroll:true})});
$('retry').onclick=()=>{render();window.scrollTo({top:0,behavior:'smooth'})};render();
</script></body></html>
