<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第2章｜雲端運算練習</title><style>
:root{font-family:"Microsoft JhengHei",sans-serif;color:#173d32;background:#f5f4ed}*{box-sizing:border-box}body{margin:0}header{background:#173d32;color:#fff;padding:22px max(20px,calc((100vw - 850px)/2));}header small{color:#d7ed8a;letter-spacing:3px}h1{font-size:clamp(26px,5vw,40px);margin:12px 0}header p{color:#c7d7cf;line-height:1.7}main{max-width:850px;margin:auto;padding:24px 18px 60px}.toolbar{display:flex;justify-content:space-between;gap:15px;align-items:center;position:sticky;top:0;background:#f5f4edf5;padding:14px 0;z-index:2}button{font:inherit;cursor:pointer;border:1px solid #cdd9d0;background:white;color:#173d32;border-radius:12px;padding:12px 18px}button:focus-visible,input:focus-visible{outline:3px solid #9ebf36;outline-offset:3px}.primary{background:#173d32;color:white;border:0}.question{background:white;border-radius:20px;padding:24px;margin:18px 0;border:1px solid #e0e5dd}.question h2{font-size:19px;line-height:1.7;margin:10px 0 20px}.number{font-size:12px;font-weight:bold;color:#608070}label{display:flex;align-items:flex-start;gap:12px;padding:14px;border:1px solid #e0e5dd;border-radius:12px;margin:10px 0;cursor:pointer;line-height:1.6}label:has(input:checked){background:#edf5da;border-color:#779a45}input{accent-color:#286247;margin-top:5px;flex-shrink:0}.correct{background:#e6f3e8!important;border-color:#58a16a!important}.wrong{background:#fce9e5!important;border-color:#c66b5e!important}.feedback{color:#42664f;font-size:14px;line-height:1.8}.bottom{display:grid;gap:15px;text-align:center}.bottom button{padding:18px}.note{color:#6c7e72;font-size:13px;line-height:1.7}.result{background:#173d32;color:white;border-radius:24px;padding:32px;text-align:center;margin:20px 0}.result strong{display:block;font-size:70px;color:#d7ed8a}.result p{line-height:1.8}.hidden{display:none}progress{width:100%;height:7px;accent-color:#6e982d}dialog{border:0;border-radius:20px;max-width:90vw;padding:26px;text-align:center}dialog::backdrop{background:#173d3299}dialog img{max-width:250px;width:100%}.share-url{overflow-wrap:anywhere;font-size:12px;max-width:300px}.badge{display:inline-block;background:#edf5da;color:#42664f;padding:5px 10px;border-radius:30px;font-size:12px}@media(max-width:480px){.question{padding:18px}label{padding:12px}.toolbar{font-size:13px}button{padding:11px 13px}}
header{display:flex;justify-content:space-between;align-items:center;gap:24px}.teacher-credit{text-align:right;flex-shrink:0;line-height:1.9}.teacher-credit strong{display:block;color:#d7ed8a;font-size:20px}.teacher-credit span{font-size:17px}@media(max-width:650px){header{flex-wrap:wrap;gap:8px}.teacher-credit{margin-left:auto}.teacher-credit strong{font-size:18px}.teacher-credit span{font-size:15px}}
</style></head><body><header><div><small>FINTECH PRACTICE · CHAPTER 02</small><h1>雲端運算</h1><p>50 題單選 · 每題 2 分 · 滿分 100 分<br>依自己的步調練習，完成後立即查看得分與正確答案。</p></div><div class="teacher-credit"><strong>數位金融服務</strong><span>楊智宇老師</span></div></header><main><div class="toolbar"><span id="count" aria-live="polite">已作答 0 / 50 題</span></div><progress id="progress" max="50" value="0" aria-label="作答進度"></progress><section id="result" class="result hidden" tabindex="-1"></section><form id="quiz"><div id="questions"></div><div class="bottom"><button class="primary" type="submit">完成作答，查看得分</button><p class="note">無須登入。姓名、學號及成績不會上傳。<br>題目與選項每次練習會重新排列。</p></div></form><button id="retry" class="primary hidden" style="width:100%">重新練習</button></main><script>const QUESTIONS=[{"id":"c2q1","stem":"資訊人員透過入口網站自行建立測試主機，不必等待業者人工開通，這呈現哪項雲端特性？","options":[{"id":"a","text":"隨需自助服務"},{"id":"b","text":"資料壓縮"},{"id":"c","text":"離線備份"},{"id":"d","text":"實體隔離"}],"correct":"a","difficulty":"easy"},{"id":"c2q2","stem":"同一套雲端系統能讓筆電與手機連線使用，最直接反映哪項能力？","options":[{"id":"b","text":"所有設備規格相同"},{"id":"c","text":"不需身分驗證"},{"id":"d","text":"所有資料公開"},{"id":"a","text":"廣泛的網路存取"}],"correct":"a","difficulty":"easy"},{"id":"c2q3","stem":"使用量突然上升時，系統可迅速增加處理資源，這是哪項特性？","options":[{"id":"c","text":"長期封存"},{"id":"d","text":"人工排程"},{"id":"a","text":"快速彈性"},{"id":"b","text":"固定容量"}],"correct":"a","difficulty":"easy"},{"id":"c2q4","stem":"業者依儲存容量與運算時數出具帳單，主要依賴哪項機制？","options":[{"id":"d","text":"硬體折舊"},{"id":"a","text":"可量測服務"},{"id":"b","text":"匿名連線"},{"id":"c","text":"資料去重"}],"correct":"a","difficulty":"easy"},{"id":"c2q5","stem":"多個客戶共用底層設備，服務仍須隔離各自資料，這是哪種設計？","options":[{"id":"a","text":"多租戶架構"},{"id":"b","text":"單機離線架構"},{"id":"c","text":"公開資料目錄"},{"id":"d","text":"點對點支付"}],"correct":"a","difficulty":"easy"},{"id":"c2q6","stem":"團隊租用虛擬主機並自行安裝作業系統與軟體，最接近哪個服務層級？","options":[{"id":"b","text":"PaaS"},{"id":"c","text":"SaaS"},{"id":"d","text":"DaaS 桌面服務"},{"id":"a","text":"IaaS"}],"correct":"a","difficulty":"easy"},{"id":"c2q7","stem":"開發者部署自己寫的程式，但執行平台由供應商維運，最接近哪種服務？","options":[{"id":"c","text":"SaaS"},{"id":"d","text":"純硬體租賃"},{"id":"a","text":"PaaS"},{"id":"b","text":"IaaS"}],"correct":"a","difficulty":"easy"},{"id":"c2q8","stem":"同仁用瀏覽器直接操作已完成的線上報銷系統，最接近哪種服務？","options":[{"id":"d","text":"裸機採購"},{"id":"a","text":"SaaS"},{"id":"b","text":"IaaS"},{"id":"c","text":"實體機房代管"}],"correct":"a","difficulty":"easy"},{"id":"c2q9","stem":"只有某一家組織可使用的專屬雲端環境，應歸為哪種部署？","options":[{"id":"a","text":"私有雲"},{"id":"b","text":"公有雲"},{"id":"c","text":"社群雲"},{"id":"d","text":"公開下載站"}],"correct":"a","difficulty":"easy"},{"id":"c2q10","stem":"把部分系統留在專屬環境，並讓它與公有雲協同運作，這是哪種部署？","options":[{"id":"b","text":"單一私有雲"},{"id":"c","text":"純公有雲"},{"id":"d","text":"本地單機"},{"id":"a","text":"混合雲"}],"correct":"a","difficulty":"easy"},{"id":"c2q11","stem":"銀行只需要短期壓力測試資源，測完即釋放。這主要降低哪種浪費？","options":[{"id":"c","text":"登入權限的分工"},{"id":"d","text":"測試結果的準確度"},{"id":"a","text":"為短期尖峰長期保有閒置設備"},{"id":"b","text":"備份紀錄的可追溯性"}],"correct":"a","difficulty":"medium"},{"id":"c2q12","stem":"客服活動白天繁忙、夜間清淡，哪種資源配置較符合雲端彈性？","options":[{"id":"d","text":"取消所有負載監控"},{"id":"a","text":"依負載增減執行個體"},{"id":"b","text":"全年固定採最大容量"},{"id":"c","text":"夜間仍維持全部尖峰資源"}],"correct":"a","difficulty":"medium"},{"id":"c2q13","stem":"單一實體主機同時執行多套彼此隔離的作業環境，主要運用什麼技術？","options":[{"id":"a","text":"虛擬化"},{"id":"b","text":"資料探勘"},{"id":"c","text":"生物辨識"},{"id":"d","text":"數位簽章"}],"correct":"a","difficulty":"medium"},{"id":"c2q14","stem":"資源匯集與快速彈性的差異，哪個說法較適當？","options":[{"id":"b","text":"前者只用於計費，後者只用於加密"},{"id":"c","text":"兩者都表示固定使用同一台主機"},{"id":"d","text":"兩者都要求公開客戶資料"},{"id":"a","text":"前者整合共享資源，後者依需求迅速調整配置"}],"correct":"a","difficulty":"medium"},{"id":"c2q15","stem":"選擇 IaaS 後，哪項通常仍由租用者管理？","options":[{"id":"c","text":"機房供電設備"},{"id":"d","text":"供應商硬體更換"},{"id":"a","text":"自行安裝的作業系統更新"},{"id":"b","text":"資料中心實體門禁"}],"correct":"a","difficulty":"medium"},{"id":"c2q16","stem":"相較 IaaS，PaaS 主要替開發團隊承擔哪部分工作？","options":[{"id":"d","text":"所有終端帳號的授權"},{"id":"a","text":"底層執行環境的維運"},{"id":"b","text":"所有商業需求的決定"},{"id":"c","text":"所有程式邏輯的撰寫"}],"correct":"a","difficulty":"medium"},{"id":"c2q17","stem":"使用 SaaS 後，企業仍應負責哪項工作？","options":[{"id":"a","text":"適當設定使用者存取權限"},{"id":"b","text":"更換業者機房空調"},{"id":"c","text":"安裝業者底層交換器"},{"id":"d","text":"自行製造儲存晶片"}],"correct":"a","difficulty":"medium"},{"id":"c2q18","stem":"公有雲的「公有」應如何理解？","options":[{"id":"b","text":"所有服務永久免費"},{"id":"c","text":"全部資料可供任何人讀取"},{"id":"d","text":"只能由政府使用"},{"id":"a","text":"可向多種客戶提供服務，不表示客戶資料公開"}],"correct":"a","difficulty":"medium"},{"id":"c2q19","stem":"企業委由外部業者代管專屬私有雲，分類時應看哪項條件？","options":[{"id":"c","text":"業者是否提供免費試用"},{"id":"d","text":"伺服器外殼的標誌"},{"id":"a","text":"環境是否專供單一組織使用"},{"id":"b","text":"機房是否一定在總部"}],"correct":"a","difficulty":"medium"},{"id":"c2q20","stem":"數家機構因共同安全需求使用專屬共享環境，最接近哪種模型？","options":[{"id":"d","text":"個人桌面"},{"id":"a","text":"社群雲"},{"id":"b","text":"任意開放的公有雲"},{"id":"c","text":"單一企業私有雲"}],"correct":"a","difficulty":"medium"},{"id":"c2q21","stem":"企業同時租用兩家公有雲，卻未整合私有環境，何者較精確？","options":[{"id":"a","text":"屬多雲安排，不必然是混合雲"},{"id":"b","text":"只要兩家業者就一定是混合雲"},{"id":"c","text":"必然是社群雲"},{"id":"d","text":"必然是私有雲"}],"correct":"a","difficulty":"medium"},{"id":"c2q22","stem":"比較雲端與自建機房成本時，哪項作法較完整？","options":[{"id":"b","text":"只比較第一個月的主機費"},{"id":"c","text":"忽略資料移轉費"},{"id":"d","text":"假定雲端一定比較便宜"},{"id":"a","text":"一併估計運算、網路、儲存與維運費用"}],"correct":"a","difficulty":"medium"},{"id":"c2q23","stem":"員工誤把客戶報表設為公開下載，主要損害哪項資安目標？","options":[{"id":"c","text":"可用性"},{"id":"d","text":"可擴展性"},{"id":"a","text":"機密性"},{"id":"b","text":"完整性"}],"correct":"a","difficulty":"medium"},{"id":"c2q24","stem":"惡意使用者修改帳務數字，主要侵害哪項目標？","options":[{"id":"d","text":"互通性"},{"id":"a","text":"完整性"},{"id":"b","text":"可用性"},{"id":"c","text":"彈性"}],"correct":"a","difficulty":"medium"},{"id":"c2q25","stem":"服務尖峰時授權客戶無法登入，主要涉及哪項目標？","options":[{"id":"a","text":"可用性"},{"id":"b","text":"機密性"},{"id":"c","text":"資料最小化"},{"id":"d","text":"不可否認性"}],"correct":"a","difficulty":"medium"},{"id":"c2q26","stem":"選擇雲端供應商時，安全認證的合理用途為何？","options":[{"id":"b","text":"證明任何設定都不會出錯"},{"id":"c","text":"代替所有風險評估"},{"id":"d","text":"保證所有客戶需求都已符合"},{"id":"a","text":"作為評估依據，仍需核對實際服務與控制範圍"}],"correct":"a","difficulty":"medium"},{"id":"c2q27","stem":"服務水準協議最適合釐清哪項內容？","options":[{"id":"c","text":"員工升遷順位"},{"id":"d","text":"所有客戶的投資偏好"},{"id":"a","text":"可用率承諾、事件回應及責任分工"},{"id":"b","text":"金融商品的保證報酬"}],"correct":"a","difficulty":"medium"},{"id":"c2q28","stem":"雲端資安責任分工應如何落實？","options":[{"id":"d","text":"只在事故後才開始討論"},{"id":"a","text":"依服務層級列明業者與客戶各自控制項目"},{"id":"b","text":"全部交給業者而不檢查"},{"id":"c","text":"全部交給終端客戶"}],"correct":"a","difficulty":"medium"},{"id":"c2q29","stem":"開發團隊每次測試都臨時建立隔離環境，主要運用哪項雲端效益？","options":[{"id":"a","text":"加快資源佈建與實驗速度"},{"id":"b","text":"讓程式天然沒有漏洞"},{"id":"c","text":"免除所有測試工作"},{"id":"d","text":"保證所有版本相容"}],"correct":"a","difficulty":"medium"},{"id":"c2q30","stem":"行銷部門透過雲端整合互動紀錄，主要目標是什麼？","options":[{"id":"b","text":"直接取消客戶同意管理"},{"id":"c","text":"永久公開原始紀錄"},{"id":"d","text":"把資料量當作唯一績效"},{"id":"a","text":"分析需求並改善服務溝通"}],"correct":"a","difficulty":"medium"},{"id":"c2q31","stem":"銀行與合作業者以 API 串接服務，雲端協作仍須先確認什麼？","options":[{"id":"c","text":"全部系統由同一人開發"},{"id":"d","text":"所有服務都不需紀錄"},{"id":"a","text":"資料範圍、授權方式與存取控制"},{"id":"b","text":"雙方網頁配色一致"}],"correct":"a","difficulty":"medium"},{"id":"c2q32","stem":"遠距同仁登入集中維運的雲端桌面工作，最接近哪種應用？","options":[{"id":"d","text":"語音辨識"},{"id":"a","text":"桌面即服務"},{"id":"b","text":"區塊鏈共識"},{"id":"c","text":"店頭交易媒合"}],"correct":"a","difficulty":"medium"},{"id":"c2q33","stem":"在 ATM 設備附近先分析感測資料，再送摘要到雲端，這是哪種安排？","options":[{"id":"a","text":"邊緣運算與雲端協作"},{"id":"b","text":"完全取消運算"},{"id":"c","text":"只做集中式批次運算"},{"id":"d","text":"單純增加資料副本"}],"correct":"a","difficulty":"medium"},{"id":"c2q34","stem":"緊急設備需在極短時間內做出反應，選擇邊緣處理的主要理由是什麼？","options":[{"id":"b","text":"提高每筆交易的手續費"},{"id":"c","text":"讓設備無須維護"},{"id":"d","text":"讓模型永遠不需更新"},{"id":"a","text":"降低往返遠端雲端的延遲"}],"correct":"a","difficulty":"medium"},{"id":"c2q35","stem":"攝影設備先在本地過濾無關影像，再上傳必要資料，主要可減少什麼？","options":[{"id":"c","text":"所有設備耗電"},{"id":"d","text":"所有資料品質問題"},{"id":"a","text":"傳輸量與遠端儲存需求"},{"id":"b","text":"所有端點安全工作"}],"correct":"a","difficulty":"medium"},{"id":"c2q36","stem":"邊緣設備可在短暫斷線時繼續執行本地規則，代表什麼？","options":[{"id":"d","text":"中央系統已沒有用途"},{"id":"a","text":"部分功能可降低對即時遠端連線的依賴"},{"id":"b","text":"所有金融交易都可無條件離線清算"},{"id":"c","text":"任何斷線都不影響服務"}],"correct":"a","difficulty":"medium"},{"id":"c2q37","stem":"企業採用雲端後，IT 團隊較可能把時間轉向哪項工作？","options":[{"id":"a","text":"核心應用與服務改善"},{"id":"b","text":"完全停止權限管理"},{"id":"c","text":"只管理紙本表單"},{"id":"d","text":"取消系統監控"}],"correct":"a","difficulty":"medium"},{"id":"c2q38","stem":"雲端按量付費最需要搭配哪項日常管理？","options":[{"id":"b","text":"只在年底看一次帳單"},{"id":"c","text":"持續建立無人使用的主機"},{"id":"d","text":"移除所有用量紀錄"},{"id":"a","text":"設定預算告警與檢查閒置資源"}],"correct":"a","difficulty":"medium"},{"id":"c2q39","stem":"敏感業務留在私有環境、公開查詢服務放公有雲，最直接利用什麼？","options":[{"id":"c","text":"只以最低價格分配資源"},{"id":"d","text":"所有資料必須同步公開"},{"id":"a","text":"依資料與業務需求分配部署位置"},{"id":"b","text":"同一安全等級適用全部資料"}],"correct":"a","difficulty":"medium"},{"id":"c2q40","stem":"雲端備援設計最需要確認什麼？","options":[{"id":"d","text":"是否完全不用演練"},{"id":"a","text":"復原目標與實際還原測試結果"},{"id":"b","text":"只有備份檔名是否漂亮"},{"id":"c","text":"只有硬碟容量是否夠大"}],"correct":"a","difficulty":"medium"},{"id":"c2q41","stem":"尖峰時自動擴容仍無法改善，查出瓶頸是固定容量的資料庫。下一步應如何處理？","options":[{"id":"a","text":"針對瓶頸評估擴充與架構調整"},{"id":"b","text":"持續只增加前端主機"},{"id":"c","text":"停止所有監控避免告警"},{"id":"d","text":"把備份刪掉當作擴容"}],"correct":"a","difficulty":"hard"},{"id":"c2q42","stem":"混合雲把敏感資料留在私有區，但 API 可匿名讀取。何者評估最合理？","options":[{"id":"b","text":"只要是私有區就必然安全"},{"id":"c","text":"改用更多雲端即可解決"},{"id":"d","text":"資料留在國內就不需驗證"},{"id":"a","text":"部署位置不能取代正確的權限控制"}],"correct":"a","difficulty":"hard"},{"id":"c2q43","stem":"邊緣設備外洩原始資料，而雲端端點安全無虞。哪項結論較完整？","options":[{"id":"c","text":"移除網路日誌即可降低風險"},{"id":"d","text":"所有邊緣運算都不適用金融"},{"id":"a","text":"應把端點與傳輸納入整體安全設計"},{"id":"b","text":"雲端安全等於全部系統安全"}],"correct":"a","difficulty":"hard"},{"id":"c2q44","stem":"專案從 SaaS 改用 IaaS，以取得更多控制。主要須重新評估哪項代價？","options":[{"id":"d","text":"必然減少的管理工作"},{"id":"a","text":"增加的系統維運與資安責任"},{"id":"b","text":"必然消失的所有授權成本"},{"id":"c","text":"完全不變的技能需求"}],"correct":"a","difficulty":"hard"},{"id":"c2q45","stem":"服務持續成長卻沒有用量上限，按量付費可能帶來什麼問題？","options":[{"id":"a","text":"需求增加使帳單超出預算"},{"id":"b","text":"計費機制會自動停止收費"},{"id":"c","text":"所有成本必然固定"},{"id":"d","text":"使用越多總費用一定越低"}],"correct":"a","difficulty":"hard"},{"id":"c2q46","stem":"跨雲備援看似充足，但兩套系統共用單一登入服務。此架構仍有何風險？","options":[{"id":"b","text":"供應商數量多就不會中斷"},{"id":"c","text":"副本越多權限越不重要"},{"id":"d","text":"登入服務不影響可用性"},{"id":"a","text":"共同依賴可能形成單點故障"}],"correct":"a","difficulty":"hard"},{"id":"c2q47","stem":"供應商宣稱資料加密，客戶卻把解密金鑰與資料一起公開。問題主要在哪裡？","options":[{"id":"c","text":"雲端儲存不支援權限"},{"id":"d","text":"資料加密等同資料刪除"},{"id":"a","text":"金鑰管理破壞了加密的保護效果"},{"id":"b","text":"加密一定會降低完整性"}],"correct":"a","difficulty":"hard"},{"id":"c2q48","stem":"銀行希望提升擴充性又降低單一業者依賴，哪項設計較有幫助？","options":[{"id":"d","text":"把所有帳號集中交給業者共用"},{"id":"a","text":"評估標準介面與資料匯出及移轉能力"},{"id":"b","text":"使用只能由單一廠商解讀的格式"},{"id":"c","text":"移除資料備份"}],"correct":"a","difficulty":"hard"},{"id":"c2q49","stem":"低延遲需求與長期大量資料分析同時存在，哪種分工較合理？","options":[{"id":"a","text":"本地處理即時事件，雲端整合長期分析"},{"id":"b","text":"所有事件都等待夜間批次"},{"id":"c","text":"所有歷史資料永久只存感測器"},{"id":"d","text":"為降低延遲取消紀錄"}],"correct":"a","difficulty":"hard"},{"id":"c2q50","stem":"某業務選私有雲後成本較高，是否表示決策必然錯誤？","options":[{"id":"b","text":"價格較高就一定錯誤"},{"id":"c","text":"私有雲永遠最便宜"},{"id":"d","text":"只要設備自有就無須維護"},{"id":"a","text":"仍應綜合專屬需求、控制能力與總成本判斷"}],"correct":"a","difficulty":"hard"}];</script><script>
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=crypto.getRandomValues(new Uint32Array(1))[0]%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
let questions=[],answers={},finished=false;const $=id=>document.getElementById(id);const escapeHtml=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){questions=shuffle(QUESTIONS).map(q=>({...q,options:shuffle(q.options)}));answers={};finished=false;$('result').classList.add('hidden');$('retry').classList.add('hidden');$('quiz').classList.remove('hidden');$('quiz').querySelector('.bottom').classList.remove('hidden');$('questions').innerHTML=questions.map((q,i)=>`<section class="question" id="${q.id}"><span class="number">QUESTION ${String(i+1).padStart(2,'0')} / 50</span><h2>${escapeHtml(q.stem)}</h2>${q.options.map((o,j)=>`<label><input type="radio" name="${q.id}" value="${o.id}"><span>${String.fromCharCode(65+j)}. ${escapeHtml(o.text)}</span></label>`).join('')}<div class="feedback"></div></section>`).join('');update()}
function update(){$('count').textContent=`已作答 ${Object.keys(answers).length} / 50 題`;$('progress').value=Object.keys(answers).length}
$('quiz').addEventListener('change',e=>{if(!finished&&e.target.type==='radio'){answers[e.target.name]=e.target.value;update()}});
$('quiz').addEventListener('submit',e=>{e.preventDefault();if(finished)return;const missing=50-Object.keys(answers).length;if(missing&&!confirm(`還有 ${missing} 題未作答，未答題以 0 分計算。確定完成？`))return;finished=true;let right=0;for(const q of questions){const section=$(q.id);const ok=answers[q.id]===q.correct;if(ok)right++;for(const input of section.querySelectorAll('input')){input.disabled=true;if(input.value===q.correct)input.closest('label').classList.add('correct');else if(input.checked)input.closest('label').classList.add('wrong')}section.querySelector('.feedback').textContent=ok?'答對了！':`${answers[q.id]?'本題答錯':'本題未作答'}。正確答案：${q.options.find(o=>o.id===q.correct).text}`}$('result').innerHTML=`<span>本次練習得分</span><strong>${right*2}<small style="font-size:22px"> 分</small></strong><p>答對 ${right} 題 · 答錯 ${50-right-missing} 題 · 未答 ${missing} 題</p><p>往下查看每題答案，或重新練習一次。</p>`;$('result').classList.remove('hidden');$('quiz').querySelector('.bottom').classList.add('hidden');$('retry').classList.remove('hidden');$('result').scrollIntoView({behavior:'smooth'});$('result').focus({preventScroll:true})});
$('retry').onclick=()=>{render();window.scrollTo({top:0,behavior:'smooth'})};render();
</script></body></html>
