mg{max-width:250px;width:100%}.share-url{overflow-wrap:anywhere;font-size:12px;max-width:300px}.badge{display:inline-block;background:#edf5da;color:#42664f;padding:5px 10px;border-radius:30px;font-size:12px}@media(max-width:480px){.question{padding:18px}label{padding:12px}.toolbar{font-size:13px}button{padding:11px 13px}}

</style></head><body><header><div><small>FINTECH PRACTICE · CHAPTER 14</small><h1>資訊安全與風險管理</h1><p>50 題單選 · 每題 2 分 · 滿分 100 分<br>依自己的步調練習，完成後立即查看得分與正確答案。</p></div><div class="teacher-credit"><strong>數位金融服務</strong><span>楊智宇老師</span></div></header><main><div class="toolbar"><span id="count" aria-live="polite">已作答 0 / 50 題</span></div><progress id="progress" max="50" value="0" aria-label="作答進度"></progress><section id="result" class="result hidden" tabindex="-1"></section><form id="quiz"><div id="questions"></div><div class="bottom"><button class="primary" type="submit">完成作答，查看得分</button><p class="note">無須登入。姓名、學號及成績不會上傳。<br>題目與選項每次練習會重新排列。</p></div></form><button id="retry" class="primary hidden" style="width:100%">重新練習</button></main><script>const QUESTIONS=[{"id":"c14q1","stem":"假冒銀行寄信要求輸入帳密，最典型是哪種攻擊？","options":[{"id":"a","text":"網路釣魚"},{"id":"b","text":"資產再平衡"},{"id":"c","text":"資料備份"},{"id":"d","text":"商品預購"}],"correct":"a","difficulty":"easy"},{"id":"c14q2","stem":"針對特定員工工作內容製作可信假郵件，較接近什麼？","options":[{"id":"b","text":"一般資料壓縮"},{"id":"c","text":"身分模板登錄"},{"id":"d","text":"帳戶聚合"},{"id":"a","text":"魚叉式釣魚"}],"correct":"a","difficulty":"easy"},{"id":"c14q3","stem":"攻擊者長期隱匿滲透並持續竊取資料，較接近什麼？","options":[{"id":"c","text":"固定批次備份"},{"id":"d","text":"單純負載測試"},{"id":"a","text":"進階持續性威脅 APT"},{"id":"b","text":"短期促銷"}],"correct":"a","difficulty":"easy"},{"id":"c14q4","stem":"大量受控設備同時發送流量使服務中斷，較接近什麼？","options":[{"id":"d","text":"ETF"},{"id":"a","text":"DDoS"},{"id":"b","text":"KYC"},{"id":"c","text":"AUM"}],"correct":"a","difficulty":"easy"},{"id":"c14q5","stem":"惡意程式加密檔案並勒索解鎖金，屬於什麼？","options":[{"id":"a","text":"勒索軟體"},{"id":"b","text":"正常加密備份"},{"id":"c","text":"合法帳單"},{"id":"d","text":"投資組合建議"}],"correct":"a","difficulty":"easy"},{"id":"c14q6","stem":"未經授權取得客戶資料，主要侵害哪項目標？","options":[{"id":"b","text":"完整性"},{"id":"c","text":"可用性"},{"id":"d","text":"可擴充性"},{"id":"a","text":"機密性"}],"correct":"a","difficulty":"easy"},{"id":"c14q7","stem":"帳務數字遭未授權改寫，主要侵害哪項目標？","options":[{"id":"c","text":"彈性"},{"id":"d","text":"匿名性"},{"id":"a","text":"完整性"},{"id":"b","text":"可用性"}],"correct":"a","difficulty":"easy"},{"id":"c14q8","stem":"交易系統遭癱瘓而無法使用，主要侵害哪項目標？","options":[{"id":"d","text":"不可否認性"},{"id":"a","text":"可用性"},{"id":"b","text":"機密性"},{"id":"c","text":"資料最小化"}],"correct":"a","difficulty":"easy"},{"id":"c14q9","stem":"員工只取得完成工作所需權限，體現什麼原則？","options":[{"id":"a","text":"最小權限"},{"id":"b","text":"無限授權"},{"id":"c","text":"共用管理員"},{"id":"d","text":"公開存取"}],"correct":"a","difficulty":"easy"},{"id":"c14q10","stem":"證據從取得到保存的接觸與移交流程留有紀錄，主要支援什麼？","options":[{"id":"b","text":"信用評級"},{"id":"c","text":"資產稀釋"},{"id":"d","text":"支付代碼化"},{"id":"a","text":"證據保管鏈"}],"correct":"a","difficulty":"easy"},{"id":"c14q11","stem":"收到主管急件要求匯款，信箱看似正確但內容異常，較合適怎麼做？","options":[{"id":"c","text":"直接回傳全部帳密"},{"id":"d","text":"關閉所有付款紀錄"},{"id":"a","text":"透過既有可靠管道另行確認"},{"id":"b","text":"只因語氣急就立即辦理"}],"correct":"a","difficulty":"medium"},{"id":"c14q12","stem":"網站有 HTTPS，能否直接認定其為真銀行？","options":[{"id":"d","text":"能，任何內容都已由銀行審核"},{"id":"a","text":"不能，仍須核對網域與來源"},{"id":"b","text":"能，加密連線就是身分保證"},{"id":"c","text":"能，有鎖頭就不會詐騙"}],"correct":"a","difficulty":"medium"},{"id":"c14q13","stem":"攻擊者透過安全較弱的維護廠商進入銀行，主要涉及什麼？","options":[{"id":"a","text":"供應鏈與第三方風險"},{"id":"b","text":"單純市場價格風險"},{"id":"c","text":"只有客戶信用風險"},{"id":"d","text":"只有股權稀釋"}],"correct":"a","difficulty":"medium"},{"id":"c14q14","stem":"物聯網設備保留預設密碼，可能導致什麼？","options":[{"id":"b","text":"設備自然更安全"},{"id":"c","text":"完全與銀行系統隔離"},{"id":"d","text":"所有資料自動加密"},{"id":"a","text":"被入侵並用於其他攻擊"}],"correct":"a","difficulty":"medium"},{"id":"c14q15","stem":"API 只確認已登入，卻不檢查是否可讀指定客戶資料，缺陷在哪裡？","options":[{"id":"c","text":"帳戶名稱太長"},{"id":"d","text":"支付限額太低"},{"id":"a","text":"物件存取授權不足"},{"id":"b","text":"圖片解析度太高"}],"correct":"a","difficulty":"medium"},{"id":"c14q16","stem":"驗證身分與判斷可做哪些操作，兩者關係為何？","options":[{"id":"d","text":"兩者都不需伺服器執行"},{"id":"a","text":"身分驗證與授權是不同控制"},{"id":"b","text":"登入成功就應可操作全部資料"},{"id":"c","text":"授權只用於公開網頁"}],"correct":"a","difficulty":"medium"},{"id":"c14q17","stem":"員工離職後帳號仍可登入，應改善什麼？","options":[{"id":"a","text":"帳號生命週期與權限撤銷"},{"id":"b","text":"只換公司標誌"},{"id":"c","text":"只縮短郵件標題"},{"id":"d","text":"增加登入歡迎訊息"}],"correct":"a","difficulty":"medium"},{"id":"c14q18","stem":"漏洞修補應如何安排？","options":[{"id":"b","text":"所有漏洞都可永久忽略"},{"id":"c","text":"只修補最容易的畫面問題"},{"id":"d","text":"安裝防火牆後不再更新"},{"id":"a","text":"依暴露、影響與可利用性排定並驗證"}],"correct":"a","difficulty":"medium"},{"id":"c14q19","stem":"資料備份的有效性應如何確認？","options":[{"id":"c","text":"只看硬碟燈有亮"},{"id":"d","text":"只看檔案總數增加"},{"id":"a","text":"定期測試可否完整且及時還原"},{"id":"b","text":"只確認有備份檔名"}],"correct":"a","difficulty":"medium"},{"id":"c14q20","stem":"備份與正式系統使用相同可被勒索的權限，可能有何問題？","options":[{"id":"d","text":"同一帳號方便即可忽略"},{"id":"a","text":"攻擊可同時破壞備份"},{"id":"b","text":"副本數多就一定安全"},{"id":"c","text":"備份不受任何權限影響"}],"correct":"a","difficulty":"medium"},{"id":"c14q21","stem":"資安日誌主要幫助什麼？","options":[{"id":"a","text":"發現異常與追查事件"},{"id":"b","text":"自動阻止所有攻擊"},{"id":"c","text":"保證資料永遠正確"},{"id":"d","text":"取代全部人員訓練"}],"correct":"a","difficulty":"medium"},{"id":"c14q22","stem":"不同系統時間差異很大，對事件調查有何影響？","options":[{"id":"b","text":"所有證據都會自動消失"},{"id":"c","text":"與調查完全無關"},{"id":"d","text":"可直接提高交易速度"},{"id":"a","text":"難以正確重建事件順序"}],"correct":"a","difficulty":"medium"},{"id":"c14q23","stem":"數位證據取得後計算雜湊值，主要用途是什麼？","options":[{"id":"c","text":"還原全部已刪除資料"},{"id":"d","text":"取代所有保管紀錄"},{"id":"a","text":"協助檢查後續內容是否改變"},{"id":"b","text":"直接證明嫌犯有罪"}],"correct":"a","difficulty":"medium"},{"id":"c14q24","stem":"調查人員直接修改原始證據，可能造成什麼？","options":[{"id":"d","text":"所有修改都可不記錄"},{"id":"a","text":"影響證據完整性與可驗證性"},{"id":"b","text":"必然提高證據可信度"},{"id":"c","text":"只影響檔案顏色"}],"correct":"a","difficulty":"medium"},{"id":"c14q25","stem":"發現入侵跡象時，較合理的處理原則為何？","options":[{"id":"a","text":"依程序控制影響、保全證據與協調處置"},{"id":"b","text":"先清空所有紀錄"},{"id":"c","text":"只在社群公開客戶資料"},{"id":"d","text":"等客戶抱怨再決定"}],"correct":"a","difficulty":"medium"},{"id":"c14q26","stem":"風險基礎資安管理，主要是什麼？","options":[{"id":"b","text":"每項設備都投入完全相同金額"},{"id":"c","text":"只防範新聞最熱門事件"},{"id":"d","text":"只看採購價格"},{"id":"a","text":"依可能性與衝擊安排控制資源"}],"correct":"a","difficulty":"medium"},{"id":"c14q27","stem":"持續防禦不只預防，還需什麼？","options":[{"id":"c","text":"完全不需演練"},{"id":"d","text":"永遠不承認有事件"},{"id":"a","text":"偵測、回應與復原"},{"id":"b","text":"只安裝更多同款軟體"}],"correct":"a","difficulty":"medium"},{"id":"c14q28","stem":"定期演練勒索事件，主要目的為何？","options":[{"id":"d","text":"只為增加會議次數"},{"id":"a","text":"驗證分工、備援與回應程序"},{"id":"b","text":"證明未來永不被攻擊"},{"id":"c","text":"取代所有修補"}],"correct":"a","difficulty":"medium"},{"id":"c14q29","stem":"威脅情資分享對金融業有何價值？","options":[{"id":"a","text":"協助掌握手法與改善防禦"},{"id":"b","text":"保證所有情資都即時準確"},{"id":"c","text":"可取代全部內部監測"},{"id":"d","text":"分享越多客戶個資越好"}],"correct":"a","difficulty":"medium"},{"id":"c14q30","stem":"供應商通過認證後，銀行仍應做什麼？","options":[{"id":"b","text":"永久取消監督"},{"id":"c","text":"允許任意存取資料"},{"id":"d","text":"把所有責任移給客戶"},{"id":"a","text":"確認範圍並持續管理服務風險"}],"correct":"a","difficulty":"medium"},{"id":"c14q31","stem":"金融犯罪防範中的 KYC，主要協助什麼？","options":[{"id":"c","text":"取消所有交易監控"},{"id":"d","text":"只決定廣告內容"},{"id":"a","text":"理解客戶身分與交易脈絡"},{"id":"b","text":"保證每位客戶永不違法"}],"correct":"a","difficulty":"medium"},{"id":"c14q32","stem":"實名帳戶仍出現可疑交易，應如何理解？","options":[{"id":"d","text":"名字正確即可永久放行"},{"id":"a","text":"身分確認不能取代持續交易監控"},{"id":"b","text":"實名就不可能洗錢"},{"id":"c","text":"只有匿名帳戶才有風險"}],"correct":"a","difficulty":"medium"},{"id":"c14q33","stem":"買方匯款給真賣家，騙徒假冒付款人取走貨品，反映什麼手法？","options":[{"id":"a","text":"三方詐欺"},{"id":"b","text":"單純退款"},{"id":"c","text":"正常第三方物流"},{"id":"d","text":"合法代理收款"}],"correct":"a","difficulty":"medium"},{"id":"c14q34","stem":"名人推薦的單頁購物廣告，較安全的判斷方式為何？","options":[{"id":"b","text":"有名人照片就可信"},{"id":"c","text":"只有一頁就一定是犯罪"},{"id":"d","text":"只看折扣是否超大"},{"id":"a","text":"核對商家來源、交易條件與可信資料"}],"correct":"a","difficulty":"medium"},{"id":"c14q35","stem":"熟人帳號突然販售商品並要求急匯款，應如何處理？","options":[{"id":"c","text":"只要求更多貼圖"},{"id":"d","text":"先匯款再查證"},{"id":"a","text":"用原有其他管道核實本人與交易"},{"id":"b","text":"認得頭像就可匯款"}],"correct":"a","difficulty":"medium"},{"id":"c14q36","stem":"伺服器監控正常但交易資料大量外流，說明什麼？","options":[{"id":"d","text":"資料外流只影響畫面"},{"id":"a","text":"可用性正常不等於機密性有保障"},{"id":"b","text":"只要能連線就是安全"},{"id":"c","text":"沒有停機就沒有事件"}],"correct":"a","difficulty":"medium"},{"id":"c14q37","stem":"RaaS 較精確的意思為何？","options":[{"id":"a","text":"勒索軟體作為服務的犯罪營運模式"},{"id":"b","text":"所有勒索程式的唯一正式名稱"},{"id":"c","text":"合法備份即服務"},{"id":"d","text":"銀行監理即服務"}],"correct":"a","difficulty":"medium"},{"id":"c14q38","stem":"金融機構資安治理需要高階主管參與，主要原因是什麼？","options":[{"id":"b","text":"技術人員無法處理任何事項"},{"id":"c","text":"所有事件都由主管親自修補"},{"id":"d","text":"只有高階主管能設定密碼"},{"id":"a","text":"資安涉及營運、資源與跨部門責任"}],"correct":"a","difficulty":"medium"},{"id":"c14q39","stem":"比較風險處理優先順序，哪項資訊最完整？","options":[{"id":"c","text":"只有員工人數"},{"id":"d","text":"只有網站人氣"},{"id":"a","text":"業務重要性、暴露與可能損失"},{"id":"b","text":"只有設備售價"}],"correct":"a","difficulty":"medium"},{"id":"c14q40","stem":"評估營運韌性，除了防止入侵還要看什麼？","options":[{"id":"d","text":"只看採購清單"},{"id":"a","text":"受衝擊時維持或恢復關鍵服務的能力"},{"id":"b","text":"只看防火牆數量"},{"id":"c","text":"只看年度培訓時數"}],"correct":"a","difficulty":"medium"},{"id":"c14q41","stem":"攻擊者先外洩資料再加密檔案，為何只恢復備份仍可能不足？","options":[{"id":"a","text":"機密資料外流的影響仍存在"},{"id":"b","text":"恢復備份會自動刪除外部副本"},{"id":"c","text":"加密與外洩不能同時發生"},{"id":"d","text":"只要付費就保證所有資料刪除"}],"correct":"a","difficulty":"hard"},{"id":"c14q42","stem":"銀行所有關鍵系統都依賴同一身分服務，主要須評估什麼？","options":[{"id":"b","text":"系統多就一定分散"},{"id":"c","text":"只看登入畫面是否一致"},{"id":"d","text":"身分服務與營運無關"},{"id":"a","text":"共同依賴造成的集中故障與入侵風險"}],"correct":"a","difficulty":"hard"},{"id":"c14q43","stem":"大量登入失敗來自不同來源且帳號分散，風險分析應如何做？","options":[{"id":"c","text":"把分散請求都當正常"},{"id":"d","text":"直接停止所有紀錄"},{"id":"a","text":"跨帳號與來源關聯分析"},{"id":"b","text":"只看每個來源是否超單一門檻"}],"correct":"a","difficulty":"hard"},{"id":"c14q44","stem":"API 已加密但客戶可改網址編號看到別人明細，主要應修正什麼？","options":[{"id":"d","text":"只隱藏前端按鈕"},{"id":"a","text":"服務端對資料物件的授權檢查"},{"id":"b","text":"只把網址改長"},{"id":"c","text":"只增加 HTTPS 憑證年限"}],"correct":"a","difficulty":"hard"},{"id":"c14q45","stem":"監測告警很多但無人追蹤結案，最關鍵的治理缺口為何？","options":[{"id":"a","text":"偵測與回應責任未有效銜接"},{"id":"b","text":"告警數量不夠多"},{"id":"c","text":"日誌字體太小"},{"id":"d","text":"只缺少新商標"}],"correct":"a","difficulty":"hard"},{"id":"c14q46","stem":"資安演練成功但使用情境過於簡單，如何提升價值？","options":[{"id":"b","text":"只重複同一劇本"},{"id":"c","text":"停止記錄失敗"},{"id":"d","text":"只宣傳成功率"},{"id":"a","text":"加入真實依賴、例外與跨部門協調情境"}],"correct":"a","difficulty":"hard"},{"id":"c14q47","stem":"伺服器恢復後未檢查入侵管道就重新上線，可能造成什麼？","options":[{"id":"c","text":"服務恢復就等於原因已解決"},{"id":"d","text":"所有憑證都會自然更換"},{"id":"a","text":"攻擊者經同一弱點再次進入"},{"id":"b","text":"重開機會自動修復所有漏洞"}],"correct":"a","difficulty":"hard"},{"id":"c14q48","stem":"某控制攔下大多數攻擊卻讓關鍵業務長期停擺，應如何評估？","options":[{"id":"d","text":"全部取消控制"},{"id":"a","text":"平衡安全成效與營運風險並調整設計"},{"id":"b","text":"只看攔阻率即可"},{"id":"c","text":"把業務中斷排除於風險之外"}],"correct":"a","difficulty":"hard"},{"id":"c14q49","stem":"調查需要保全記憶體資料，未評估就關機可能造成什麼？","options":[{"id":"a","text":"揮發性資訊遺失"},{"id":"b","text":"硬碟所有資料必然抹除"},{"id":"c","text":"所有網路證據自動保存"},{"id":"d","text":"加密資料自動解開"}],"correct":"a","difficulty":"hard"},{"id":"c14q50","stem":"外包合約有保密條款但沒有事件通報與查核安排，最應補強什麼？","options":[{"id":"b","text":"只增加保密文字字數"},{"id":"c","text":"只更改合約封面"},{"id":"d","text":"供應商品牌足以取代安排"},{"id":"a","text":"可執行的監督、通報與處置權責"}],"correct":"a","difficulty":"hard"}];</script><script>
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=crypto.getRandomValues(new Uint32Array(1))[0]%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
let questions=[],answers={},finished=false;const $=id=>document.getElementById(id);const escapeHtml=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){questions=shuffle(QUESTIONS).map(q=>({...q,options:shuffle(q.options)}));answers={};finished=false;$('result').classList.add('hidden');$('retry').classList.add('hidden');$('quiz').classList.remove('hidden');$('quiz').querySelector('.bottom').classList.remove('hidden');$('questions').innerHTML=questions.map((q,i)=>`<section class="question" id="${q.id}"><span class="number">QUESTION ${String(i+1).padStart(2,'0')} / 50</span><h2>${escapeHtml(q.stem)}</h2>${q.options.map((o,j)=>`<label><input type="radio" name="${q.id}" value="${o.id}"><span>${String.fromCharCode(65+j)}. ${escapeHtml(o.text)}</span></label>`).join('')}<div class="feedback"></div></section>`).join('');update()}
function update(){$('count').textContent=`已作答 ${Object.keys(answers).length} / 50 題`;$('progress').value=Object.keys(answers).length}
$('quiz').addEventListener('change',e=>{if(!finished&&e.target.type==='radio'){answers[e.target.name]=e.target.value;update()}});
$('quiz').addEventListener('submit',e=>{e.preventDefault();if(finished)return;const missing=50-Object.keys(answers).length;if(missing&&!confirm(`還有 ${missing} 題未作答，未答題以 0 分計算。確定完成？`))return;finished=true;let right=0;for(const q of questions){const section=$(q.id);const ok=answers[q.id]===q.correct;if(ok)right++;for(const input of section.querySelectorAll('input')){input.disabled=true;if(input.value===q.correct)input.closest('label').classList.add('correct');else if(input.checked)input.closest('label').classList.add('wrong')}section.querySelector('.feedback').textContent=ok?'答對了！':`${answers[q.id]?'本題答錯':'本題未作答'}。正確答案：${q.options.find(o=>o.id===q.correct).text}`}$('result').innerHTML=`<span>本次練習得分</span><strong>${right*2}<small style="font-size:22px"> 分</small></strong><p>答對 ${right} 題 · 答錯 ${50-right-missing} 題 · 未答 ${missing} 題</p><p>往下查看每題答案，或重新練習一次。</p>`;$('result').classList.remove('hidden');$('quiz').querySelector('.bottom').classList.add('hidden');$('retry').classList.remove('hidden');$('result').scrollIntoView({behavior:'smooth'});$('result').focus({preventScroll:true})});
$('retry').onclick=()=>{render();window.scrollTo({top:0,behavior:'smooth'})};render();
</script></body></html>
