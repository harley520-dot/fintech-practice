<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第4章｜人工智慧練習</title><style>

mg{max-width:250px;width:100%}.share-url{overflow-wrap:anywhere;font-size:12px;max-width:300px}.badge{display:inline-block;background:#edf5da;color:#42664f;padding:5px 10px;border-radius:30px;font-size:12px}@media(max-width:480px){.question{padding:18px}label{padding:12px}.toolbar{font-size:13px}button{padding:11px 13px}}

</style></head><body><header><div><small>FINTECH PRACTICE · CHAPTER 04</small><h1>人工智慧</h1><p>50 題單選 · 每題 2 分 · 滿分 100 分<br>依自己的步調練習，完成後立即查看得分與正確答案。</p></div><div class="teacher-credit"><strong>數位金融服務</strong><span>楊智宇老師</span></div></header><main><div class="toolbar"><span id="count" aria-live="polite">已作答 0 / 50 題</span></div><progress id="progress" max="50" value="0" aria-label="作答進度"></progress><section id="result" class="result hidden" tabindex="-1"></section><form id="quiz"><div id="questions"></div><div class="bottom"><button class="primary" type="submit">完成作答，查看得分</button><p class="note">無須登入。姓名、學號及成績不會上傳。<br>題目與選項每次練習會重新排列。</p></div></form><button id="retry" class="primary hidden" style="width:100%">重新練習</button></main><script>const QUESTIONS=[{"id":"c4q1","stem":"刷卡系統觀察交易特徵並判斷是否可疑，這最能說明智慧系統的哪種能力？","options":[{"id":"a","text":"根據環境資訊產生符合目標的回應"},{"id":"b","text":"所有決策都必須模仿人類思緒"},{"id":"c","text":"只會儲存資料而不做判斷"},{"id":"d","text":"所有回應皆由使用者逐字輸入"}],"correct":"a","difficulty":"easy"},{"id":"c4q2","stem":"只能辨認支票影像，無法直接處理其他任務的模型，較符合哪種類型？","options":[{"id":"b","text":"通用型人工智慧"},{"id":"c","text":"完整人類智慧"},{"id":"d","text":"無須資料的智慧"},{"id":"a","text":"專用型人工智慧"}],"correct":"a","difficulty":"easy"},{"id":"c4q3","stem":"人工智慧、機器學習與深度學習三者，哪種包含關係較適當？","options":[{"id":"c","text":"機器學習與人工智慧互不相干"},{"id":"d","text":"所有人工智慧都只能是深度學習"},{"id":"a","text":"人工智慧涵蓋機器學習，機器學習涵蓋深度學習"},{"id":"b","text":"深度學習涵蓋全部人工智慧"}],"correct":"a","difficulty":"easy"},{"id":"c4q4","stem":"用已標示「正常／詐欺」的交易訓練模型，屬於哪類學習？","options":[{"id":"d","text":"單純資料備份"},{"id":"a","text":"監督式學習"},{"id":"b","text":"非監督式學習"},{"id":"c","text":"強化式學習"}],"correct":"a","difficulty":"easy"},{"id":"c4q5","stem":"客戶資料沒有群組標籤，模型自行找出相似群體，屬於哪種學習？","options":[{"id":"a","text":"非監督式學習"},{"id":"b","text":"監督式學習"},{"id":"c","text":"純規則輸入"},{"id":"d","text":"數位簽章"}],"correct":"a","difficulty":"easy"},{"id":"c4q6","stem":"少量資料有標籤、大量資料沒有標籤，合併用於訓練，最接近哪種方法？","options":[{"id":"b","text":"全部標註的監督式學習"},{"id":"c","text":"純粹手動分類"},{"id":"d","text":"只有即時獎勵的強化學習"},{"id":"a","text":"半監督式學習"}],"correct":"a","difficulty":"easy"},{"id":"c4q7","stem":"代理程式透過行動後得到的獎勵調整策略，屬於哪種方法？","options":[{"id":"c","text":"單純迴歸報表"},{"id":"d","text":"純文字搜尋"},{"id":"a","text":"強化式學習"},{"id":"b","text":"資料庫排序"}],"correct":"a","difficulty":"easy"},{"id":"c4q8","stem":"模型把申請案件分成「需要覆核／不需覆核」，屬於哪種任務？","options":[{"id":"d","text":"權限管理"},{"id":"a","text":"分類"},{"id":"b","text":"迴歸"},{"id":"c","text":"資料壓縮"}],"correct":"a","difficulty":"easy"},{"id":"c4q9","stem":"模型預測下一季營收金額，較典型屬於哪類任務？","options":[{"id":"a","text":"迴歸"},{"id":"b","text":"分類"},{"id":"c","text":"聚類"},{"id":"d","text":"身分驗證"}],"correct":"a","difficulty":"easy"},{"id":"c4q10","stem":"客服系統辨識「我想查一下扣款」的語意，最直接運用哪種技術？","options":[{"id":"b","text":"工作量證明"},{"id":"c","text":"雲端備份"},{"id":"d","text":"資料中心散熱"},{"id":"a","text":"自然語言處理"}],"correct":"a","difficulty":"easy"},{"id":"c4q11","stem":"以專家提供的規則與推理程序處理問題，最接近哪種系統？","options":[{"id":"c","text":"無知識庫儲存系統"},{"id":"d","text":"加密貨幣錢包"},{"id":"a","text":"專家系統"},{"id":"b","text":"純隨機抽樣系統"}],"correct":"a","difficulty":"medium"},{"id":"c4q12","stem":"專家系統中儲存專業規則的部分，主要扮演什麼角色？","options":[{"id":"d","text":"資料備援機房"},{"id":"a","text":"知識庫"},{"id":"b","text":"圖形顯示器"},{"id":"c","text":"負載平衡器"}],"correct":"a","difficulty":"medium"},{"id":"c4q13","stem":"系統將既有規則套用到個案以形成結論，主要依賴什麼？","options":[{"id":"a","text":"推理引擎"},{"id":"b","text":"影像感測器"},{"id":"c","text":"用量帳單"},{"id":"d","text":"網域名稱"}],"correct":"a","difficulty":"medium"},{"id":"c4q14","stem":"模型學習完成後，將新的申請資料輸入以估計結果，屬於哪個階段？","options":[{"id":"b","text":"建立資料標籤前的收集"},{"id":"c","text":"實體設備採購"},{"id":"d","text":"刪除訓練資料"},{"id":"a","text":"推論或預測"}],"correct":"a","difficulty":"medium"},{"id":"c4q15","stem":"運算能力進步與資料取得增加，對 AI 發展的作用為何？","options":[{"id":"c","text":"使資料品質不再重要"},{"id":"d","text":"讓所有方法都變成規則系統"},{"id":"a","text":"提高較複雜模型訓練與應用的可行性"},{"id":"b","text":"保證模型無須驗證"}],"correct":"a","difficulty":"medium"},{"id":"c4q16","stem":"深度神經網路的多層結構，主要有助於什麼？","options":[{"id":"d","text":"讓輸入不必經過任何處理"},{"id":"a","text":"逐層學習較複雜的資料表徵"},{"id":"b","text":"保證少量資料就一定足夠"},{"id":"c","text":"移除所有運算成本"}],"correct":"a","difficulty":"medium"},{"id":"c4q17","stem":"辨識憑證影像的局部線條與圖樣，哪種架構特別具有代表性？","options":[{"id":"a","text":"卷積神經網路 CNN"},{"id":"b","text":"只按日期排序的資料庫"},{"id":"c","text":"純粹的工作流清單"},{"id":"d","text":"公開金鑰憑證"}],"correct":"a","difficulty":"medium"},{"id":"c4q18","stem":"模型利用先前時點的隱藏狀態處理目前輸入，最接近哪種架構？","options":[{"id":"b","text":"沒有回饋連結的前饋網路"},{"id":"c","text":"只讀記憶體"},{"id":"d","text":"單純雜湊表"},{"id":"a","text":"遞迴神經網路 RNN"}],"correct":"a","difficulty":"medium"},{"id":"c4q19","stem":"LSTM 與一般 RNN 的關係，哪個說法較準確？","options":[{"id":"c","text":"只用於實體密碼鎖"},{"id":"d","text":"不處理任何狀態資訊"},{"id":"a","text":"是處理序列依賴問題的一種改良架構"},{"id":"b","text":"完全不屬於神經網路"}],"correct":"a","difficulty":"medium"},{"id":"c4q20","stem":"前饋神經網路的主要結構特性為何？","options":[{"id":"d","text":"只能處理音訊"},{"id":"a","text":"訊息沿各層向前傳遞而不形成循環連結"},{"id":"b","text":"每個節點都必須連回自己"},{"id":"c","text":"一定保留所有歷史時點"}],"correct":"a","difficulty":"medium"},{"id":"c4q21","stem":"系統依固定步驟把申請欄位搬到另一系統，主要適合使用什麼？","options":[{"id":"a","text":"機器人流程自動化 RPA"},{"id":"b","text":"強化學習的探索策略"},{"id":"c","text":"加密資產共識"},{"id":"d","text":"人工智慧倫理評分"}],"correct":"a","difficulty":"medium"},{"id":"c4q22","stem":"RPA 與機器學習最適當的區分為何？","options":[{"id":"b","text":"所有 RPA 都會自行學習"},{"id":"c","text":"機器學習只能複製滑鼠操作"},{"id":"d","text":"兩者都只處理實體機器人"},{"id":"a","text":"流程自動化可以依規則執行，不必一定具備學習模型"}],"correct":"a","difficulty":"medium"},{"id":"c4q23","stem":"銀行的「客戶畫像」主要指什麼？","options":[{"id":"c","text":"辨認客戶五官比例"},{"id":"d","text":"為每位客戶畫漫畫"},{"id":"a","text":"整合行為與需求特徵形成客戶理解"},{"id":"b","text":"拍攝客戶正面照片"}],"correct":"a","difficulty":"medium"},{"id":"c4q24","stem":"機器人理財要提出合適建議，首先應考慮什麼？","options":[{"id":"d","text":"以帳號奇偶數分配資產"},{"id":"a","text":"投資目標、風險承受度及限制"},{"id":"b","text":"只選近期漲幅最大商品"},{"id":"c","text":"保證每位客戶相同報酬"}],"correct":"a","difficulty":"medium"},{"id":"c4q25","stem":"以替代資料協助信用歷史較少的客戶評分，仍需注意什麼？","options":[{"id":"a","text":"資料品質、適當性與對不同客群的影響"},{"id":"b","text":"沒有信用紀錄就一定低風險"},{"id":"c","text":"使用社群資料就必然準確"},{"id":"d","text":"模型可直接取代全部授信治理"}],"correct":"a","difficulty":"medium"},{"id":"c4q26","stem":"反詐欺模型標記一筆異常交易，較合理的後續是什麼？","options":[{"id":"b","text":"直接認定持卡人犯罪"},{"id":"c","text":"立即公開客戶身分"},{"id":"d","text":"取消全部正常交易"},{"id":"a","text":"依風險與程序進行驗證或覆核"}],"correct":"a","difficulty":"medium"},{"id":"c4q27","stem":"保險公司用影像模型協助估計損傷，主要支援哪項業務？","options":[{"id":"c","text":"股票拆分"},{"id":"d","text":"公鑰生成"},{"id":"a","text":"理賠評估"},{"id":"b","text":"銀行間清算"}],"correct":"a","difficulty":"medium"},{"id":"c4q28","stem":"AI 分析財報文字與風險描述，最適合支援哪項工作？","options":[{"id":"d","text":"免除所有查核"},{"id":"a","text":"研究與監理資訊整理"},{"id":"b","text":"保證未來公司獲利"},{"id":"c","text":"自動確認全部陳述真實"}],"correct":"a","difficulty":"medium"},{"id":"c4q29","stem":"系統彙整投資組合數據並生成易讀報告，最合理的用途是什麼？","options":[{"id":"a","text":"協助客戶理解投資狀況"},{"id":"b","text":"使投資必然沒有損失"},{"id":"c","text":"取代原始資料的正確性"},{"id":"d","text":"讓績效不再需要計算"}],"correct":"a","difficulty":"medium"},{"id":"c4q30","stem":"智慧客服遇到無法確認的複雜爭議，較合適的設計為何？","options":[{"id":"b","text":"自行編造確定答案"},{"id":"c","text":"持續重複同一回答"},{"id":"d","text":"封鎖所有後續聯絡"},{"id":"a","text":"轉接人員並提供必要對話脈絡"}],"correct":"a","difficulty":"medium"},{"id":"c4q31","stem":"RegTech 用於金融機構時，較典型的用途是什麼？","options":[{"id":"c","text":"保證所有案件無須人工檢查"},{"id":"d","text":"取代法院作出裁判"},{"id":"a","text":"協助法遵與風險監測"},{"id":"b","text":"自行創設法規效力"}],"correct":"a","difficulty":"medium"},{"id":"c4q32","stem":"監理單位使用分析工具檢視受監理機構資訊，較常歸入哪個概念？","options":[{"id":"d","text":"PoW"},{"id":"a","text":"SupTech"},{"id":"b","text":"SaaS 計費"},{"id":"c","text":"ICO"}],"correct":"a","difficulty":"medium"},{"id":"c4q33","stem":"監督式模型學到的資料包含系統性偏見，可能產生什麼後果？","options":[{"id":"a","text":"把歷史上的不公平帶進新決策"},{"id":"b","text":"資料筆數多就會自動消失"},{"id":"c","text":"只影響儲存成本"},{"id":"d","text":"不可能影響任何客戶"}],"correct":"a","difficulty":"medium"},{"id":"c4q34","stem":"多家機構使用高度相似的交易策略，在市場壓力時可能放大什麼？","options":[{"id":"b","text":"所有投資組合的分散效果"},{"id":"c","text":"長期固定的資產價格"},{"id":"d","text":"市場參與者的獨立性"},{"id":"a","text":"同步買賣造成的市場波動"}],"correct":"a","difficulty":"medium"},{"id":"c4q35","stem":"不讓使用者理解自動決策的主要因素，最直接涉及哪項原則？","options":[{"id":"c","text":"儲存容量"},{"id":"d","text":"資料下載速度"},{"id":"a","text":"透明性與可解釋性"},{"id":"b","text":"運算資源彈性"}],"correct":"a","difficulty":"medium"},{"id":"c4q36","stem":"AI 決策需保留版本、輸入與覆核紀錄，主要支援什麼？","options":[{"id":"d","text":"取消稽核工作"},{"id":"a","text":"可追溯性與問責"},{"id":"b","text":"保證決策完全正確"},{"id":"c","text":"免除所有責任"}],"correct":"a","difficulty":"medium"},{"id":"c4q37","stem":"模型在開發資料表現良好，上線後仍要監控什麼？","options":[{"id":"a","text":"資料與環境改變造成的表現下降"},{"id":"b","text":"只有網頁瀏覽人次"},{"id":"c","text":"只有程式檔名"},{"id":"d","text":"是否使用最新的行銷標語"}],"correct":"a","difficulty":"medium"},{"id":"c4q38","stem":"同仁由重複輸入轉向處理例外案件，組織應搭配什麼？","options":[{"id":"b","text":"假設所有技能可立即轉移"},{"id":"c","text":"停止所有人員參與"},{"id":"d","text":"只增加例行輸入工作"},{"id":"a","text":"技能培訓與職務調整"}],"correct":"a","difficulty":"medium"},{"id":"c4q39","stem":"AI 服務蒐集客戶資料時，哪個做法較符合隱私治理？","options":[{"id":"c","text":"先公開再詢問用途"},{"id":"d","text":"讓所有合作商共用帳密"},{"id":"a","text":"限於必要資料並管理存取與保存"},{"id":"b","text":"資料越多越好且無限保存"}],"correct":"a","difficulty":"medium"},{"id":"c4q40","stem":"由人員審查模型建議後才准許放行重要案件，反映什麼設計？","options":[{"id":"d","text":"把判斷責任交給客戶"},{"id":"a","text":"在決策流程中保留有效的人類控制"},{"id":"b","text":"讓模型完全不受監督"},{"id":"c","text":"只看硬體速度"}],"correct":"a","difficulty":"medium"},{"id":"c4q41","stem":"詐欺交易只占 1%，模型把全部交易判為正常也有 99% 準確率。應如何評估？","options":[{"id":"a","text":"還須檢查詐欺偵測率與誤報等指標"},{"id":"b","text":"99% 已證明可直接全面上線"},{"id":"c","text":"只需增加準確率的小數位數"},{"id":"d","text":"正常交易多就不需反詐欺"}],"correct":"a","difficulty":"hard"},{"id":"c4q42","stem":"模型以郵遞區號替代敏感特徵，對某族群造成不利結果。哪項判斷較合理？","options":[{"id":"b","text":"刪掉敏感欄位就必然公平"},{"id":"c","text":"地理資料永遠不會帶來偏差"},{"id":"d","text":"只要模型複雜就無須檢查"},{"id":"a","text":"非敏感欄位也可能間接反映敏感差異"}],"correct":"a","difficulty":"hard"},{"id":"c4q43","stem":"模型供應商不揭露全部商業機密，銀行應如何維持治理？","options":[{"id":"c","text":"只相信銷售簡報"},{"id":"d","text":"把所有錯誤歸給客戶"},{"id":"a","text":"約定可驗證的評估、監控、稽核與責任機制"},{"id":"b","text":"以保密為理由放棄全部檢查"}],"correct":"a","difficulty":"hard"},{"id":"c4q44","stem":"為提高攔阻率而調低風險告警門檻，通常還須評估什麼？","options":[{"id":"d","text":"客戶數量是否必然減半"},{"id":"a","text":"增加的誤報與人工覆核負擔"},{"id":"b","text":"資料是否立刻變成無標籤"},{"id":"c","text":"所有漏報是否必然歸零"}],"correct":"a","difficulty":"hard"},{"id":"c4q45","stem":"訓練資料遭人植入誤導範例，與單純大量請求耗盡服務資源有何不同？","options":[{"id":"a","text":"前者針對學習資料，後者針對服務資源可用性"},{"id":"b","text":"兩者都只改變影像解析度"},{"id":"c","text":"兩者都等於模型正常訓練"},{"id":"d","text":"兩者都不影響任何結果"}],"correct":"a","difficulty":"hard"},{"id":"c4q46","stem":"影像只被微小改動，模型卻辨識錯誤，優先應檢查什麼風險？","options":[{"id":"b","text":"伺服器折舊風險"},{"id":"c","text":"會計期間分配"},{"id":"d","text":"一般用量計費"},{"id":"a","text":"對抗性輸入與模型穩健性"}],"correct":"a","difficulty":"hard"},{"id":"c4q47","stem":"客服模型答得流暢卻引用不存在的產品條件，改善重點為何？","options":[{"id":"c","text":"只增加回答字數"},{"id":"d","text":"以流暢度取代內容驗證"},{"id":"a","text":"驗證知識來源、限制不確定回答並保留轉人工機制"},{"id":"b","text":"把語氣改得更確定"}],"correct":"a","difficulty":"hard"},{"id":"c4q48","stem":"一套模型已提供解釋，但找不到負責處理申訴的人員。仍欠缺什麼？","options":[{"id":"d","text":"更多配色方案"},{"id":"a","text":"明確問責與救濟處理安排"},{"id":"b","text":"更大的顯示螢幕"},{"id":"c","text":"更多模型參數"}],"correct":"a","difficulty":"hard"},{"id":"c4q49","stem":"信用模型更新後整體準確率略升，卻明顯傷害新戶服務，該如何決策？","options":[{"id":"a","text":"綜合分群影響、業務目標與風險後再決定部署"},{"id":"b","text":"只看整體指標就直接替換"},{"id":"c","text":"把新戶排除於評估之外"},{"id":"d","text":"用較新版本名稱證明品質"}],"correct":"a","difficulty":"hard"},{"id":"c4q50","stem":"強化學習系統只獎勵短期營收，可能出現什麼問題？","options":[{"id":"b","text":"系統必然自行理解所有倫理要求"},{"id":"c","text":"獎勵越單一就越能反映完整目標"},{"id":"d","text":"短期營收可代表所有治理面向"},{"id":"a","text":"追求獎勵而忽略長期客戶與風險成本"}],"correct":"a","difficulty":"hard"}];</script><script>
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=crypto.getRandomValues(new Uint32Array(1))[0]%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
let questions=[],answers={},finished=false;const $=id=>document.getElementById(id);const escapeHtml=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){questions=shuffle(QUESTIONS).map(q=>({...q,options:shuffle(q.options)}));answers={};finished=false;$('result').classList.add('hidden');$('retry').classList.add('hidden');$('quiz').classList.remove('hidden');$('quiz').querySelector('.bottom').classList.remove('hidden');$('questions').innerHTML=questions.map((q,i)=>`<section class="question" id="${q.id}"><span class="number">QUESTION ${String(i+1).padStart(2,'0')} / 50</span><h2>${escapeHtml(q.stem)}</h2>${q.options.map((o,j)=>`<label><input type="radio" name="${q.id}" value="${o.id}"><span>${String.fromCharCode(65+j)}. ${escapeHtml(o.text)}</span></label>`).join('')}<div class="feedback"></div></section>`).join('');update()}
function update(){$('count').textContent=`已作答 ${Object.keys(answers).length} / 50 題`;$('progress').value=Object.keys(answers).length}
$('quiz').addEventListener('change',e=>{if(!finished&&e.target.type==='radio'){answers[e.target.name]=e.target.value;update()}});
$('quiz').addEventListener('submit',e=>{e.preventDefault();if(finished)return;const missing=50-Object.keys(answers).length;if(missing&&!confirm(`還有 ${missing} 題未作答，未答題以 0 分計算。確定完成？`))return;finished=true;let right=0;for(const q of questions){const section=$(q.id);const ok=answers[q.id]===q.correct;if(ok)right++;for(const input of section.querySelectorAll('input')){input.disabled=true;if(input.value===q.correct)input.closest('label').classList.add('correct');else if(input.checked)input.closest('label').classList.add('wrong')}section.querySelector('.feedback').textContent=ok?'答對了！':`${answers[q.id]?'本題答錯':'本題未作答'}。正確答案：${q.options.find(o=>o.id===q.correct).text}`}$('result').innerHTML=`<span>本次練習得分</span><strong>${right*2}<small style="font-size:22px"> 分</small></strong><p>答對 ${right} 題 · 答錯 ${50-right-missing} 題 · 未答 ${missing} 題</p><p>往下查看每題答案，或重新練習一次。</p>`;$('result').classList.remove('hidden');$('quiz').querySelector('.bottom').classList.add('hidden');$('retry').classList.remove('hidden');$('result').scrollIntoView({behavior:'smooth'});$('result').focus({preventScroll:true})});
$('retry').onclick=()=>{render();window.scrollTo({top:0,behavior:'smooth'})};render();
</script></body></html>
