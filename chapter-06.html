<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第6章｜生物辨識練習</title><style>
:root{font-family:"Microsoft JhengHei",sans-serif;color:#173d32;background:#f5f4ed}*{box-sizing:border-box}body{margin:0}header{background:#173d32;color:#fff;padding:22px max(20px,calc((100vw - 850px)/2));}header small{color:#d7ed8a;letter-spacing:3px}h1{font-size:clamp(26px,5vw,40px);margin:12px 0}header p{color:#c7d7cf;line-height:1.7}main{max-width:850px;margin:auto;padding:24px 18px 60px}.toolbar{display:flex;justify-content:space-between;gap:15px;align-items:center;position:sticky;top:0;background:#f5f4edf5;padding:14px 0;z-index:2}button{font:inherit;cursor:pointer;border:1px solid #cdd9d0;background:white;color:#173d32;border-radius:12px;padding:12px 18px}button:focus-visible,input:focus-visible{outline:3px solid #9ebf36;outline-offset:3px}.primary{background:#173d32;color:white;border:0}.question{background:white;border-radius:20px;padding:24px;margin:18px 0;border:1px solid #e0e5dd}.question h2{font-size:19px;line-height:1.7;margin:10px 0 20px}.number{font-size:12px;font-weight:bold;color:#608070}label{display:flex;align-items:flex-start;gap:12px;padding:14px;border:1px solid #e0e5dd;border-radius:12px;margin:10px 0;cursor:pointer;line-height:1.6}label:has(input:checked){background:#edf5da;border-color:#779a45}input{accent-color:#286247;margin-top:5px;flex-shrink:0}.correct{background:#e6f3e8!important;border-color:#58a16a!important}.wrong{background:#fce9e5!important;border-color:#c66b5e!important}.feedback{color:#42664f;font-size:14px;line-height:1.8}.bottom{display:grid;gap:15px;text-align:center}.bottom button{padding:18px}.note{color:#6c7e72;font-size:13px;line-height:1.7}.result{background:#173d32;color:white;border-radius:24px;padding:32px;text-align:center;margin:20px 0}.result strong{display:block;font-size:70px;color:#d7ed8a}.result p{line-height:1.8}.hidden{display:none}progress{width:100%;height:7px;accent-color:#6e982d}dialog{border:0;border-radius:20px;max-width:90vw;padding:26px;text-align:center}dialog::backdrop{background:#173d3299}dialog img{max-width:250px;width:100%}.share-url{overflow-wrap:anywhere;font-size:12px;max-width:300px}.badge{display:inline-block;background:#edf5da;color:#42664f;padding:5px 10px;border-radius:30px;font-size:12px}@media(max-width:480px){.question{padding:18px}label{padding:12px}.toolbar{font-size:13px}button{padding:11px 13px}}
header{display:flex;justify-content:space-between;align-items:center;gap:24px}.teacher-credit{text-align:right;flex-shrink:0;line-height:1.9}.teacher-credit strong{display:block;color:#d7ed8a;font-size:20px}.teacher-credit span{font-size:17px}@media(max-width:650px){header{flex-wrap:wrap;gap:8px}.teacher-credit{margin-left:auto}.teacher-credit strong{font-size:18px}.teacher-credit span{font-size:15px}}
</style></head><body><header><div><small>FINTECH PRACTICE · CHAPTER 06</small><h1>生物辨識</h1><p>50 題單選 · 每題 2 分 · 滿分 100 分<br>依自己的步調練習，完成後立即查看得分與正確答案。</p></div><div class="teacher-credit"><strong>數位金融服務</strong><span>楊智宇老師</span></div></header><main><div class="toolbar"><span id="count" aria-live="polite">已作答 0 / 50 題</span></div><progress id="progress" max="50" value="0" aria-label="作答進度"></progress><section id="result" class="result hidden" tabindex="-1"></section><form id="quiz"><div id="questions"></div><div class="bottom"><button class="primary" type="submit">完成作答，查看得分</button><p class="note">無須登入。姓名、學號及成績不會上傳。<br>題目與選項每次練習會重新排列。</p></div></form><button id="retry" class="primary hidden" style="width:100%">重新練習</button></main><script>const QUESTIONS=[{"id":"c6q1","stem":"手機以使用者的指紋解鎖金融服務，主要運用哪類身分依據？","options":[{"id":"a","text":"個人固有的生物特徵"},{"id":"b","text":"只有本人知道的知識"},{"id":"c","text":"只有本人持有的物件"},{"id":"d","text":"公開的帳戶餘額"}],"correct":"a","difficulty":"easy"},{"id":"c6q2","stem":"客戶記住的交易密碼，屬於哪種驗證因子？","options":[{"id":"b","text":"所持因子"},{"id":"c","text":"生物因子"},{"id":"d","text":"地理因子"},{"id":"a","text":"所知因子"}],"correct":"a","difficulty":"easy"},{"id":"c6q3","stem":"客戶事先綁定且持有的驗證裝置，較接近哪類因子？","options":[{"id":"c","text":"生物因子"},{"id":"d","text":"交易金額因子"},{"id":"a","text":"所持因子"},{"id":"b","text":"所知因子"}],"correct":"a","difficulty":"easy"},{"id":"c6q4","stem":"兩組不同的固定密碼，在因子分類上應如何看待？","options":[{"id":"d","text":"可直接視為三因子"},{"id":"a","text":"仍主要屬於同一類所知因子"},{"id":"b","text":"必然構成兩種獨立因子"},{"id":"c","text":"同時等於指紋與裝置"}],"correct":"a","difficulty":"easy"},{"id":"c6q5","stem":"電話客服比對說話者的聲音特徵，使用哪種辨識？","options":[{"id":"a","text":"聲紋辨識"},{"id":"b","text":"指靜脈辨識"},{"id":"c","text":"虹膜辨識"},{"id":"d","text":"指紋辨識"}],"correct":"a","difficulty":"easy"},{"id":"c6q6","stem":"擷取手指表面紋路的特徵來比對，屬於哪項技術？","options":[{"id":"b","text":"聲紋辨識"},{"id":"c","text":"人臉辨識"},{"id":"d","text":"步態辨識"},{"id":"a","text":"指紋辨識"}],"correct":"a","difficulty":"easy"},{"id":"c6q7","stem":"從鏡頭影像分析臉部特徵確認使用者，主要是哪項技術？","options":[{"id":"c","text":"動態密碼"},{"id":"d","text":"裝置序號驗證"},{"id":"a","text":"人臉辨識"},{"id":"b","text":"指靜脈辨識"}],"correct":"a","difficulty":"easy"},{"id":"c6q8","stem":"系統接受了假冒者，這是哪一類錯誤？","options":[{"id":"d","text":"正確拒絕"},{"id":"a","text":"誤接受"},{"id":"b","text":"誤拒絕"},{"id":"c","text":"正確接受"}],"correct":"a","difficulty":"easy"},{"id":"c6q9","stem":"本人操作卻被系統拒絕，這是哪一類錯誤？","options":[{"id":"a","text":"誤拒絕"},{"id":"b","text":"誤接受"},{"id":"c","text":"正確接受"},{"id":"d","text":"正確拒絕"}],"correct":"a","difficulty":"easy"},{"id":"c6q10","stem":"只能在特定條件下使用一次的驗證碼，通常稱為什麼？","options":[{"id":"b","text":"API"},{"id":"c","text":"AUM"},{"id":"d","text":"ETF"},{"id":"a","text":"OTP"}],"correct":"a","difficulty":"easy"},{"id":"c6q11","stem":"以近紅外線取得手指內部血管分布作比對，最接近哪種辨識？","options":[{"id":"c","text":"簽名辨識"},{"id":"d","text":"聲紋辨識"},{"id":"a","text":"指靜脈辨識"},{"id":"b","text":"指紋辨識"}],"correct":"a","difficulty":"medium"},{"id":"c6q12","stem":"虹膜辨識主要分析眼睛的哪項資訊？","options":[{"id":"d","text":"眼鏡鏡片的反光程度"},{"id":"a","text":"虹膜的紋理特徵"},{"id":"b","text":"視網膜血管的脈搏速度"},{"id":"c","text":"瞳孔內保存的密碼"}],"correct":"a","difficulty":"medium"},{"id":"c6q13","stem":"登錄生物特徵時建立供日後比對的數位表徵，通常稱為什麼？","options":[{"id":"a","text":"特徵模板"},{"id":"b","text":"公開憑證清單"},{"id":"c","text":"一次性交易碼"},{"id":"d","text":"帳戶利率表"}],"correct":"a","difficulty":"medium"},{"id":"c6q14","stem":"登錄階段若把甲的臉綁到乙的帳戶，之後比對準確仍有何問題？","options":[{"id":"b","text":"模板一定無法被辨識"},{"id":"c","text":"每次誤拒率必然為零"},{"id":"d","text":"只需提高鏡頭解析度即可修正"},{"id":"a","text":"身分與模板的初始連結錯誤"}],"correct":"a","difficulty":"medium"},{"id":"c6q15","stem":"客戶先聲稱自己是某帳戶持有人，再與該人的模板比對，屬於什麼？","options":[{"id":"c","text":"資料分群"},{"id":"d","text":"公開資料查詢"},{"id":"a","text":"一對一驗證"},{"id":"b","text":"一對多搜尋"}],"correct":"a","difficulty":"medium"},{"id":"c6q16","stem":"系統從許多已登錄臉部模板中找出到訪者，較接近什麼？","options":[{"id":"d","text":"只驗證交易金額"},{"id":"a","text":"一對多識別"},{"id":"b","text":"一對一驗證"},{"id":"c","text":"僅檢查密碼長度"}],"correct":"a","difficulty":"medium"},{"id":"c6q17","stem":"人臉辨識在逆光環境明顯下降，應優先評估什麼？","options":[{"id":"a","text":"照明與拍攝條件"},{"id":"b","text":"存款利率"},{"id":"c","text":"網址字數"},{"id":"d","text":"報表頁數"}],"correct":"a","difficulty":"medium"},{"id":"c6q18","stem":"工人手指磨損導致無法辨識，較合適的服務安排為何？","options":[{"id":"b","text":"永久關閉其金融帳戶"},{"id":"c","text":"要求改用他人的指紋"},{"id":"d","text":"直接取消全部驗證"},{"id":"a","text":"提供安全的替代驗證流程"}],"correct":"a","difficulty":"medium"},{"id":"c6q19","stem":"客戶感冒時聲紋比對失敗，反映哪項限制？","options":[{"id":"c","text":"所有遠端辨識都不能使用"},{"id":"d","text":"錄音檔越長就一定正確"},{"id":"a","text":"生理狀態可能改變聲音特徵"},{"id":"b","text":"聲紋與環境完全無關"}],"correct":"a","difficulty":"medium"},{"id":"c6q20","stem":"把照片對著鏡頭冒充本人，系統可用哪項能力降低風險？","options":[{"id":"d","text":"只詢問客戶姓名"},{"id":"a","text":"活體與展示攻擊偵測"},{"id":"b","text":"只檢查檔案大小"},{"id":"c","text":"把相似度門檻降到最低"}],"correct":"a","difficulty":"medium"},{"id":"c6q21","stem":"活體偵測與身分比對之間，哪種理解較適當？","options":[{"id":"a","text":"前者判斷是否為真實呈現，後者比較身分特徵"},{"id":"b","text":"兩者結果永遠相同"},{"id":"c","text":"活體通過即可證明帳戶歸屬"},{"id":"d","text":"身分比對通過就沒有重播風險"}],"correct":"a","difficulty":"medium"},{"id":"c6q22","stem":"輸入密碼後，再以已綁定裝置確認交易，主要強化什麼？","options":[{"id":"b","text":"同一密碼的字型"},{"id":"c","text":"資料庫容量"},{"id":"d","text":"廣告投放精準度"},{"id":"a","text":"不同類別因子的組合"}],"correct":"a","difficulty":"medium"},{"id":"c6q23","stem":"指紋加上人臉辨識在分類上有何特點？","options":[{"id":"c","text":"兩者都屬於固定密碼"},{"id":"d","text":"只要兩種生物特徵就完全不需治理"},{"id":"a","text":"都是生物類因子，不宜只按數量認定獨立類別"},{"id":"b","text":"一定等於所知加所持"}],"correct":"a","difficulty":"medium"},{"id":"c6q24","stem":"高風險交易需要更嚴格確認，哪種安排較合理？","options":[{"id":"d","text":"一律沿用最寬鬆門檻"},{"id":"a","text":"依風險追加獨立驗證或人工確認"},{"id":"b","text":"所有交易都只看暱稱"},{"id":"c","text":"高金額反而免驗證"}],"correct":"a","difficulty":"medium"},{"id":"c6q25","stem":"客戶收到 OTP 卻被要求念給陌生來電者，應如何處理？","options":[{"id":"a","text":"停止提供並透過官方管道查證"},{"id":"b","text":"對方知道姓名就可提供"},{"id":"c","text":"只提供最後四碼便無風險"},{"id":"d","text":"提供後立即刪除簡訊即可"}],"correct":"a","difficulty":"medium"},{"id":"c6q26","stem":"FIDO 驗證的一項典型做法是什麼？","options":[{"id":"b","text":"把所有私鑰集中公開"},{"id":"c","text":"每次把指紋照片當密碼傳送"},{"id":"d","text":"只用相同固定密碼登入所有服務"},{"id":"a","text":"裝置以私鑰簽署挑戰，由服務端驗證"}],"correct":"a","difficulty":"medium"},{"id":"c6q27","stem":"裝置以指紋解鎖本地驗證金鑰，服務端通常需要收到什麼？","options":[{"id":"c","text":"裝置內的私鑰原文"},{"id":"d","text":"其他服務的登入密碼"},{"id":"a","text":"可供驗證的簽章證明"},{"id":"b","text":"完整原始指紋影像"}],"correct":"a","difficulty":"medium"},{"id":"c6q28","stem":"指紋模板外洩後，相較固定密碼有哪些處理困難？","options":[{"id":"d","text":"所有模板都可公開無妨"},{"id":"a","text":"身體特徵無法像密碼一樣任意更換"},{"id":"b","text":"換一個帳號即可改變指紋"},{"id":"c","text":"重新開機就會生成新的手指"}],"correct":"a","difficulty":"medium"},{"id":"c6q29","stem":"生物模板的保存與傳輸應如何管理？","options":[{"id":"a","text":"採取適當加密、權限與生命週期控制"},{"id":"b","text":"只變更檔名就足夠"},{"id":"c","text":"開放所有客服下載"},{"id":"d","text":"與公開宣傳資料同樣處理"}],"correct":"a","difficulty":"medium"},{"id":"c6q30","stem":"測試 2,000 次假冒嘗試，誤接受 4 次，FAR 為多少？","options":[{"id":"b","text":"2%"},{"id":"c","text":"20%"},{"id":"d","text":"0.02%"},{"id":"a","text":"0.2%"}],"correct":"a","difficulty":"medium"},{"id":"c6q31","stem":"本人嘗試 500 次，有 15 次被拒絕，FRR 為多少？","options":[{"id":"c","text":"15%"},{"id":"d","text":"30%"},{"id":"a","text":"3%"},{"id":"b","text":"0.3%"}],"correct":"a","difficulty":"medium"},{"id":"c6q32","stem":"若系統以較高相似度門檻才放行，通常可能出現何種取捨？","options":[{"id":"d","text":"所有辨識都立即變快"},{"id":"a","text":"誤接受下降，但誤拒可能增加"},{"id":"b","text":"兩種錯誤必然同時歸零"},{"id":"c","text":"誤拒必然下降且不影響安全"}],"correct":"a","difficulty":"medium"},{"id":"c6q33","stem":"只強調 FAR 很低，卻不測試 FRR，可能忽略什麼？","options":[{"id":"a","text":"本人使用時的阻礙與服務負擔"},{"id":"b","text":"模板檔案名稱"},{"id":"c","text":"全部資料壓縮率"},{"id":"d","text":"每位客戶的信用評分"}],"correct":"a","difficulty":"medium"},{"id":"c6q34","stem":"評估分行生物辨識設備時，哪項資料最有用？","options":[{"id":"b","text":"供應商海報上的最高分"},{"id":"c","text":"只有實驗室單一次成功"},{"id":"d","text":"只比較外殼顏色"},{"id":"a","text":"實際客群與環境下的辨識表現"}],"correct":"a","difficulty":"medium"},{"id":"c6q35","stem":"遠距開戶中的 eKYC，主要任務是什麼？","options":[{"id":"c","text":"只確認手機電量"},{"id":"d","text":"只看使用者社群人氣"},{"id":"a","text":"以電子流程核對身分及相關必要資訊"},{"id":"b","text":"只決定存款優惠利率"}],"correct":"a","difficulty":"medium"},{"id":"c6q36","stem":"視訊開戶已完成臉部比對，為何仍需核對證件？","options":[{"id":"d","text":"臉部相似即可取得所有人的帳戶"},{"id":"a","text":"生物相似度不能單獨建立完整法定身分連結"},{"id":"b","text":"證件只是裝飾流程"},{"id":"c","text":"鏡頭清楚就不需其他資訊"}],"correct":"a","difficulty":"medium"},{"id":"c6q37","stem":"金融服務提供多種辨識方法，主要可改善什麼？","options":[{"id":"a","text":"不同客群與使用情境的適用性"},{"id":"b","text":"讓所有方法共享一個弱密碼"},{"id":"c","text":"永久停止例外處理"},{"id":"d","text":"保證每種方式零成本"}],"correct":"a","difficulty":"medium"},{"id":"c6q38","stem":"設備遺失後，安全的帳戶復原流程應確認什麼？","options":[{"id":"b","text":"只看新手機品牌"},{"id":"c","text":"只詢問公開姓名"},{"id":"d","text":"把舊私鑰寄給任意信箱"},{"id":"a","text":"申請者身分並撤銷或更替舊驗證憑證"}],"correct":"a","difficulty":"medium"},{"id":"c6q39","stem":"分行想以人臉辨認熟客，仍須考慮什麼？","options":[{"id":"c","text":"所有路人都已同意建檔"},{"id":"d","text":"客戶進門即代表同意所有利用"},{"id":"a","text":"告知、適當依據與特徵資料保護"},{"id":"b","text":"辨識方便就可無限蒐集"}],"correct":"a","difficulty":"medium"},{"id":"c6q40","stem":"選擇生物辨識方案時，較完整的評估為何？","options":[{"id":"d","text":"所有客戶都必須適用同一裝置"},{"id":"a","text":"安全、可用性、接受度與成本一起考量"},{"id":"b","text":"只比較最高解析度"},{"id":"c","text":"只挑宣稱完全無誤的產品"}],"correct":"a","difficulty":"medium"},{"id":"c6q41","stem":"廠商的 FAR、FRR 來自不同門檻的最佳成績，為何不能直接合併宣傳？","options":[{"id":"a","text":"兩數未必對應同一運作條件"},{"id":"b","text":"只要數字小就可任意搭配"},{"id":"c","text":"FAR 與 FRR 完全沒有關聯"},{"id":"d","text":"不同門檻必然具有相同結果"}],"correct":"a","difficulty":"hard"},{"id":"c6q42","stem":"某辨識系統整體誤拒率很低，少數客群卻常失敗，應如何改善？","options":[{"id":"b","text":"只公布整體平均"},{"id":"c","text":"直接移除該客群的資格"},{"id":"d","text":"把所有失敗改記為成功"},{"id":"a","text":"分群評估並提供替代流程與模型調整"}],"correct":"a","difficulty":"hard"},{"id":"c6q43","stem":"若備援驗證只需公開生日，對高強度生物驗證有何影響？","options":[{"id":"c","text":"生日驗證等同活體偵測"},{"id":"d","text":"備援流程不會影響安全"},{"id":"a","text":"攻擊者可能繞過主流程從弱備援進入"},{"id":"b","text":"主流程強就能自動保護所有備援"}],"correct":"a","difficulty":"hard"},{"id":"c6q44","stem":"深偽聲音能模仿客戶，語音金融服務較適合怎樣設計？","options":[{"id":"d","text":"讓聲紋成為任何交易的唯一依據"},{"id":"a","text":"結合風險偵測、獨立驗證與例外覆核"},{"id":"b","text":"只加大聲紋音量"},{"id":"c","text":"只檢查來電者聲音是否好聽"}],"correct":"a","difficulty":"hard"},{"id":"c6q45","stem":"裝置安全區內的私鑰被保護，卻顯示假交易內容讓客戶確認，仍有何問題？","options":[{"id":"a","text":"簽章可能授權了被誤導的交易"},{"id":"b","text":"私鑰安全就代表交易內容必然正確"},{"id":"c","text":"辨識本人即可保證理解全部內容"},{"id":"d","text":"只需重拍指紋便可消除誤導"}],"correct":"a","difficulty":"hard"},{"id":"c6q46","stem":"把辨識門檻一律降到低點以減少客服電話，可能帶來什麼？","options":[{"id":"b","text":"安全性必然提高"},{"id":"c","text":"生物特徵將不再需要"},{"id":"d","text":"假冒者一定更容易被拒"},{"id":"a","text":"誤接受增加而放大冒用風險"}],"correct":"a","difficulty":"hard"},{"id":"c6q47","stem":"兩種辨識都使用同一張低品質影像，為何組合效果可能有限？","options":[{"id":"c","text":"辨識次數增加就保證正確"},{"id":"d","text":"影像品質不影響任何模型"},{"id":"a","text":"錯誤可能受共同來源影響而相關"},{"id":"b","text":"同一來源必然使錯誤獨立"}],"correct":"a","difficulty":"hard"},{"id":"c6q48","stem":"交易量大幅增加時，即使 FAR 不變，也應注意什麼？","options":[{"id":"d","text":"本人越多假冒者就自動消失"},{"id":"a","text":"假冒嘗試數增加可能提高誤接受事件數"},{"id":"b","text":"百分比不變就代表事件數不變"},{"id":"c","text":"交易量只影響利率"}],"correct":"a","difficulty":"hard"},{"id":"c6q49","stem":"某方案只能在高速網路下辨識，面向偏鄉客戶時應如何評估？","options":[{"id":"a","text":"把連線條件與替代服務納入可近性設計"},{"id":"b","text":"假定所有客戶都有相同網速"},{"id":"c","text":"直接取消偏鄉開戶"},{"id":"d","text":"只比較模型參數量"}],"correct":"a","difficulty":"hard"},{"id":"c6q50","stem":"生物比對通過後，仍發現代理人用客戶手機操作，應如何看待？","options":[{"id":"b","text":"單次通過可保證未來全部行為都是本人"},{"id":"c","text":"只要手機同品牌就安全"},{"id":"d","text":"所有代理操作都可由指紋自動判定合法"},{"id":"a","text":"驗證事件須連同裝置、授權內容與風險脈絡評估"}],"correct":"a","difficulty":"hard"}];</script><script>
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=crypto.getRandomValues(new Uint32Array(1))[0]%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
let questions=[],answers={},finished=false;const $=id=>document.getElementById(id);const escapeHtml=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){questions=shuffle(QUESTIONS).map(q=>({...q,options:shuffle(q.options)}));answers={};finished=false;$('result').classList.add('hidden');$('retry').classList.add('hidden');$('quiz').classList.remove('hidden');$('quiz').querySelector('.bottom').classList.remove('hidden');$('questions').innerHTML=questions.map((q,i)=>`<section class="question" id="${q.id}"><span class="number">QUESTION ${String(i+1).padStart(2,'0')} / 50</span><h2>${escapeHtml(q.stem)}</h2>${q.options.map((o,j)=>`<label><input type="radio" name="${q.id}" value="${o.id}"><span>${String.fromCharCode(65+j)}. ${escapeHtml(o.text)}</span></label>`).join('')}<div class="feedback"></div></section>`).join('');update()}
function update(){$('count').textContent=`已作答 ${Object.keys(answers).length} / 50 題`;$('progress').value=Object.keys(answers).length}
$('quiz').addEventListener('change',e=>{if(!finished&&e.target.type==='radio'){answers[e.target.name]=e.target.value;update()}});
$('quiz').addEventListener('submit',e=>{e.preventDefault();if(finished)return;const missing=50-Object.keys(answers).length;if(missing&&!confirm(`還有 ${missing} 題未作答，未答題以 0 分計算。確定完成？`))return;finished=true;let right=0;for(const q of questions){const section=$(q.id);const ok=answers[q.id]===q.correct;if(ok)right++;for(const input of section.querySelectorAll('input')){input.disabled=true;if(input.value===q.correct)input.closest('label').classList.add('correct');else if(input.checked)input.closest('label').classList.add('wrong')}section.querySelector('.feedback').textContent=ok?'答對了！':`${answers[q.id]?'本題答錯':'本題未作答'}。正確答案：${q.options.find(o=>o.id===q.correct).text}`}$('result').innerHTML=`<span>本次練習得分</span><strong>${right*2}<small style="font-size:22px"> 分</small></strong><p>答對 ${right} 題 · 答錯 ${50-right-missing} 題 · 未答 ${missing} 題</p><p>往下查看每題答案，或重新練習一次。</p>`;$('result').classList.remove('hidden');$('quiz').querySelector('.bottom').classList.add('hidden');$('retry').classList.remove('hidden');$('result').scrollIntoView({behavior:'smooth'});$('result').focus({preventScroll:true})});
$('retry').onclick=()=>{render();window.scrollTo({top:0,behavior:'smooth'})};render();
</script></body></html>
