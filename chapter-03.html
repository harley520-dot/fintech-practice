<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第3章｜市場資訊供應：大數據與新市場平台練習</title><style>

mg{max-width:250px;width:100%}.share-url{overflow-wrap:anywhere;font-size:12px;max-width:300px}.badge{display:inline-block;background:#edf5da;color:#42664f;padding:5px 10px;border-radius:30px;font-size:12px}@media(max-width:480px){.question{padding:18px}label{padding:12px}.toolbar{font-size:13px}button{padding:11px 13px}}
header{display:flex;justify-content:space-between;align-items:center;gap:24px}.teacher-credit{text-align:right;flex-shrink:0;line-height:1.9}.teacher-credit strong{display:block;color:#d7ed8a;font-size:20px}.teacher-credit span{font-size:17px}@media(max-width:650px){header{flex-wrap:wrap;gap:8px}.teacher-credit{margin-left:auto}.teacher-credit strong{font-size:18px}.teacher-credit span{font-size:15px}}
</style></head><body><header><div><small>FINTECH PRACTICE · CHAPTER 03</small><h1>市場資訊供應：大數據與新市場平台</h1><p>50 題單選 · 每題 2 分 · 滿分 100 分<br>依自己的步調練習，完成後立即查看得分與正確答案。</p></div><div class="teacher-credit"><strong>數位金融服務</strong><span>楊智宇老師</span></div></header><main><div class="toolbar"><span id="count" aria-live="polite">已作答 0 / 50 題</span></div><progress id="progress" max="50" value="0" aria-label="作答進度"></progress><section id="result" class="result hidden" tabindex="-1"></section><form id="quiz"><div id="questions"></div><div class="bottom"><button class="primary" type="submit">完成作答，查看得分</button><p class="note">無須登入。姓名、學號及成績不會上傳。<br>題目與選項每次練習會重新排列。</p></div></form><button id="retry" class="primary hidden" style="width:100%">重新練習</button></main><script>const QUESTIONS=[{"id":"c3q1","stem":"銀行每天新增數億筆交易紀錄，這首先凸顯大數據哪項特徵？","options":[{"id":"a","text":"大量性 Volume"},{"id":"b","text":"多樣性 Variety"},{"id":"c","text":"真實性 Veracity"},{"id":"d","text":"時效性 Velocity"}],"correct":"a","difficulty":"easy"},{"id":"c3q2","stem":"同一分析同時使用帳務表格、錄音與影像，主要呈現哪項特徵？","options":[{"id":"b","text":"大量性 Volume"},{"id":"c","text":"時效性 Velocity"},{"id":"d","text":"資料完全可信"},{"id":"a","text":"多樣性 Variety"}],"correct":"a","difficulty":"easy"},{"id":"c3q3","stem":"詐欺監控要求資料到達後立即分析，最直接對應哪個 V？","options":[{"id":"c","text":"Variety"},{"id":"d","text":"Veracity"},{"id":"a","text":"Velocity"},{"id":"b","text":"Volume"}],"correct":"a","difficulty":"easy"},{"id":"c3q4","stem":"新聞來源可能造假，分析前需評估可信度，這是哪個 V 的議題？","options":[{"id":"d","text":"Variety"},{"id":"a","text":"Veracity"},{"id":"b","text":"Velocity"},{"id":"c","text":"Volume"}],"correct":"a","difficulty":"easy"},{"id":"c3q5","stem":"收集資料最後要改善決策或服務，這最接近哪個延伸的 V？","options":[{"id":"a","text":"Value"},{"id":"b","text":"Volume"},{"id":"c","text":"Velocity"},{"id":"d","text":"Variety"}],"correct":"a","difficulty":"easy"},{"id":"c3q6","stem":"每筆交易皆具有固定的日期、金額與帳號欄位，最接近哪種資料？","options":[{"id":"b","text":"非結構化資料"},{"id":"c","text":"純影像資料"},{"id":"d","text":"無格式音訊"},{"id":"a","text":"結構化資料"}],"correct":"a","difficulty":"easy"},{"id":"c3q7","stem":"客服通話的原始錄音，在尚未轉錄前較適合歸為哪類？","options":[{"id":"c","text":"關聯式主鍵"},{"id":"d","text":"標準金額欄位"},{"id":"a","text":"非結構化資料"},{"id":"b","text":"固定欄位帳務表"}],"correct":"a","difficulty":"easy"},{"id":"c3q8","stem":"含鍵值與巢狀物件的 JSON 訊息，最典型屬於哪類資料？","options":[{"id":"d","text":"沒有結構的文字流"},{"id":"a","text":"半結構化資料"},{"id":"b","text":"單純影像資料"},{"id":"c","text":"純語音訊號"}],"correct":"a","difficulty":"easy"},{"id":"c3q9","stem":"分析專案開始時，首先應確定什麼？","options":[{"id":"a","text":"要解決的業務問題"},{"id":"b","text":"最後簡報的配色"},{"id":"c","text":"要採購最多的硬碟"},{"id":"d","text":"先選最複雜的模型"}],"correct":"a","difficulty":"easy"},{"id":"c3q10","stem":"同一客戶被重複登錄多次，進入建模前應先做什麼？","options":[{"id":"b","text":"把所有重複視為新客戶"},{"id":"c","text":"直接放大樣本數"},{"id":"d","text":"隨機改寫學號"},{"id":"a","text":"辨識並處理重複紀錄"}],"correct":"a","difficulty":"easy"},{"id":"c3q11","stem":"不同單位分別以元與千元記錄金額，直接合併會造成哪種問題？","options":[{"id":"c","text":"交易相對方不足"},{"id":"d","text":"資料量必然太少"},{"id":"a","text":"單位不一致"},{"id":"b","text":"語音辨識失敗"}],"correct":"a","difficulty":"medium"},{"id":"c3q12","stem":"一份檔案用民國年，另一份用西元年。合理的清理方式為何？","options":[{"id":"d","text":"把年份當作交易金額"},{"id":"a","text":"轉換成一致日期標準並保留轉換規則"},{"id":"b","text":"直接比較字串大小"},{"id":"c","text":"刪除所有日期欄"}],"correct":"a","difficulty":"medium"},{"id":"c3q13","stem":"客戶年齡欄出現 650 歲，最適合先如何處理？","options":[{"id":"a","text":"核對來源與合理範圍再決定修正方式"},{"id":"b","text":"直接認定高齡客戶有高價值"},{"id":"c","text":"把所有年齡除以十"},{"id":"d","text":"忽略所有異常值"}],"correct":"a","difficulty":"medium"},{"id":"c3q14","stem":"收入欄有空值，分析人員最應避免哪種做法？","options":[{"id":"b","text":"檢查遺漏發生機制"},{"id":"c","text":"記錄補值方法"},{"id":"d","text":"比較不同處理的影響"},{"id":"a","text":"未評估原因就把空值一律當成零收入"}],"correct":"a","difficulty":"medium"},{"id":"c3q15","stem":"計算全體分行去年營收的平均數，主要屬於哪種統計？","options":[{"id":"c","text":"加密驗證"},{"id":"d","text":"資料匿名化"},{"id":"a","text":"敘述統計"},{"id":"b","text":"推論統計"}],"correct":"a","difficulty":"medium"},{"id":"c3q16","stem":"抽取部分客戶估計全體滿意度，主要涉及哪種統計思維？","options":[{"id":"d","text":"不考慮抽樣誤差"},{"id":"a","text":"由樣本推估母體"},{"id":"b","text":"只描述已觀察到的全部母體"},{"id":"c","text":"把所有差異視為因果"}],"correct":"a","difficulty":"medium"},{"id":"c3q17","stem":"分析報告指出客戶流失風險後，下一步怎樣才較能創造價值？","options":[{"id":"a","text":"規劃適當關懷行動並追蹤成效"},{"id":"b","text":"只增加圖表數量"},{"id":"c","text":"刪除原先定義的目標"},{"id":"d","text":"把預測當作確定結果"}],"correct":"a","difficulty":"medium"},{"id":"c3q18","stem":"為同一位客戶串起分行、App 與客服紀錄，主要支援哪項目標？","options":[{"id":"b","text":"增加重複客戶數"},{"id":"c","text":"停止跨部門合作"},{"id":"d","text":"把每次接觸視為不同人"},{"id":"a","text":"建立跨接點的客戶理解"}],"correct":"a","difficulty":"medium"},{"id":"c3q19","stem":"依客戶互動與交易習慣形成群組，主要用途是什麼？","options":[{"id":"c","text":"取消所有適合度評估"},{"id":"d","text":"只依姓名排序"},{"id":"a","text":"提供較適合不同需求的服務"},{"id":"b","text":"證明同群每個人都完全相同"}],"correct":"a","difficulty":"medium"},{"id":"c3q20","stem":"財務與風險資料一起呈現在管理儀表板，主要幫助什麼？","options":[{"id":"d","text":"取代所有管理判斷"},{"id":"a","text":"綜合觀察經營表現與風險暴露"},{"id":"b","text":"保證營收永遠上升"},{"id":"c","text":"把風險數值全部歸零"}],"correct":"a","difficulty":"medium"},{"id":"c3q21","stem":"比較分行服務表現時，資料分析可用來做什麼？","options":[{"id":"a","text":"找出差異並支援改善措施"},{"id":"b","text":"直接保證每家分行同樣獲利"},{"id":"c","text":"忽略業務規模差異"},{"id":"d","text":"只比較報表檔案大小"}],"correct":"a","difficulty":"medium"},{"id":"c3q22","stem":"資料散在不同系統且代碼不一致，最直接阻礙什麼？","options":[{"id":"b","text":"加密貨幣挖礦"},{"id":"c","text":"設備的實體供電"},{"id":"d","text":"網站配色更新"},{"id":"a","text":"跨部門整合分析"}],"correct":"a","difficulty":"medium"},{"id":"c3q23","stem":"描述資料來源、欄位定義與更新時間的文件，主要能改善什麼？","options":[{"id":"c","text":"讓所有資料可永久公開"},{"id":"d","text":"消除所有抽樣限制"},{"id":"a","text":"使用者對資料的理解與整合"},{"id":"b","text":"保證模型絕對正確"}],"correct":"a","difficulty":"medium"},{"id":"c3q24","stem":"使用外部網站資料前，較合理的作法為何？","options":[{"id":"d","text":"移除來源標記即可使用"},{"id":"a","text":"確認可使用範圍、存取規則與資料品質"},{"id":"b","text":"只要能下載就可任意利用"},{"id":"c","text":"把 robots 設定當作所有法律授權"}],"correct":"a","difficulty":"medium"},{"id":"c3q25","stem":"將姓名移除，但仍留下可拼湊身分的細緻行為資料，應如何看待？","options":[{"id":"a","text":"仍須評估重新識別風險"},{"id":"b","text":"已保證任何人無法辨識"},{"id":"c","text":"必然成為公開資料"},{"id":"d","text":"不再需要任何存取控制"}],"correct":"a","difficulty":"medium"},{"id":"c3q26","stem":"跨公司分享分析資料時，哪項控制較合理？","options":[{"id":"b","text":"提供全部資料給所有員工"},{"id":"c","text":"以檔案名稱代替授權"},{"id":"d","text":"只在簡報中提醒保密"},{"id":"a","text":"限制用途、欄位與可存取人員"}],"correct":"a","difficulty":"medium"},{"id":"c3q27","stem":"不同客群原本接觸數位服務的機會不同，解讀 App 使用量時要注意什麼？","options":[{"id":"c","text":"使用量與環境無關"},{"id":"d","text":"所有客群應直接視為同質"},{"id":"a","text":"資料可能反映接觸機會差異"},{"id":"b","text":"低使用量必然代表沒有需求"}],"correct":"a","difficulty":"medium"},{"id":"c3q28","stem":"新市場平台整理分散的報價與交易需求，主要降低哪種成本？","options":[{"id":"d","text":"所有市場監理成本"},{"id":"a","text":"尋找資訊與交易對手的成本"},{"id":"b","text":"所有投資虧損"},{"id":"c","text":"所有資金占用"}],"correct":"a","difficulty":"medium"},{"id":"c3q29","stem":"平台把不同格式的債券報價轉成一致欄位，主要呈現哪項特色？","options":[{"id":"a","text":"標準化"},{"id":"b","text":"社群化"},{"id":"c","text":"匿名化"},{"id":"d","text":"代幣化"}],"correct":"a","difficulty":"medium"},{"id":"c3q30","stem":"平台自動蒐集資訊並推薦可能交易對手，主要呈現哪項特色？","options":[{"id":"b","text":"人工逐筆傳真"},{"id":"c","text":"資料完全不共享"},{"id":"d","text":"單一報價壟斷"},{"id":"a","text":"自動化"}],"correct":"a","difficulty":"medium"},{"id":"c3q31","stem":"交易參與者可建立互動與信任關係，最接近哪項平台特色？","options":[{"id":"c","text":"資料實體化"},{"id":"d","text":"離線化"},{"id":"a","text":"社群化"},{"id":"b","text":"硬體虛擬化"}],"correct":"a","difficulty":"medium"},{"id":"c3q32","stem":"買方更容易找到賣方，通常有助於改善什麼？","options":[{"id":"d","text":"貨幣供給總量"},{"id":"a","text":"市場流動性"},{"id":"b","text":"商品的保證報酬"},{"id":"c","text":"所有契約的法律效力"}],"correct":"a","difficulty":"medium"},{"id":"c3q33","stem":"市場報價由少數人掌握，平台提高揭露後可能帶來什麼？","options":[{"id":"a","text":"降低資訊不對稱"},{"id":"b","text":"保證所有價格相同"},{"id":"c","text":"消除所有市場波動"},{"id":"d","text":"讓交易不再需要估價"}],"correct":"a","difficulty":"medium"},{"id":"c3q34","stem":"小型機構透過平台找到原本接觸不到的交易者，主要獲得什麼？","options":[{"id":"b","text":"自動免除信用風險"},{"id":"c","text":"無限的資本額"},{"id":"d","text":"所有投資都可保本"},{"id":"a","text":"更多市場參與機會"}],"correct":"a","difficulty":"medium"},{"id":"c3q35","stem":"大型業者共同建平台但限制外部機構加入，可能產生什麼？","options":[{"id":"c","text":"所有資訊成本歸零"},{"id":"d","text":"所有中介都消失"},{"id":"a","text":"新的市場進入門檻"},{"id":"b","text":"必然完全開放的競爭"}],"correct":"a","difficulty":"medium"},{"id":"c3q36","stem":"平台協助整理投資組合資料，主要支援哪種工作？","options":[{"id":"d","text":"讓所有資產等值"},{"id":"a","text":"比較持倉與評估投資表現"},{"id":"b","text":"直接保證未來價格"},{"id":"c","text":"取代投資人的風險承擔"}],"correct":"a","difficulty":"medium"},{"id":"c3q37","stem":"另類投資平台簡化參與流程，投資人仍需注意什麼？","options":[{"id":"a","text":"商品風險、流動性與資訊品質"},{"id":"b","text":"程序簡化就代表保本"},{"id":"c","text":"低門檻就沒有損失"},{"id":"d","text":"平台存在即保證收益"}],"correct":"a","difficulty":"medium"},{"id":"c3q38","stem":"資訊媒合平台與共享經濟較明確的共同點是什麼？","options":[{"id":"b","text":"都必須轉移資產所有權"},{"id":"c","text":"都不需要任何治理"},{"id":"d","text":"都必須免費營運"},{"id":"a","text":"透過資訊連結提高資源配置效率"}],"correct":"a","difficulty":"medium"},{"id":"c3q39","stem":"金融中介可從資料分析平台獲得何種新角色？","options":[{"id":"c","text":"只保管紙本報價"},{"id":"d","text":"保證所有客戶選擇一致"},{"id":"a","text":"提供解讀與顧問服務"},{"id":"b","text":"完全免除專業判斷"}],"correct":"a","difficulty":"medium"},{"id":"c3q40","stem":"把文字新聞轉成可供模型使用的主題與情緒指標，主要在做什麼？","options":[{"id":"d","text":"完全避免資料清理"},{"id":"a","text":"將非結構化內容轉為可分析特徵"},{"id":"b","text":"把所有內容轉成法律事實"},{"id":"c","text":"直接增加新聞真實性"}],"correct":"a","difficulty":"medium"},{"id":"c3q41","stem":"某模型用「交易發生後才產生的調查結果」預測交易是否可疑，測試極準。優先應檢查什麼？","options":[{"id":"a","text":"是否發生未來資訊洩漏"},{"id":"b","text":"是否買到最昂貴的伺服器"},{"id":"c","text":"圖表顏色是否太單調"},{"id":"d","text":"模型名稱是否夠新"}],"correct":"a","difficulty":"hard"},{"id":"c3q42","stem":"平台交易筆數增加，卻大多來自少數關係戶互相成交。該如何解讀流動性？","options":[{"id":"b","text":"筆數增加就足以證明流動性改善"},{"id":"c","text":"有紀錄就一定是獨立需求"},{"id":"d","text":"只看最大一筆金額即可"},{"id":"a","text":"須評估交易真實性與參與者結構"}],"correct":"a","difficulty":"hard"},{"id":"c3q43","stem":"客服紀錄顯示高齡客戶抱怨較少，可否直接認定其滿意度較高？","options":[{"id":"c","text":"任何差異都一定由年齡造成"},{"id":"d","text":"無須比較客群規模"},{"id":"a","text":"應先檢查是否存在申訴管道與樣本偏差"},{"id":"b","text":"抱怨筆數已完整代表滿意度"}],"correct":"a","difficulty":"hard"},{"id":"c3q44","stem":"兩地區資料規格相同，但「活躍客戶」的定義不同，合併分析應怎麼做？","options":[{"id":"d","text":"讓模型自行忽略所有差異"},{"id":"a","text":"先統一業務定義再比較"},{"id":"b","text":"格式相同就可直接比較"},{"id":"c","text":"只需改成相同檔名"}],"correct":"a","difficulty":"hard"},{"id":"c3q45","stem":"觀察到使用新功能的客戶流失較少，為何仍不能直接歸因於新功能？","options":[{"id":"a","text":"可能有客戶原本特性等混雜因素"},{"id":"b","text":"統計關聯一定代表反向因果"},{"id":"c","text":"只要樣本多就一定有因果"},{"id":"d","text":"數位行為不能用於分析"}],"correct":"a","difficulty":"hard"},{"id":"c3q46","stem":"模型在整體資料表現良好，卻頻繁誤判小客群。評估應如何調整？","options":[{"id":"b","text":"只保留整體平均表現"},{"id":"c","text":"移除小客群的評估結果"},{"id":"d","text":"用更多小數位數呈現準確率"},{"id":"a","text":"分群檢視錯誤與服務影響"}],"correct":"a","difficulty":"hard"},{"id":"c3q47","stem":"標準化報價只保留價格，刪除到期日與信用條件，會造成什麼問題？","options":[{"id":"c","text":"價格足以代表所有風險"},{"id":"d","text":"所有金融商品因此同質化"},{"id":"a","text":"不同商品可能被錯當成可直接比較"},{"id":"b","text":"欄位越少就一定越準確"}],"correct":"a","difficulty":"hard"},{"id":"c3q48","stem":"企業已建資料湖卻無法提出有效分析，下一步最值得優先釐清什麼？","options":[{"id":"d","text":"先隨機採購另一套模型"},{"id":"a","text":"業務問題、資料責任與可用性"},{"id":"b","text":"只擴充儲存容量"},{"id":"c","text":"只增加資料筆數"}],"correct":"a","difficulty":"hard"},{"id":"c3q49","stem":"清理資料時把所有極大交易刪除，可能造成什麼後果？","options":[{"id":"a","text":"遺失真正重要的風險事件"},{"id":"b","text":"必然消除全部錯誤"},{"id":"c","text":"必然提升風險辨識"},{"id":"d","text":"不會影響任何統計結果"}],"correct":"a","difficulty":"hard"},{"id":"c3q50","stem":"平台提升透明度但撮合品質仍差，哪種改善較有針對性？","options":[{"id":"b","text":"只增加網站流量"},{"id":"c","text":"把價格小數位數減少"},{"id":"d","text":"停止記錄未成交需求"},{"id":"a","text":"納入交易需求與商品條件重新評估媒合規則"}],"correct":"a","difficulty":"hard"}];</script><script>
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=crypto.getRandomValues(new Uint32Array(1))[0]%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
let questions=[],answers={},finished=false;const $=id=>document.getElementById(id);const escapeHtml=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){questions=shuffle(QUESTIONS).map(q=>({...q,options:shuffle(q.options)}));answers={};finished=false;$('result').classList.add('hidden');$('retry').classList.add('hidden');$('quiz').classList.remove('hidden');$('quiz').querySelector('.bottom').classList.remove('hidden');$('questions').innerHTML=questions.map((q,i)=>`<section class="question" id="${q.id}"><span class="number">QUESTION ${String(i+1).padStart(2,'0')} / 50</span><h2>${escapeHtml(q.stem)}</h2>${q.options.map((o,j)=>`<label><input type="radio" name="${q.id}" value="${o.id}"><span>${String.fromCharCode(65+j)}. ${escapeHtml(o.text)}</span></label>`).join('')}<div class="feedback"></div></section>`).join('');update()}
function update(){$('count').textContent=`已作答 ${Object.keys(answers).length} / 50 題`;$('progress').value=Object.keys(answers).length}
$('quiz').addEventListener('change',e=>{if(!finished&&e.target.type==='radio'){answers[e.target.name]=e.target.value;update()}});
$('quiz').addEventListener('submit',e=>{e.preventDefault();if(finished)return;const missing=50-Object.keys(answers).length;if(missing&&!confirm(`還有 ${missing} 題未作答，未答題以 0 分計算。確定完成？`))return;finished=true;let right=0;for(const q of questions){const section=$(q.id);const ok=answers[q.id]===q.correct;if(ok)right++;for(const input of section.querySelectorAll('input')){input.disabled=true;if(input.value===q.correct)input.closest('label').classList.add('correct');else if(input.checked)input.closest('label').classList.add('wrong')}section.querySelector('.feedback').textContent=ok?'答對了！':`${answers[q.id]?'本題答錯':'本題未作答'}。正確答案：${q.options.find(o=>o.id===q.correct).text}`}$('result').innerHTML=`<span>本次練習得分</span><strong>${right*2}<small style="font-size:22px"> 分</small></strong><p>答對 ${right} 題 · 答錯 ${50-right-missing} 題 · 未答 ${missing} 題</p><p>往下查看每題答案，或重新練習一次。</p>`;$('result').classList.remove('hidden');$('quiz').querySelector('.bottom').classList.add('hidden');$('retry').classList.remove('hidden');$('result').scrollIntoView({behavior:'smooth'});$('result').focus({preventScroll:true})});
$('retry').onclick=()=>{render();window.scrollTo({top:0,behavior:'smooth'})};render();
</script></body></html>
