<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第10章｜募資練習</title><style>

mg{max-width:250px;width:100%}.share-url{overflow-wrap:anywhere;font-size:12px;max-width:300px}.badge{display:inline-block;background:#edf5da;color:#42664f;padding:5px 10px;border-radius:30px;font-size:12px}@media(max-width:480px){.question{padding:18px}label{padding:12px}.toolbar{font-size:13px}button{padding:11px 13px}}
header{display:flex;justify-content:space-between;align-items:center;gap:24px}.teacher-credit{text-align:right;flex-shrink:0;line-height:1.9}.teacher-credit strong{display:block;color:#d7ed8a;font-size:20px}.teacher-credit span{font-size:17px}@media(max-width:650px){header{flex-wrap:wrap;gap:8px}.teacher-credit{margin-left:auto}.teacher-credit strong{font-size:18px}.teacher-credit span{font-size:15px}}
</style></head><body><header><div><small>FINTECH PRACTICE · CHAPTER 10</small><h1>募資</h1><p>50 題單選 · 每題 2 分 · 滿分 100 分<br>依自己的步調練習，完成後立即查看得分與正確答案。</p></div><div class="teacher-credit"><strong>數位金融服務</strong><span>楊智宇老師</span></div></header><main><div class="toolbar"><span id="count" aria-live="polite">已作答 0 / 50 題</span></div><progress id="progress" max="50" value="0" aria-label="作答進度"></progress><section id="result" class="result hidden" tabindex="-1"></section><form id="quiz"><div id="questions"></div><div class="bottom"><button class="primary" type="submit">完成作答，查看得分</button><p class="note">無須登入。姓名、學號及成績不會上傳。<br>題目與選項每次練習會重新排列。</p></div></form><button id="retry" class="primary hidden" style="width:100%">重新練習</button></main><script>const QUESTIONS=[{"id":"c10q1","stem":"新團隊把研發計畫放上平台，向許多支持者募集小額資金，屬於什麼？","options":[{"id":"a","text":"群眾募資"},{"id":"b","text":"銀行清算"},{"id":"c","text":"保單核保"},{"id":"d","text":"外匯結算"}],"correct":"a","difficulty":"easy"},{"id":"c10q2","stem":"出資支持公益計畫而不要求產品或財務回報，屬於哪類？","options":[{"id":"b","text":"回饋型"},{"id":"c","text":"股權型"},{"id":"d","text":"債權型"},{"id":"a","text":"捐贈型"}],"correct":"a","difficulty":"easy"},{"id":"c10q3","stem":"支持者付款後預計收到新設計產品，最接近哪類募資？","options":[{"id":"c","text":"股權型"},{"id":"d","text":"債權型"},{"id":"a","text":"回饋型"},{"id":"b","text":"捐贈型"}],"correct":"a","difficulty":"easy"},{"id":"c10q4","stem":"出資後取得公司股份，最接近哪類募資？","options":[{"id":"d","text":"單純預購"},{"id":"a","text":"股權型"},{"id":"b","text":"回饋型"},{"id":"c","text":"捐贈型"}],"correct":"a","difficulty":"easy"},{"id":"c10q5","stem":"出資者依約取得本金與利息請求權，較接近哪類？","options":[{"id":"a","text":"債權型"},{"id":"b","text":"股權型"},{"id":"c","text":"捐贈型"},{"id":"d","text":"產品回饋型"}],"correct":"a","difficulty":"easy"},{"id":"c10q6","stem":"公司尚在早期研發、收入有限，對傳統銀行融資可能有何限制？","options":[{"id":"b","text":"必然可取得最低利率"},{"id":"c","text":"完全不需要任何資金"},{"id":"d","text":"所有貸款都由平台保證"},{"id":"a","text":"難以提供穩定現金流與信用證明"}],"correct":"a","difficulty":"easy"},{"id":"c10q7","stem":"天使投資人主要扮演什麼角色？","options":[{"id":"c","text":"只負責貨幣發行"},{"id":"d","text":"只提供付款條碼"},{"id":"a","text":"為早期事業提供資金並可能提供經驗"},{"id":"b","text":"只處理存款保險"}],"correct":"a","difficulty":"easy"},{"id":"c10q8","stem":"募集金額未達門檻就不執行資金撥付，屬於什麼安排？","options":[{"id":"d","text":"自動保本"},{"id":"a","text":"全有或全無"},{"id":"b","text":"募多少取多少"},{"id":"c","text":"固定存款"}],"correct":"a","difficulty":"easy"},{"id":"c10q9","stem":"未達募資目標仍可取得所募資金，較接近什麼安排？","options":[{"id":"a","text":"募多少取多少"},{"id":"b","text":"全有或全無"},{"id":"c","text":"存款準備"},{"id":"d","text":"交易再平衡"}],"correct":"a","difficulty":"easy"},{"id":"c10q10","stem":"新一輪增資後，原股東持股比例下降，這稱為什麼？","options":[{"id":"b","text":"流動性增加"},{"id":"c","text":"保證收益"},{"id":"d","text":"資金隔離"},{"id":"a","text":"股權稀釋"}],"correct":"a","difficulty":"easy"},{"id":"c10q11","stem":"平台讓創作者直接向消費者介紹提案，主要增加什麼？","options":[{"id":"c","text":"所有投資的可贖回性"},{"id":"d","text":"政府對商品的保證"},{"id":"a","text":"籌資與市場互動管道"},{"id":"b","text":"所有提案成功機率至百分之百"}],"correct":"a","difficulty":"medium"},{"id":"c10q12","stem":"產品募資收到大量支持，也可提供哪種訊息？","options":[{"id":"d","text":"代表已取得全部許可"},{"id":"a","text":"市場需求的初步回饋"},{"id":"b","text":"量產必然沒有問題"},{"id":"c","text":"保證長期獲利"}],"correct":"a","difficulty":"medium"},{"id":"c10q13","stem":"回饋型支持者與股權型投資人的主要差異是什麼？","options":[{"id":"a","text":"取得的產品回饋與所有權權利不同"},{"id":"b","text":"兩者都必然成為公司股東"},{"id":"c","text":"兩者都必然有利息"},{"id":"d","text":"兩者均無任何權利"}],"correct":"a","difficulty":"medium"},{"id":"c10q14","stem":"債權與股權的報酬來源通常有何差異？","options":[{"id":"b","text":"股權必然固定付息"},{"id":"c","text":"債權必然取得表決權"},{"id":"d","text":"兩者都只取得紀念品"},{"id":"a","text":"前者依契約收本息，後者與公司價值或分配有關"}],"correct":"a","difficulty":"medium"},{"id":"c10q15","stem":"回饋型計畫未交付商品，支持者應先確認什麼？","options":[{"id":"c","text":"只要達標就不能追問"},{"id":"d","text":"所有責任都由其他支持者承擔"},{"id":"a","text":"平台與提案的履約、退款及爭議規則"},{"id":"b","text":"只看宣傳影片點閱數"}],"correct":"a","difficulty":"medium"},{"id":"c10q16","stem":"全有或全無機制主要可降低哪種執行問題？","options":[{"id":"d","text":"全部產品瑕疵"},{"id":"a","text":"資金未達基本需求卻仍啟動專案"},{"id":"b","text":"所有設計錯誤"},{"id":"c","text":"全部詐欺事件"}],"correct":"a","difficulty":"medium"},{"id":"c10q17","stem":"募多少取多少的提案，最需要交代什麼？","options":[{"id":"a","text":"不同資金規模下如何完成承諾"},{"id":"b","text":"未達標時保證內容不變且無須說明"},{"id":"c","text":"只公布最高理想預算"},{"id":"d","text":"只顯示支持者暱稱"}],"correct":"a","difficulty":"medium"},{"id":"c10q18","stem":"提案團隊設定超低目標卻需要高額量產資金，應如何評估？","options":[{"id":"b","text":"達標百分比高即證明穩健"},{"id":"c","text":"金額越低就一定越安全"},{"id":"d","text":"所有差額都由平台補足"},{"id":"a","text":"檢查目標與實際成本是否相符"}],"correct":"a","difficulty":"medium"},{"id":"c10q19","stem":"產品募資較接近預購時，支持者仍需注意什麼？","options":[{"id":"c","text":"付款即代表立即出貨"},{"id":"d","text":"不需查看交付時程"},{"id":"a","text":"研發、量產與交付不確定性"},{"id":"b","text":"所有商品都已入庫"}],"correct":"a","difficulty":"medium"},{"id":"c10q20","stem":"募資頁面列出材料、製造與運送預算，主要提升什麼？","options":[{"id":"d","text":"取消所有履約義務"},{"id":"a","text":"資金用途透明度"},{"id":"b","text":"保證永不超支"},{"id":"c","text":"自動提高估值"}],"correct":"a","difficulty":"medium"},{"id":"c10q21","stem":"領投人帶領其他投資人共同參與，較接近什麼？","options":[{"id":"a","text":"聯合投資"},{"id":"b","text":"單純捐贈"},{"id":"c","text":"固定存款"},{"id":"d","text":"信用卡分期"}],"correct":"a","difficulty":"medium"},{"id":"c10q22","stem":"跟投人依賴領投人判斷，仍應確認什麼？","options":[{"id":"b","text":"領投人保證零損失"},{"id":"c","text":"所有決策都不需理解"},{"id":"d","text":"只看領投人粉絲數"},{"id":"a","text":"利益安排、資訊與風險"}],"correct":"a","difficulty":"medium"},{"id":"c10q23","stem":"以基金形式投資多家新創，主要可能改善什麼？","options":[{"id":"c","text":"所有流動性限制"},{"id":"d","text":"全部管理費用"},{"id":"a","text":"單一企業風險集中"},{"id":"b","text":"所有市場風險"}],"correct":"a","difficulty":"medium"},{"id":"c10q24","stem":"公司自行提出跟投計畫，已取得的投資承諾應如何處理？","options":[{"id":"d","text":"用追蹤數取代承諾"},{"id":"a","text":"確認條件與有效性並適當揭露"},{"id":"b","text":"把口頭興趣視為已收到資金"},{"id":"c","text":"隱藏附帶條件"}],"correct":"a","difficulty":"medium"},{"id":"c10q25","stem":"大型企業也參與產品募資，可能希望達到什麼？","options":[{"id":"a","text":"測試需求與建立顧客參與"},{"id":"b","text":"證明企業一定缺乏銀行信用"},{"id":"c","text":"取消所有品牌責任"},{"id":"d","text":"直接取得央行授權"}],"correct":"a","difficulty":"medium"},{"id":"c10q26","stem":"早期公司缺少營運歷史，投資人主要面對什麼？","options":[{"id":"b","text":"一定較高且固定的報酬"},{"id":"c","text":"沒有任何經營風險"},{"id":"d","text":"與上市公司完全相同的資訊"},{"id":"a","text":"較高資訊不確定性"}],"correct":"a","difficulty":"medium"},{"id":"c10q27","stem":"投資早期非上市股權，退出時最需注意什麼？","options":[{"id":"c","text":"平台必須無限承接"},{"id":"d","text":"股份必然立即上市"},{"id":"a","text":"轉售市場有限與流動性"},{"id":"b","text":"隨時可按原價贖回"}],"correct":"a","difficulty":"medium"},{"id":"c10q28","stem":"募資揭露比成熟市場少，較可能產生什麼？","options":[{"id":"d","text":"公司價值必然明確"},{"id":"a","text":"資訊不對稱"},{"id":"b","text":"全部資訊完全可信"},{"id":"c","text":"投資人風險自然下降"}],"correct":"a","difficulty":"medium"},{"id":"c10q29","stem":"支持者很多，為何仍不能保證提案真實？","options":[{"id":"a","text":"群體關注不能取代資料查核"},{"id":"b","text":"人數足夠就不可能造假"},{"id":"c","text":"每位支持者都已完成審計"},{"id":"d","text":"達標自動代表政府認證"}],"correct":"a","difficulty":"medium"},{"id":"c10q30","stem":"股權型提案應先釐清哪些資訊？","options":[{"id":"b","text":"只有產品照片"},{"id":"c","text":"只有回饋品顏色"},{"id":"d","text":"只看出資按鈕"},{"id":"a","text":"估值、持股權利、資金用途與風險"}],"correct":"a","difficulty":"medium"},{"id":"c10q31","stem":"同樣出資 10 萬元，不同估值可能造成什麼？","options":[{"id":"c","text":"只影響網站流量"},{"id":"d","text":"與所有權完全無關"},{"id":"a","text":"取得的持股比例不同"},{"id":"b","text":"所有公司都給相同股份"}],"correct":"a","difficulty":"medium"},{"id":"c10q32","stem":"公司發行新股，舊股東未跟進，原有股份數不變時通常如何？","options":[{"id":"d","text":"舊股東表決比例必然不變"},{"id":"a","text":"總股數增加使持股比例下降"},{"id":"b","text":"原有股份必然增加"},{"id":"c","text":"公司債務必然歸零"}],"correct":"a","difficulty":"medium"},{"id":"c10q33","stem":"平台收費方式可能如何影響發起者？","options":[{"id":"a","text":"影響可實際投入專案的淨額"},{"id":"b","text":"完全不影響募資預算"},{"id":"c","text":"費率只能由支持者猜測"},{"id":"d","text":"平台費都由政府支付"}],"correct":"a","difficulty":"medium"},{"id":"c10q34","stem":"募資成功後定期公布進度，主要改善什麼？","options":[{"id":"b","text":"自動消除所有延誤"},{"id":"c","text":"讓團隊不需負責"},{"id":"d","text":"取消所有資金用途限制"},{"id":"a","text":"支持者對執行狀況的掌握"}],"correct":"a","difficulty":"medium"},{"id":"c10q35","stem":"提案使用第三方設計圖與品牌，較合理的做法是什麼？","options":[{"id":"c","text":"只要改顏色就沒有權利問題"},{"id":"d","text":"達標後再決定是否侵權"},{"id":"a","text":"確認授權與可用範圍"},{"id":"b","text":"放上平台即代表可自由用"}],"correct":"a","difficulty":"medium"},{"id":"c10q36","stem":"募資成為新創替代管道，對傳統中介可能有何影響？","options":[{"id":"d","text":"所有理財服務必然免費"},{"id":"a","text":"競爭增加並促使角色調整"},{"id":"b","text":"所有銀行業務立即消失"},{"id":"c","text":"所有企業不再需要信用"}],"correct":"a","difficulty":"medium"},{"id":"c10q37","stem":"投資人把部分資金改投新創募資，最應評估什麼？","options":[{"id":"a","text":"整體資產的風險、期限與流動性"},{"id":"b","text":"只看單一提案熱度"},{"id":"c","text":"忽略既有投資組合"},{"id":"d","text":"以支持人數代替風險承受度"}],"correct":"a","difficulty":"medium"},{"id":"c10q38","stem":"平台為降低詐欺風險，較適合做什麼？","options":[{"id":"b","text":"只設漂亮首頁"},{"id":"c","text":"全部提案自動通過"},{"id":"d","text":"不留下任何聯絡資料"},{"id":"a","text":"核實發起者與揭露資料並設處理流程"}],"correct":"a","difficulty":"medium"},{"id":"c10q39","stem":"募集跨國支持者時，應清楚說明什麼？","options":[{"id":"c","text":"只顯示本地售價"},{"id":"d","text":"忽略跨境退款安排"},{"id":"a","text":"交付地區、運費、幣別與相關限制"},{"id":"b","text":"假定每個國家規則相同"}],"correct":"a","difficulty":"medium"},{"id":"c10q40","stem":"評估群眾募資成效，哪組指標較完整？","options":[{"id":"d","text":"只看第一天支持金額"},{"id":"a","text":"募得淨額、履約率與支持者體驗"},{"id":"b","text":"只看達標倍數"},{"id":"c","text":"只看影片觀看數"}],"correct":"a","difficulty":"medium"},{"id":"c10q41","stem":"提案達標十倍，量產卻因供應能力不足延遲，主要說明什麼？","options":[{"id":"a","text":"需求成功仍需配合可擴充的交付能力"},{"id":"b","text":"募資越多一定越快交貨"},{"id":"c","text":"供應鏈與募資毫無關係"},{"id":"d","text":"超募會自動增加產能"}],"correct":"a","difficulty":"hard"},{"id":"c10q42","stem":"領投人向公司收取額外報酬卻未揭露，主要問題是什麼？","options":[{"id":"b","text":"持股比例自然稀釋"},{"id":"c","text":"產品外觀瑕疵"},{"id":"d","text":"頁面載入延遲"},{"id":"a","text":"潛在利益衝突"}],"correct":"a","difficulty":"hard"},{"id":"c10q43","stem":"某股權募資宣傳保證固定報酬，應優先確認什麼？","options":[{"id":"c","text":"把宣傳語當作法定保障"},{"id":"d","text":"只看出資人數"},{"id":"a","text":"實際權利、承諾來源與可履行性"},{"id":"b","text":"只看是否採新科技"}],"correct":"a","difficulty":"hard"},{"id":"c10q44","stem":"募資目標 100 萬元，平台與必要費用合計 10%，達標後實得多少？","options":[{"id":"d","text":"10 萬元"},{"id":"a","text":"90 萬元"},{"id":"b","text":"100 萬元"},{"id":"c","text":"110 萬元"}],"correct":"a","difficulty":"hard"},{"id":"c10q45","stem":"公司有 100 萬股，某投資人持 10 萬股；另發 25 萬股且該人未認購，其持股比率為何？","options":[{"id":"a","text":"8%"},{"id":"b","text":"10%"},{"id":"c","text":"12.5%"},{"id":"d","text":"25%"}],"correct":"a","difficulty":"hard"},{"id":"c10q46","stem":"募資頁將付款支持人都稱為股東，卻只承諾寄產品，應如何判斷？","options":[{"id":"b","text":"只要稱股東就一定有股份"},{"id":"c","text":"支持者多就自動取得表決權"},{"id":"d","text":"回饋商品就是公司股票"},{"id":"a","text":"依實際契約權利釐清而非只看稱呼"}],"correct":"a","difficulty":"hard"},{"id":"c10q47","stem":"基金投資許多新創但都同產業，投資人仍面臨什麼？","options":[{"id":"c","text":"無限流動性"},{"id":"d","text":"不存在的估值風險"},{"id":"a","text":"產業共同風險"},{"id":"b","text":"保證完全分散"}],"correct":"a","difficulty":"hard"},{"id":"c10q48","stem":"團隊把尚未收取的承諾金額列為現金，可能造成什麼？","options":[{"id":"d","text":"所有承諾必然無條件履行"},{"id":"a","text":"高估可動用資金與執行能力"},{"id":"b","text":"必然提高真實交付率"},{"id":"c","text":"可免除資金管理"}],"correct":"a","difficulty":"hard"},{"id":"c10q49","stem":"發起者新增大量回饋項目，卻未更新成本預算，最需要檢查什麼？","options":[{"id":"a","text":"新增義務是否超過資金與產能"},{"id":"b","text":"只看新增項目人氣"},{"id":"c","text":"達標後成本不再重要"},{"id":"d","text":"回饋越多毛利必然越高"}],"correct":"a","difficulty":"hard"},{"id":"c10q50","stem":"支持者可對專案留言，為何仍不能等同企業治理權？","options":[{"id":"b","text":"能留言就可任命董事"},{"id":"c","text":"支持金額少就不能享有任何契約權"},{"id":"d","text":"留言多就自動改變股權"},{"id":"a","text":"互動機制不必然賦予正式股東或管理權利"}],"correct":"a","difficulty":"hard"}];</script><script>
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=crypto.getRandomValues(new Uint32Array(1))[0]%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
let questions=[],answers={},finished=false;const $=id=>document.getElementById(id);const escapeHtml=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){questions=shuffle(QUESTIONS).map(q=>({...q,options:shuffle(q.options)}));answers={};finished=false;$('result').classList.add('hidden');$('retry').classList.add('hidden');$('quiz').classList.remove('hidden');$('quiz').querySelector('.bottom').classList.remove('hidden');$('questions').innerHTML=questions.map((q,i)=>`<section class="question" id="${q.id}"><span class="number">QUESTION ${String(i+1).padStart(2,'0')} / 50</span><h2>${escapeHtml(q.stem)}</h2>${q.options.map((o,j)=>`<label><input type="radio" name="${q.id}" value="${o.id}"><span>${String.fromCharCode(65+j)}. ${escapeHtml(o.text)}</span></label>`).join('')}<div class="feedback"></div></section>`).join('');update()}
function update(){$('count').textContent=`已作答 ${Object.keys(answers).length} / 50 題`;$('progress').value=Object.keys(answers).length}
$('quiz').addEventListener('change',e=>{if(!finished&&e.target.type==='radio'){answers[e.target.name]=e.target.value;update()}});
$('quiz').addEventListener('submit',e=>{e.preventDefault();if(finished)return;const missing=50-Object.keys(answers).length;if(missing&&!confirm(`還有 ${missing} 題未作答，未答題以 0 分計算。確定完成？`))return;finished=true;let right=0;for(const q of questions){const section=$(q.id);const ok=answers[q.id]===q.correct;if(ok)right++;for(const input of section.querySelectorAll('input')){input.disabled=true;if(input.value===q.correct)input.closest('label').classList.add('correct');else if(input.checked)input.closest('label').classList.add('wrong')}section.querySelector('.feedback').textContent=ok?'答對了！':`${answers[q.id]?'本題答錯':'本題未作答'}。正確答案：${q.options.find(o=>o.id===q.correct).text}`}$('result').innerHTML=`<span>本次練習得分</span><strong>${right*2}<small style="font-size:22px"> 分</small></strong><p>答對 ${right} 題 · 答錯 ${50-right-missing} 題 · 未答 ${missing} 題</p><p>往下查看每題答案，或重新練習一次。</p>`;$('result').classList.remove('hidden');$('quiz').querySelector('.bottom').classList.add('hidden');$('retry').classList.remove('hidden');$('result').scrollIntoView({behavior:'smooth'});$('result').focus({preventScroll:true})});
$('retry').onclick=()=>{render();window.scrollTo({top:0,behavior:'smooth'})};render();
</script></body></html>
