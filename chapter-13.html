:root{font-family:"Microsoft JhengHei",sans-serif;color:#173d32;background:#f5f4ed}*{box-sizing:border-box}body{margin:0}header{background:#173d32;color:#fff;padding:22px max(20px,calc((100vw - 850px)/2));}header small{color:#d7ed8a;letter-spacing:3px}h1{font-size:clamp(26px,5vw,40px);margin:12px 0}header p{color:#c7d7cf;line-height:1.7}main{max-width:850px;margin:auto;padding:24px 18px 60px}.toolbar{display:flex;justify-content:space-between;gap:15px;align-items:center;position:sticky;top:0;background:#f5f4edf5;padding:14px 0;z-index:2}button{font:inherit;cursor:pointer;border:1px solid #cdd9d0;background:white;color:#173d32;border-radius:12px;padding:12px 18px}button:focus-visible,input:focus-visible{outline:3px solid #9ebf36;outline-offset:3px}.primary{background:#173d32;color:white;border:0}.question{background:white;border-radius:20px;padding:24px;margin:18px 0;border:1px solid #e0e5dd}.question h2{font-size:19px;line-height:1.7;margin:10px 0 20px}.number{font-size:12px;font-weight:bold;color:#608070}label{display:flex;align-items:flex-start;gap:12px;padding:14px;border:1px solid #e0e5dd;border-radius:12px;margin:10px 0;cursor:pointer;line-height:1.6}label:has(input:checked){background:#edf5da;border-color:#779a45}input{accent-color:#286247;margin-top:5px;flex-shrink:0}.correct{background:#e6f3e8!important;border-color:#58a16a!important}.wrong{background:#fce9e5!important;border-color:#c66b5e!important}.feedback{color:#42664f;font-size:14px;line-height:1.8}.bottom{display:grid;gap:15px;text-align:center}.bottom button{padding:18px}.note{color:#6c7e72;font-size:13px;line-height:1.7}.result{background:#173d32;color:white;border-radius:24px;padding:32px;text-align:center;margin:20px 0}.result strong{display:block;font-size:70px;color:#d7ed8a}.result p{line-height:1.8}.hidden{display:none}progress{width:100%;height:7px;accent-color:#6e982d}dialog{border:0;border-radius:20px;max-width:90vw;padding:26px;text-align:center}dialog::backdrop{background:#173d3299}dialog img{max-width:250px;width:100%}.share-url{overflow-wrap:anywhere;font-size:12px;max-width:300px}.badge{display:inline-block;background:#edf5da;color:#42664f;padding:5px 10px;border-radius:30px;font-size:12px}@media(max-width:480px){.question{padding:18px}label{padding:12px}.toolbar{font-size:13px}button{padding:11px 13px}}
header{display:flex;justify-content:space-between;align-items:center;gap:24px}.teacher-credit{text-align:right;flex-shrink:0;line-height:1.9}.teacher-credit strong{display:block;color:#d7ed8a;font-size:20px}.teacher-credit span{font-size:17px}@media(max-width:650px){header{flex-wrap:wrap;gap:8px}.teacher-credit{margin-left:auto}.teacher-credit strong{font-size:18px}.teacher-credit span{font-size:15px}}
</style></head><body><header><div><small>FINTECH PRACTICE · CHAPTER 13</small><h1>監理科技</h1><p>50 題單選 · 每題 2 分 · 滿分 100 分<br>依自己的步調練習，完成後立即查看得分與正確答案。</p></div><div class="teacher-credit"><strong>數位金融服務</strong><span>楊智宇老師</span></div></header><main><div class="toolbar"><span id="count" aria-live="polite">已作答 0 / 50 題</span></div><progress id="progress" max="50" value="0" aria-label="作答進度"></progress><section id="result" class="result hidden" tabindex="-1"></section><form id="quiz"><div id="questions"></div><div class="bottom"><button class="primary" type="submit">完成作答，查看得分</button><p class="note">無須登入。姓名、學號及成績不會上傳。<br>題目與選項每次練習會重新排列。</p></div></form><button id="retry" class="primary hidden" style="width:100%">重新練習</button></main><script>const QUESTIONS=[{"id":"c13q1","stem":"金融機構以科技改善法遵與風控作業，較接近什麼？","options":[{"id":"a","text":"RegTech"},{"id":"b","text":"純粹廣告科技"},{"id":"c","text":"票券印製"},{"id":"d","text":"產品預購"}],"correct":"a","difficulty":"easy"},{"id":"c13q2","stem":"主管機關用資料分析協助監督金融機構，較接近什麼？","options":[{"id":"b","text":"收單服務"},{"id":"c","text":"回饋募資"},{"id":"d","text":"跟單交易"},{"id":"a","text":"SupTech"}],"correct":"a","difficulty":"easy"},{"id":"c13q3","stem":"監理單位透過電子申報掌握營運，主要是哪種應用？","options":[{"id":"c","text":"紙本寄送"},{"id":"d","text":"保單給付"},{"id":"a","text":"遠距監理"},{"id":"b","text":"現金清點"}],"correct":"a","difficulty":"easy"},{"id":"c13q4","stem":"把監理資料從不同系統取出、轉換並載入，通常是哪類流程？","options":[{"id":"d","text":"AUM"},{"id":"a","text":"ETL"},{"id":"b","text":"OTP"},{"id":"c","text":"NFT"}],"correct":"a","difficulty":"easy"},{"id":"c13q5","stem":"電腦較容易讀取的規則格式，主要可支援什麼？","options":[{"id":"a","text":"合規檢查自動化"},{"id":"b","text":"保證規則永遠正確"},{"id":"c","text":"直接消除所有法律解釋"},{"id":"d","text":"所有人免除責任"}],"correct":"a","difficulty":"easy"},{"id":"c13q6","stem":"在產品與流程設計時就加入合規控制，較接近什麼？","options":[{"id":"b","text":"事後隱藏錯誤"},{"id":"c","text":"取消監理"},{"id":"d","text":"只做行銷審查"},{"id":"a","text":"內建合規"}],"correct":"a","difficulty":"easy"},{"id":"c13q7","stem":"直接執行業務並面對風險的單位，通常屬於哪道防線？","options":[{"id":"c","text":"第三道"},{"id":"d","text":"外部法院"},{"id":"a","text":"第一道"},{"id":"b","text":"第二道"}],"correct":"a","difficulty":"easy"},{"id":"c13q8","stem":"風險管理與法遵單位，通常屬於哪道防線？","options":[{"id":"d","text":"所有客戶"},{"id":"a","text":"第二道"},{"id":"b","text":"第一道"},{"id":"c","text":"第三道"}],"correct":"a","difficulty":"easy"},{"id":"c13q9","stem":"內部稽核提供獨立確信，通常屬於哪道防線？","options":[{"id":"a","text":"第三道"},{"id":"b","text":"第一道"},{"id":"c","text":"第二道"},{"id":"d","text":"行銷通路"}],"correct":"a","difficulty":"easy"},{"id":"c13q10","stem":"把分散的風險資料整理成可分析的資訊，主要支援什麼？","options":[{"id":"b","text":"保證所有風險歸零"},{"id":"c","text":"讓資料不再需要驗證"},{"id":"d","text":"取代全部治理"},{"id":"a","text":"監測與決策"}],"correct":"a","difficulty":"easy"},{"id":"c13q11","stem":"金融危機後法遵要求增加，科技工具可協助什麼？","options":[{"id":"c","text":"所有要求自動取消"},{"id":"d","text":"完全取代監理權責"},{"id":"a","text":"降低重複處理並提高一致性"},{"id":"b","text":"讓法規不再適用"}],"correct":"a","difficulty":"medium"},{"id":"c13q12","stem":"即時資金流與遠距客戶辨識，對監理提出什麼需求？","options":[{"id":"d","text":"忽略交易速度改變"},{"id":"a","text":"更快掌握跨系統與跨場景風險"},{"id":"b","text":"只保留年度紙本報表"},{"id":"c","text":"停止數位身分核對"}],"correct":"a","difficulty":"medium"},{"id":"c13q13","stem":"監理科技的敏捷性主要表現在什麼？","options":[{"id":"a","text":"能較快調整與整合資料及流程"},{"id":"b","text":"所有規則永久固定"},{"id":"c","text":"只減少畫面文字"},{"id":"d","text":"只採用單一檔案"}],"correct":"a","difficulty":"medium"},{"id":"c13q14","stem":"快速產出報告，主要對應哪項效益？","options":[{"id":"b","text":"實體隔離"},{"id":"c","text":"持股稀釋"},{"id":"d","text":"產品同質化"},{"id":"a","text":"速度"}],"correct":"a","difficulty":"medium"},{"id":"c13q15","stem":"同一資料可支援多種風險評估，主要依賴什麼？","options":[{"id":"c","text":"只增加資料副本"},{"id":"d","text":"所有分析用同一個結論"},{"id":"a","text":"可用的分析工具與明確資料定義"},{"id":"b","text":"一律刪除來源紀錄"}],"correct":"a","difficulty":"medium"},{"id":"c13q16","stem":"跨機構資料欄位定義一致，有助於什麼？","options":[{"id":"d","text":"所有機構風險相同"},{"id":"a","text":"整合與可比較性"},{"id":"b","text":"自動證明每筆資料真實"},{"id":"c","text":"免除所有資料管理"}],"correct":"a","difficulty":"medium"},{"id":"c13q17","stem":"API 用於監理申報，主要改善什麼？","options":[{"id":"a","text":"系統互通與資料交換效率"},{"id":"b","text":"直接替代監理決策"},{"id":"c","text":"保證不會發生外洩"},{"id":"d","text":"讓任何人都可讀全部資料"}],"correct":"a","difficulty":"medium"},{"id":"c13q18","stem":"雲端協作平台支援監理團隊，仍須管理什麼？","options":[{"id":"b","text":"只有登入頁配色"},{"id":"c","text":"只需業者口頭保證"},{"id":"d","text":"資料上雲就不需治理"},{"id":"a","text":"權限、保密與營運持續"}],"correct":"a","difficulty":"medium"},{"id":"c13q19","stem":"機器學習標記可疑交易，適當用途為何？","options":[{"id":"c","text":"無須人員理解結果"},{"id":"d","text":"所有告警都一律公開"},{"id":"a","text":"協助篩選並依程序調查"},{"id":"b","text":"直接判定犯罪成立"}],"correct":"a","difficulty":"medium"},{"id":"c13q20","stem":"自然語言處理可協助監理人員處理什麼？","options":[{"id":"d","text":"創設金融商品本金"},{"id":"a","text":"大量報告中的文字與主題"},{"id":"b","text":"直接印製鈔票"},{"id":"c","text":"實體運送現金"}],"correct":"a","difficulty":"medium"},{"id":"c13q21","stem":"監理數據的共同標準，對申報機構可能有何好處？","options":[{"id":"a","text":"減少重複整理與口徑差異"},{"id":"b","text":"取消全部申報責任"},{"id":"c","text":"所有報表只需填零"},{"id":"d","text":"不同業務都不需區分"}],"correct":"a","difficulty":"medium"},{"id":"c13q22","stem":"監理機關、金融業者與科技商合作時，較合理的分工為何？","options":[{"id":"b","text":"全部責任交給科技商"},{"id":"c","text":"金融機構不需理解系統"},{"id":"d","text":"只由客戶決定法遵要求"},{"id":"a","text":"明確區分規則、履行與技術支援責任"}],"correct":"a","difficulty":"medium"},{"id":"c13q23","stem":"主管機關可遠距取得數據，是否代表現場查核沒有用途？","options":[{"id":"c","text":"是，所有異常都能自動發現"},{"id":"d","text":"是，內控不再重要"},{"id":"a","text":"不是，兩者可互補驗證不同風險"},{"id":"b","text":"是，數據永遠完整真實"}],"correct":"a","difficulty":"medium"},{"id":"c13q24","stem":"將風險評估方法共享，主要可改善什麼？","options":[{"id":"d","text":"只增加報表頁數"},{"id":"a","text":"一致性與協作效率"},{"id":"b","text":"讓所有機構分數必然相同"},{"id":"c","text":"取消獨立判斷"}],"correct":"a","difficulty":"medium"},{"id":"c13q25","stem":"監理報告自動生成後，仍需確認什麼？","options":[{"id":"a","text":"資料、口徑與輸出是否正確"},{"id":"b","text":"只看格式美觀"},{"id":"c","text":"只確認檔名含日期"},{"id":"d","text":"所有責任已自動轉移"}],"correct":"a","difficulty":"medium"},{"id":"c13q26","stem":"法規條件更新，內建合規系統應如何處理？","options":[{"id":"b","text":"永遠沿用舊規則"},{"id":"c","text":"只更新宣傳文案"},{"id":"d","text":"把所有例外視為通過"},{"id":"a","text":"受控更新規則並驗證影響"}],"correct":"a","difficulty":"medium"},{"id":"c13q27","stem":"系統能追溯某監理數字的來源，主要支持什麼？","options":[{"id":"c","text":"免除所有更正"},{"id":"d","text":"讓使用者不需權限"},{"id":"a","text":"稽核與錯誤釐清"},{"id":"b","text":"保證數字永不出錯"}],"correct":"a","difficulty":"medium"},{"id":"c13q28","stem":"區塊鏈用於監理資料共享，仍需什麼前提？","options":[{"id":"d","text":"所有監理報告自然正確"},{"id":"a","text":"資料、權限與參與治理清楚"},{"id":"b","text":"所有資料都應公開"},{"id":"c","text":"上鏈就不需要驗證"}],"correct":"a","difficulty":"medium"},{"id":"c13q29","stem":"生物辨識在法遵流程中的代表性用途為何？","options":[{"id":"a","text":"協助身分核對"},{"id":"b","text":"保證所有交易合法"},{"id":"c","text":"預測所有利率"},{"id":"d","text":"自動消除個資風險"}],"correct":"a","difficulty":"medium"},{"id":"c13q30","stem":"前瞻性風險分析與只看歷史違規有何差異？","options":[{"id":"b","text":"保證能預知所有事故"},{"id":"c","text":"只要用 AI 就不需資料"},{"id":"d","text":"完全不能使用歷史資訊"},{"id":"a","text":"嘗試辨識尚未完全顯現的風險訊號"}],"correct":"a","difficulty":"medium"},{"id":"c13q31","stem":"輸入資料偏差，對監理模型可能造成什麼？","options":[{"id":"c","text":"只影響網頁速度"},{"id":"d","text":"不會影響模型結論"},{"id":"a","text":"產生失真的評估與錯誤關注重點"},{"id":"b","text":"監理用途會自動消除偏差"}],"correct":"a","difficulty":"medium"},{"id":"c13q32","stem":"某風險指標突然上升，應先怎樣？","options":[{"id":"d","text":"只修改顯示刻度"},{"id":"a","text":"核對資料與業務脈絡再判讀"},{"id":"b","text":"直接宣布該機構倒閉"},{"id":"c","text":"自動刪除該機構資料"}],"correct":"a","difficulty":"medium"},{"id":"c13q33","stem":"第三方監理系統停用，金融機構應準備什麼？","options":[{"id":"a","text":"接續作業、資料取得與替代方案"},{"id":"b","text":"永久停止申報"},{"id":"c","text":"把資料全部交由廠商獨占"},{"id":"d","text":"只通知行銷部門"}],"correct":"a","difficulty":"medium"},{"id":"c13q34","stem":"系統以同一欄位接收不同單位資料，需避免什麼？","options":[{"id":"b","text":"資料格式太一致"},{"id":"c","text":"每筆資料都有來源"},{"id":"d","text":"記錄轉換規則"},{"id":"a","text":"定義不同卻當成可直接比較"}],"correct":"a","difficulty":"medium"},{"id":"c13q35","stem":"公私部門協作提升監理科技，主要需要什麼？","options":[{"id":"c","text":"只比較供應商股價"},{"id":"d","text":"取消所有查核權"},{"id":"a","text":"共享適當知識與建立可信任治理"},{"id":"b","text":"任意公開所有客戶資訊"}],"correct":"a","difficulty":"medium"},{"id":"c13q36","stem":"第二道防線使用監控工具，與第一道防線應如何合作？","options":[{"id":"d","text":"只在稽核前暫時聯絡"},{"id":"a","text":"釐清異常、回饋控制並維持角色分工"},{"id":"b","text":"代替全部日常業務責任"},{"id":"c","text":"不讓業務理解任何規則"}],"correct":"a","difficulty":"medium"},{"id":"c13q37","stem":"第三道防線檢查自動法遵工具，應重視什麼？","options":[{"id":"a","text":"獨立評估控制設計與執行效果"},{"id":"b","text":"只接受開發團隊自行聲明"},{"id":"c","text":"只看報告長度"},{"id":"d","text":"直接承接全部業務操作"}],"correct":"a","difficulty":"medium"},{"id":"c13q38","stem":"機器可讀規則與自然語言條文之間，需注意什麼？","options":[{"id":"b","text":"格式轉換等同所有解釋都確定"},{"id":"c","text":"所有條文都無歧義"},{"id":"d","text":"只改副檔名即可"},{"id":"a","text":"轉換是否正確反映條件與例外"}],"correct":"a","difficulty":"medium"},{"id":"c13q39","stem":"提升申報頻率之前，應同時評估什麼？","options":[{"id":"c","text":"完全不需資料治理"},{"id":"d","text":"只比較傳輸封包大小"},{"id":"a","text":"資料品質、成本與監理用途"},{"id":"b","text":"頻率越高必然越好"}],"correct":"a","difficulty":"medium"},{"id":"c13q40","stem":"評估監理科技成效，較完整指標為何？","options":[{"id":"d","text":"只看報表總數"},{"id":"a","text":"準確性、效率、風險發現與執行負擔"},{"id":"b","text":"只看自動化比例"},{"id":"c","text":"只看採購金額"}],"correct":"a","difficulty":"medium"},{"id":"c13q41","stem":"同一銀行改了資料定義卻未通知，模型顯示風險下降，應先懷疑什麼？","options":[{"id":"a","text":"口徑變更可能造成指標斷裂"},{"id":"b","text":"風險必然真的下降"},{"id":"c","text":"資料越新越不用查"},{"id":"d","text":"圖表下降就不需判讀"}],"correct":"a","difficulty":"hard"},{"id":"c13q42","stem":"自動法遵規則把例外案件全部擋下，業務大量中斷，應如何改善？","options":[{"id":"b","text":"取消所有控制"},{"id":"c","text":"把每個阻擋都當違規"},{"id":"d","text":"只降低所有門檻"},{"id":"a","text":"設計受控例外與覆核流程並檢討規則"}],"correct":"a","difficulty":"hard"},{"id":"c13q43","stem":"模型告警增加三倍，查核人力不變，需優先評估什麼？","options":[{"id":"c","text":"只提高報表頁數"},{"id":"d","text":"把全部告警直接結案"},{"id":"a","text":"告警品質、排序與實際處理能力"},{"id":"b","text":"告警越多已代表成功"}],"correct":"a","difficulty":"hard"},{"id":"c13q44","stem":"監理工具由被評估業者提供且無法檢查，應關注什麼？","options":[{"id":"d","text":"只看演算法速度"},{"id":"a","text":"獨立性、透明度與查核能力"},{"id":"b","text":"廠商名稱是否簡短"},{"id":"c","text":"工具用戶越多就必然公正"}],"correct":"a","difficulty":"hard"},{"id":"c13q45","stem":"共享數據已加密，但解密後每位協作者均可下載全部資料，仍有何問題？","options":[{"id":"a","text":"最小權限與使用範圍控制不足"},{"id":"b","text":"加密可自動限制所有後續利用"},{"id":"c","text":"檔案已安全就不需記錄"},{"id":"d","text":"下載資料不構成風險"}],"correct":"a","difficulty":"hard"},{"id":"c13q46","stem":"兩套監理模型都依賴同一不完整來源，結果一致意味什麼？","options":[{"id":"b","text":"一致就保證真實"},{"id":"c","text":"模型越多偏差必然消失"},{"id":"d","text":"任何不同來源都不需要"},{"id":"a","text":"不能排除共同資料缺陷"}],"correct":"a","difficulty":"hard"},{"id":"c13q47","stem":"某機構申報及時率百分之百但數字常更正，應如何評價？","options":[{"id":"c","text":"更正越多表示越準確"},{"id":"d","text":"只需維持報告格式"},{"id":"a","text":"速度達標但品質仍須改善"},{"id":"b","text":"及時率可代表全部品質"}],"correct":"a","difficulty":"hard"},{"id":"c13q48","stem":"用歷史裁罰訓練模型，可能把過去查核偏重對象再度標高，應注意什麼？","options":[{"id":"d","text":"只增加訓練次數即可保證公平"},{"id":"a","text":"歷史選擇偏差可能形成回饋循環"},{"id":"b","text":"裁罰資料天然完整無偏"},{"id":"c","text":"模型無法反映任何偏見"}],"correct":"a","difficulty":"hard"},{"id":"c13q49","stem":"規則更新後沒有保留舊版本，追查過去決策時會缺少什麼？","options":[{"id":"a","text":"當時適用條件與判斷依據"},{"id":"b","text":"只有報表配色"},{"id":"c","text":"客戶手機型號"},{"id":"d","text":"所有資金流紀錄必然遺失"}],"correct":"a","difficulty":"hard"},{"id":"c13q50","stem":"多家金融機構使用同一監理服務商，應共同關注什麼？","options":[{"id":"b","text":"所有風險已自然分散"},{"id":"c","text":"機構數多就不會有共同故障"},{"id":"d","text":"只要合約各自簽署就無關聯"},{"id":"a","text":"供應商集中造成的系統性依賴"}],"correct":"a","difficulty":"hard"}];</script><script>
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=crypto.getRandomValues(new Uint32Array(1))[0]%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
let questions=[],answers={},finished=false;const $=id=>document.getElementById(id);const escapeHtml=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){questions=shuffle(QUESTIONS).map(q=>({...q,options:shuffle(q.options)}));answers={};finished=false;$('result').classList.add('hidden');$('retry').classList.add('hidden');$('quiz').classList.remove('hidden');$('quiz').querySelector('.bottom').classList.remove('hidden');$('questions').innerHTML=questions.map((q,i)=>`<section class="question" id="${q.id}"><span class="number">QUESTION ${String(i+1).padStart(2,'0')} / 50</span><h2>${escapeHtml(q.stem)}</h2>${q.options.map((o,j)=>`<label><input type="radio" name="${q.id}" value="${o.id}"><span>${String.fromCharCode(65+j)}. ${escapeHtml(o.text)}</span></label>`).join('')}<div class="feedback"></div></section>`).join('');update()}
function update(){$('count').textContent=`已作答 ${Object.keys(answers).length} / 50 題`;$('progress').value=Object.keys(answers).length}
$('quiz').addEventListener('change',e=>{if(!finished&&e.target.type==='radio'){answers[e.target.name]=e.target.value;update()}});
$('quiz').addEventListener('submit',e=>{e.preventDefault();if(finished)return;const missing=50-Object.keys(answers).length;if(missing&&!confirm(`還有 ${missing} 題未作答，未答題以 0 分計算。確定完成？`))return;finished=true;let right=0;for(const q of questions){const section=$(q.id);const ok=answers[q.id]===q.correct;if(ok)right++;for(const input of section.querySelectorAll('input')){input.disabled=true;if(input.value===q.correct)input.closest('label').classList.add('correct');else if(input.checked)input.closest('label').classList.add('wrong')}section.querySelector('.feedback').textContent=ok?'答對了！':`${answers[q.id]?'本題答錯':'本題未作答'}。正確答案：${q.options.find(o=>o.id===q.correct).text}`}$('result').innerHTML=`<span>本次練習得分</span><strong>${right*2}<small style="font-size:22px"> 分</small></strong><p>答對 ${right} 題 · 答錯 ${50-right-missing} 題 · 未答 ${missing} 題</p><p>往下查看每題答案，或重新練習一次。</p>`;$('result').classList.remove('hidden');$('quiz').querySelector('.bottom').classList.add('hidden');$('retry').classList.remove('hidden');$('result').scrollIntoView({behavior:'smooth'});$('result').focus({preventScroll:true})});
$('retry').onclick=()=>{render();window.scrollTo({top:0,behavior:'smooth'})};render();
</script></body></html>
