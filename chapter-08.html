</style></head><body><header><div><small>FINTECH PRACTICE · CHAPTER 08</small><h1>保險科技</h1><p>50 題單選 · 每題 2 分 · 滿分 100 分<br>依自己的步調練習，完成後立即查看得分與正確答案。</p></div><div class="teacher-credit"><strong>數位金融服務</strong><span>楊智宇老師</span></div></header><main><div class="toolbar"><span id="count" aria-live="polite">已作答 0 / 50 題</span></div><progress id="progress" max="50" value="0" aria-label="作答進度"></progress><section id="result" class="result hidden" tabindex="-1"></section><form id="quiz"><div id="questions"></div><div class="bottom"><button class="primary" type="submit">完成作答，查看得分</button><p class="note">無須登入。姓名、學號及成績不會上傳。<br>題目與選項每次練習會重新排列。</p></div></form><button id="retry" class="primary hidden" style="width:100%">重新練習</button></main><script>const QUESTIONS=[{"id":"c8q1","stem":"保險公司用資料與數位工具改善承保到理賠，主要屬於什麼？","options":[{"id":"a","text":"保險科技"},{"id":"b","text":"只有證券交易科技"},{"id":"c","text":"純粹貨幣政策"},{"id":"d","text":"銀行間清算"}],"correct":"a","difficulty":"easy"},{"id":"c8q2","stem":"用行車資料調整車險價格，較接近哪種保險概念？","options":[{"id":"b","text":"所有車主固定同價"},{"id":"c","text":"純粹捐贈型募資"},{"id":"d","text":"股票跟單"},{"id":"a","text":"使用者基礎保險 UBI"}],"correct":"a","difficulty":"easy"},{"id":"c8q3","stem":"穿戴裝置回傳活動紀錄，最直接支援哪種應用？","options":[{"id":"c","text":"區塊獎勵計算"},{"id":"d","text":"匯率撮合"},{"id":"a","text":"健康管理與風險分析"},{"id":"b","text":"紙本票據背書"}],"correct":"a","difficulty":"easy"},{"id":"c8q4","stem":"網站並列不同保單的保障與價格，主要是哪種服務？","options":[{"id":"d","text":"股票交易所"},{"id":"a","text":"保險比較平台"},{"id":"b","text":"支付清算中心"},{"id":"c","text":"信用評等機構"}],"correct":"a","difficulty":"easy"},{"id":"c8q5","stem":"保險公司在接受投保前評估風險與條件，這個環節叫什麼？","options":[{"id":"a","text":"核保"},{"id":"b","text":"理賠"},{"id":"c","text":"再平衡"},{"id":"d","text":"股權稀釋"}],"correct":"a","difficulty":"easy"},{"id":"c8q6","stem":"保戶事故後提出文件申請給付，屬於哪個環節？","options":[{"id":"b","text":"募資"},{"id":"c","text":"支付收單"},{"id":"d","text":"基金跟單"},{"id":"a","text":"理賠"}],"correct":"a","difficulty":"easy"},{"id":"c8q7","stem":"感測器偵測水管漏水並及早通知，主要體現什麼轉變？","options":[{"id":"c","text":"保費不再需要計算"},{"id":"d","text":"任何風險都可完全轉移"},{"id":"a","text":"從損失補償延伸到損失預防"},{"id":"b","text":"所有事故都已消失"}],"correct":"a","difficulty":"easy"},{"id":"c8q8","stem":"線上投保流程以電子方式核對身分，較接近什麼？","options":[{"id":"d","text":"IPO"},{"id":"a","text":"eKYC"},{"id":"b","text":"AUM"},{"id":"c","text":"mPOS"}],"correct":"a","difficulty":"easy"},{"id":"c8q9","stem":"依客戶需求推薦相應保障，主要改善哪個環節？","options":[{"id":"a","text":"產品行銷與服務匹配"},{"id":"b","text":"央行發行通貨"},{"id":"c","text":"銀行間資金清算"},{"id":"d","text":"礦工競算"}],"correct":"a","difficulty":"easy"},{"id":"c8q10","stem":"雲端資源依理賠案件量增減，主要運用哪種能力？","options":[{"id":"b","text":"固定實體容量"},{"id":"c","text":"人工分類"},{"id":"d","text":"票據流通"},{"id":"a","text":"彈性運算"}],"correct":"a","difficulty":"easy"},{"id":"c8q11","stem":"保險資料中，投保前客戶比公司更清楚自身風險，主要涉及什麼？","options":[{"id":"c","text":"風險自然消失"},{"id":"d","text":"貨幣發行"},{"id":"a","text":"資訊不對稱"},{"id":"b","text":"完全資訊市場"}],"correct":"a","difficulty":"medium"},{"id":"c8q12","stem":"較高風險者更願意以相同條件投保，可能造成什麼？","options":[{"id":"d","text":"資產再平衡"},{"id":"a","text":"逆選擇"},{"id":"b","text":"帳戶聚合"},{"id":"c","text":"資料加密"}],"correct":"a","difficulty":"medium"},{"id":"c8q13","stem":"投保後因受保障而降低注意程度，較接近什麼問題？","options":[{"id":"a","text":"道德風險"},{"id":"b","text":"投資人賦權"},{"id":"c","text":"資金清算"},{"id":"d","text":"機器視覺"}],"correct":"a","difficulty":"medium"},{"id":"c8q14","stem":"車聯網紀錄急煞與里程，用於風險分級時應先確認什麼？","options":[{"id":"b","text":"只要數量多就一定正確"},{"id":"c","text":"只看車輛顏色"},{"id":"d","text":"只看手機售價"},{"id":"a","text":"資料能否合理反映實際駕駛風險"}],"correct":"a","difficulty":"medium"},{"id":"c8q15","stem":"以行車行為提供保費回饋，主要希望促進什麼？","options":[{"id":"c","text":"交通事故必然歸零"},{"id":"d","text":"取消道路規則"},{"id":"a","text":"安全駕駛的誘因"},{"id":"b","text":"所有車輛改同一品牌"}],"correct":"a","difficulty":"medium"},{"id":"c8q16","stem":"健康外溢型保單搭配活動鼓勵，主要想達成什麼？","options":[{"id":"d","text":"取消所有保障條款"},{"id":"a","text":"以健康行為改善風險與客戶價值"},{"id":"b","text":"保證保戶永不生病"},{"id":"c","text":"用步數代替全部醫療判斷"}],"correct":"a","difficulty":"medium"},{"id":"c8q17","stem":"保險公司以流失模型找出可能離開的客戶，較適合怎麼運用？","options":[{"id":"a","text":"規劃適當關懷並衡量效果"},{"id":"b","text":"直接取消該客戶保單"},{"id":"c","text":"把預測視為確定退保"},{"id":"d","text":"對所有人發同樣大量訊息"}],"correct":"a","difficulty":"medium"},{"id":"c8q18","stem":"理賠模型標示可疑案件，應如何處理？","options":[{"id":"b","text":"直接認定保戶詐欺"},{"id":"c","text":"永久拒收任何證明"},{"id":"d","text":"將客戶資料公開"},{"id":"a","text":"依程序進行覆核與必要調查"}],"correct":"a","difficulty":"medium"},{"id":"c8q19","stem":"影像辨識估算車體受損，較合理的定位是什麼？","options":[{"id":"c","text":"能判定全部法律責任"},{"id":"d","text":"可取代所有契約內容"},{"id":"a","text":"協助評估並保留爭議處理"},{"id":"b","text":"可保證任何事故完全準確"}],"correct":"a","difficulty":"medium"},{"id":"c8q20","stem":"航班延誤險依可靠航班資訊啟動給付，關鍵資料條件為何？","options":[{"id":"d","text":"不用核對保單有效期間"},{"id":"a","text":"事件資料與保單觸發條件需明確一致"},{"id":"b","text":"所有航班狀況都相同"},{"id":"c","text":"只需客戶自行改時間"}],"correct":"a","difficulty":"medium"},{"id":"c8q21","stem":"智能合約執行理賠規則，仍需誰先定義規則？","options":[{"id":"a","text":"保險業務與技術及治理相關人員"},{"id":"b","text":"程式會自行決定全部契約內容"},{"id":"c","text":"只由保戶隨時修改"},{"id":"d","text":"任何節點皆可任意決定"}],"correct":"a","difficulty":"medium"},{"id":"c8q22","stem":"跨公司共享理賠紀錄，較適合搭配何種控制？","options":[{"id":"b","text":"對全網公開所有病歷"},{"id":"c","text":"共用一組無限制密碼"},{"id":"d","text":"只更改欄位顏色"},{"id":"a","text":"存取權限、資料品質與適當授權"}],"correct":"a","difficulty":"medium"},{"id":"c8q23","stem":"區塊鏈能追蹤資料修改，為何仍需核對輸入來源？","options":[{"id":"c","text":"區塊鏈會自動訪查事故"},{"id":"d","text":"所有輸入都由央行核准"},{"id":"a","text":"可追蹤紀錄不保證事件本身真實"},{"id":"b","text":"上鏈後來源就完全不重要"}],"correct":"a","difficulty":"medium"},{"id":"c8q24","stem":"以客戶風險特徵設計新保單，主要屬於哪項應用？","options":[{"id":"d","text":"資產保管"},{"id":"a","text":"產品設計"},{"id":"b","text":"票據交換"},{"id":"c","text":"匯兌撮合"}],"correct":"a","difficulty":"medium"},{"id":"c8q25","stem":"比價網站只依保費由低到高排序，最容易忽略什麼？","options":[{"id":"a","text":"保障內容、限制與除外責任"},{"id":"b","text":"投保人的付款日期"},{"id":"c","text":"網站載入速度"},{"id":"d","text":"公司的標誌大小"}],"correct":"a","difficulty":"medium"},{"id":"c8q26","stem":"線上投保步驟縮短，仍應確保什麼？","options":[{"id":"b","text":"條款全部隱藏"},{"id":"c","text":"以預先勾選取代所有說明"},{"id":"d","text":"只顯示折扣百分比"},{"id":"a","text":"重要條款可理解且客戶有機會確認"}],"correct":"a","difficulty":"medium"},{"id":"c8q27","stem":"保險科技導入後，從業人員較適合如何轉型？","options":[{"id":"c","text":"只重複輸入相同資料"},{"id":"d","text":"把所有爭議交由客戶自行承擔"},{"id":"a","text":"提升解說、例外處理與專業判斷能力"},{"id":"b","text":"完全停止學習保障知識"}],"correct":"a","difficulty":"medium"},{"id":"c8q28","stem":"高齡保戶不熟悉 App，較合適的服務設計為何？","options":[{"id":"d","text":"讓他人共用其帳號"},{"id":"a","text":"提供可理解的操作與替代協助"},{"id":"b","text":"強制只用最複雜介面"},{"id":"c","text":"取消其投保權利"}],"correct":"a","difficulty":"medium"},{"id":"c8q29","stem":"視訊生存調查可降低什麼成本？","options":[{"id":"a","text":"部分往返與臨櫃確認成本"},{"id":"b","text":"全部保險事故成本"},{"id":"c","text":"所有身分風險"},{"id":"d","text":"所有給付責任"}],"correct":"a","difficulty":"medium"},{"id":"c8q30","stem":"健康資料用於服務時，應優先落實什麼？","options":[{"id":"b","text":"無限保存供任意行銷"},{"id":"c","text":"把姓名刪除即可任意分享"},{"id":"d","text":"只由業務員自行決定"},{"id":"a","text":"用途、權限、保存與隱私保護"}],"correct":"a","difficulty":"medium"},{"id":"c8q31","stem":"基因資訊可能改善風險理解，同時需特別考量什麼？","options":[{"id":"c","text":"一定讓每個人保費下降"},{"id":"d","text":"可以取代所有醫療資訊"},{"id":"a","text":"敏感性、倫理與公平使用"},{"id":"b","text":"一定可公開全部資料"}],"correct":"a","difficulty":"medium"},{"id":"c8q32","stem":"保險核心系統平台業者主要可提供什麼？","options":[{"id":"d","text":"任何事故的現場鑑定"},{"id":"a","text":"保單、核保與理賠等營運技術支援"},{"id":"b","text":"央行貨幣發行權"},{"id":"c","text":"所有契約的政府保證"}],"correct":"a","difficulty":"medium"},{"id":"c8q33","stem":"P2P 保險或互助安排，評估時應先確認什麼？","options":[{"id":"a","text":"風險池、給付責任與營運規則"},{"id":"b","text":"參與者人數多就一定足額"},{"id":"c","text":"使用網路即代表有法定保障"},{"id":"d","text":"每筆支持金都等同銀行存款"}],"correct":"a","difficulty":"medium"},{"id":"c8q34","stem":"科技使投保資料較完整，最可能改善什麼？","options":[{"id":"b","text":"所有資訊不對稱完全消失"},{"id":"c","text":"全部保費必然相同"},{"id":"d","text":"所有損失必然可保"},{"id":"a","text":"風險理解與作業效率"}],"correct":"a","difficulty":"medium"},{"id":"c8q35","stem":"創新保險服務進行受控試驗，主要用途為何？","options":[{"id":"c","text":"無須告知參與者"},{"id":"d","text":"直接保證全市場成功"},{"id":"a","text":"在有限範圍評估效益與風險"},{"id":"b","text":"永久免除所有監理"}],"correct":"a","difficulty":"medium"},{"id":"c8q36","stem":"監理單位面對新型保險資料運用，較合適的工作為何？","options":[{"id":"d","text":"以程式碼取代全部監理"},{"id":"a","text":"了解商業模式並評估權益與風險"},{"id":"b","text":"只比較宣傳聲量"},{"id":"c","text":"所有創新一律不評估"}],"correct":"a","difficulty":"medium"},{"id":"c8q37","stem":"新保單使用相同感測資料提供差異化方案，應避免什麼？","options":[{"id":"a","text":"把資料差異直接當作不可申訴的標籤"},{"id":"b","text":"明確解釋資料用途"},{"id":"c","text":"提供資料更正機會"},{"id":"d","text":"定期驗證風險模型"}],"correct":"a","difficulty":"medium"},{"id":"c8q38","stem":"數位理賠可全天收件，是否等於所有案件立即完成給付？","options":[{"id":"b","text":"等於，提交就是核准"},{"id":"c","text":"等於，任何契約都一樣"},{"id":"d","text":"等於，資料必然沒有缺漏"},{"id":"a","text":"不等於，仍可能需要審核與補件"}],"correct":"a","difficulty":"medium"},{"id":"c8q39","stem":"保單文件電子化，除了節省紙張還需確保什麼？","options":[{"id":"c","text":"只有視覺配色一致"},{"id":"d","text":"只要寄出就不用保存"},{"id":"a","text":"版本、可存取性與紀錄完整性"},{"id":"b","text":"只有檔案大小最小"}],"correct":"a","difficulty":"medium"},{"id":"c8q40","stem":"評估保險科技成效，哪組指標較完整？","options":[{"id":"d","text":"只計算系統畫面數"},{"id":"a","text":"處理時間、錯誤率、客戶體驗與風險"},{"id":"b","text":"只看使用者註冊數"},{"id":"c","text":"只看模型參數量"}],"correct":"a","difficulty":"medium"},{"id":"c8q41","stem":"兩名車主里程相同，一人常在高風險時段行駛，定價模型應如何處理？","options":[{"id":"a","text":"評估多種相關風險因素與資料合理性"},{"id":"b","text":"里程相同即必須完全同價"},{"id":"c","text":"只依車牌奇偶數"},{"id":"d","text":"把時段當作無法分析的資訊"}],"correct":"a","difficulty":"hard"},{"id":"c8q42","stem":"穿戴裝置常由家人代戴，依步數回饋可能出現什麼？","options":[{"id":"b","text":"步數越多越能證明身分"},{"id":"c","text":"裝置本身可保證佩戴者不變"},{"id":"d","text":"資料多就必然修正代戴問題"},{"id":"a","text":"資料無法準確代表被保險人的行為"}],"correct":"a","difficulty":"hard"},{"id":"c8q43","stem":"自動給付依賴單一航班資訊商，若其資料錯誤，應如何設計？","options":[{"id":"c","text":"假定外部資料永遠正確"},{"id":"d","text":"只增加廣告曝光"},{"id":"a","text":"驗證資料、處理爭議並規劃例外與更正"},{"id":"b","text":"程式執行後一律不可申訴"}],"correct":"a","difficulty":"hard"},{"id":"c8q44","stem":"細緻風險定價讓某些族群幾乎無法取得保障，應如何評估？","options":[{"id":"d","text":"所有客戶都只能同價"},{"id":"a","text":"同時考量精準度、公平性與保險可近性"},{"id":"b","text":"只要模型準確即可忽略保障取得"},{"id":"c","text":"保費越分散就必然越公平"}],"correct":"a","difficulty":"hard"},{"id":"c8q45","stem":"保險比價平台優先展示佣金較高商品，主要治理議題為何？","options":[{"id":"a","text":"推薦排序的利益衝突與透明度"},{"id":"b","text":"感測器電池壽命"},{"id":"c","text":"保單圖片解析度"},{"id":"d","text":"網域名稱長短"}],"correct":"a","difficulty":"hard"},{"id":"c8q46","stem":"互助平台承諾給付卻未說明資金不足時怎麼辦，最欠缺什麼？","options":[{"id":"b","text":"更多會員推薦碼"},{"id":"c","text":"更快的網頁動畫"},{"id":"d","text":"相同顏色的收據"},{"id":"a","text":"風險承擔與給付能力安排"}],"correct":"a","difficulty":"hard"},{"id":"c8q47","stem":"模型大量拒絕理賠使成本下降，但申訴後常被推翻，代表什麼？","options":[{"id":"c","text":"申訴不屬於服務品質"},{"id":"d","text":"只要用 AI 就不需覆核"},{"id":"a","text":"應檢查決策品質與客戶權益成本"},{"id":"b","text":"成本下降已足以證明成功"}],"correct":"a","difficulty":"hard"},{"id":"c8q48","stem":"資訊完整度較低的客戶被模型判為高風險，應先檢查什麼？","options":[{"id":"d","text":"模型結果不需要解釋"},{"id":"a","text":"缺漏資訊是否被不當等同於真實高風險"},{"id":"b","text":"客戶是否使用新款手機"},{"id":"c","text":"所有缺漏都等於詐欺"}],"correct":"a","difficulty":"hard"},{"id":"c8q49","stem":"雲端理賠服務中斷且沒有人工備援，主要暴露什麼？","options":[{"id":"a","text":"營運持續與第三方依賴風險"},{"id":"b","text":"保險標的必然受損"},{"id":"c","text":"保費一定計算錯誤"},{"id":"d","text":"所有保單立即失效"}],"correct":"a","difficulty":"hard"},{"id":"c8q50","stem":"新產品已獲市場關注，要擴大部署前最需要什麼？","options":[{"id":"b","text":"只增加宣傳預算"},{"id":"c","text":"只把試用者數量放大"},{"id":"d","text":"停止追蹤不利事件"},{"id":"a","text":"驗證承保、理賠、資安與服務能力可擴充"}],"correct":"a","difficulty":"hard"}];</script><script>
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=crypto.getRandomValues(new Uint32Array(1))[0]%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
let questions=[],answers={},finished=false;const $=id=>document.getElementById(id);const escapeHtml=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){questions=shuffle(QUESTIONS).map(q=>({...q,options:shuffle(q.options)}));answers={};finished=false;$('result').classList.add('hidden');$('retry').classList.add('hidden');$('quiz').classList.remove('hidden');$('quiz').querySelector('.bottom').classList.remove('hidden');$('questions').innerHTML=questions.map((q,i)=>`<section class="question" id="${q.id}"><span class="number">QUESTION ${String(i+1).padStart(2,'0')} / 50</span><h2>${escapeHtml(q.stem)}</h2>${q.options.map((o,j)=>`<label><input type="radio" name="${q.id}" value="${o.id}"><span>${String.fromCharCode(65+j)}. ${escapeHtml(o.text)}</span></label>`).join('')}<div class="feedback"></div></section>`).join('');update()}
function update(){$('count').textContent=`已作答 ${Object.keys(answers).length} / 50 題`;$('progress').value=Object.keys(answers).length}
$('quiz').addEventListener('change',e=>{if(!finished&&e.target.type==='radio'){answers[e.target.name]=e.target.value;update()}});
$('quiz').addEventListener('submit',e=>{e.preventDefault();if(finished)return;const missing=50-Object.keys(answers).length;if(missing&&!confirm(`還有 ${missing} 題未作答，未答題以 0 分計算。確定完成？`))return;finished=true;let right=0;for(const q of questions){const section=$(q.id);const ok=answers[q.id]===q.correct;if(ok)right++;for(const input of section.querySelectorAll('input')){input.disabled=true;if(input.value===q.correct)input.closest('label').classList.add('correct');else if(input.checked)input.closest('label').classList.add('wrong')}section.querySelector('.feedback').textContent=ok?'答對了！':`${answers[q.id]?'本題答錯':'本題未作答'}。正確答案：${q.options.find(o=>o.id===q.correct).text}`}$('result').innerHTML=`<span>本次練習得分</span><strong>${right*2}<small style="font-size:22px"> 分</small></strong><p>答對 ${right} 題 · 答錯 ${50-right-missing} 題 · 未答 ${missing} 題</p><p>往下查看每題答案，或重新練習一次。</p>`;$('result').classList.remove('hidden');$('quiz').querySelector('.bottom').classList.add('hidden');$('retry').classList.remove('hidden');$('result').scrollIntoView({behavior:'smooth'});$('result').focus({preventScroll:true})});
$('retry').onclick=()=>{render();window.scrollTo({top:0,behavior:'smooth'})};render();
</script></body></html>
