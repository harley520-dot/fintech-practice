</style></head><body><header><div><small>FINTECH PRACTICE · CHAPTER 15</small><h1>金融機構的數位轉型</h1><p>50 題單選 · 每題 2 分 · 滿分 100 分<br>依自己的步調練習，完成後立即查看得分與正確答案。</p></div><div class="teacher-credit"><strong>數位金融服務</strong><span>楊智宇老師</span></div></header><main><div class="toolbar"><span id="count" aria-live="polite">已作答 0 / 50 題</span></div><progress id="progress" max="50" value="0" aria-label="作答進度"></progress><section id="result" class="result hidden" tabindex="-1"></section><form id="quiz"><div id="questions"></div><div class="bottom"><button class="primary" type="submit">完成作答，查看得分</button><p class="note">無須登入。姓名、學號及成績不會上傳。<br>題目與選項每次練習會重新排列。</p></div></form><button id="retry" class="primary hidden" style="width:100%">重新練習</button></main><script>const QUESTIONS=[{"id":"c15q1","stem":"銀行重新思考服務、流程與商業模式，運用科技改變運作方式，較接近什麼？","options":[{"id":"a","text":"數位轉型"},{"id":"b","text":"只把紙張掃描"},{"id":"c","text":"只更改商標"},{"id":"d","text":"單純增加設備"}],"correct":"a","difficulty":"easy"},{"id":"c15q2","stem":"客戶在 App 申請後到分行能接續辦理，主要體現什麼？","options":[{"id":"b","text":"各通路完全分離"},{"id":"c","text":"只有實體服務"},{"id":"d","text":"單一設備依賴"},{"id":"a","text":"跨通路無縫體驗"}],"correct":"a","difficulty":"easy"},{"id":"c15q3","stem":"把付款或貸款功能放進購物流程，較接近什麼？","options":[{"id":"c","text":"現金運送"},{"id":"d","text":"紙本保管"},{"id":"a","text":"嵌入式金融服務"},{"id":"b","text":"只做銀行形象廣告"}],"correct":"a","difficulty":"easy"},{"id":"c15q4","stem":"RPA 在金融流程中主要是什麼？","options":[{"id":"d","text":"只處理金融商品定價"},{"id":"a","text":"模擬例行操作的軟體自動化"},{"id":"b","text":"一定具有手臂的實體機器人"},{"id":"c","text":"只有聲音辨識"}],"correct":"a","difficulty":"easy"},{"id":"c15q5","stem":"以客戶痛點作為規劃起點，主要屬於什麼思維？","options":[{"id":"a","text":"以客戶為中心"},{"id":"b","text":"只以設備為中心"},{"id":"c","text":"只看同業排名"},{"id":"d","text":"只依廠商推薦"}],"correct":"a","difficulty":"easy"},{"id":"c15q6","stem":"跨部門以短週期驗證需求並調整，較接近什麼工作方式？","options":[{"id":"b","text":"永久固定全部需求"},{"id":"c","text":"各自作業不溝通"},{"id":"d","text":"只在結案後聽意見"},{"id":"a","text":"敏捷協作"}],"correct":"a","difficulty":"easy"},{"id":"c15q7","stem":"銀行提供 API 讓合作商整合金融功能，主要延伸什麼？","options":[{"id":"c","text":"現金印製"},{"id":"d","text":"實體庫房面積"},{"id":"a","text":"金融價值鏈"},{"id":"b","text":"股權稀釋"}],"correct":"a","difficulty":"easy"},{"id":"c15q8","stem":"機器人處理重複輸入後，員工較可轉向什麼？","options":[{"id":"d","text":"只負責按下更新鍵"},{"id":"a","text":"顧問與複雜例外處理"},{"id":"b","text":"更多相同資料重打"},{"id":"c","text":"完全不需專業知識"}],"correct":"a","difficulty":"easy"},{"id":"c15q9","stem":"把社群與服務互動資料轉為客戶需求洞見，主要強化什麼？","options":[{"id":"a","text":"數據的策略價值"},{"id":"b","text":"所有商品保本"},{"id":"c","text":"貨幣供給"},{"id":"d","text":"所有帳戶匿名"}],"correct":"a","difficulty":"easy"},{"id":"c15q10","stem":"面對新創競爭同時也合作提供服務，這是哪種關係？","options":[{"id":"b","text":"完全退出市場"},{"id":"c","text":"單純內部稽核"},{"id":"d","text":"只做公益捐贈"},{"id":"a","text":"競合"}],"correct":"a","difficulty":"easy"},{"id":"c15q11","stem":"評估新科技是否導入，首先應釐清什麼？","options":[{"id":"c","text":"設備外觀是否新穎"},{"id":"d","text":"同業是否全部使用"},{"id":"a","text":"能解決什麼客戶或業務問題"},{"id":"b","text":"宣傳名稱是否熱門"}],"correct":"a","difficulty":"medium"},{"id":"c15q12","stem":"科技建置成本與預期效益應如何比較？","options":[{"id":"d","text":"不用設定衡量方式"},{"id":"a","text":"納入導入、維護、風險與實際改善"},{"id":"b","text":"只看購買當天折扣"},{"id":"c","text":"只估算節省的紙張"}],"correct":"a","difficulty":"medium"},{"id":"c15q13","stem":"試辦成功後擴大應用，仍需確認什麼？","options":[{"id":"a","text":"架構、流程與組織能力是否可擴充"},{"id":"b","text":"只複製宣傳圖片"},{"id":"c","text":"樣本成功即可無限擴大"},{"id":"d","text":"不用增加監測"}],"correct":"a","difficulty":"medium"},{"id":"c15q14","stem":"科技成熟度評估，除了功能還應看什麼？","options":[{"id":"b","text":"只有發表會聲量"},{"id":"c","text":"只有程式碼字數"},{"id":"d","text":"只看產品名稱"},{"id":"a","text":"支援生態、可靠性與可維運性"}],"correct":"a","difficulty":"medium"},{"id":"c15q15","stem":"客戶對即時服務期待提升，銀行較適合如何回應？","options":[{"id":"c","text":"維持全部等待步驟"},{"id":"d","text":"把需求全部交給客戶"},{"id":"a","text":"重新設計服務流程與能力"},{"id":"b","text":"只延長廣告播放"}],"correct":"a","difficulty":"medium"},{"id":"c15q16","stem":"新創專注單一痛點與利基商品，對銀行有何壓力？","options":[{"id":"d","text":"完全不影響客戶選擇"},{"id":"a","text":"挑戰原先一站式服務中的個別高價值環節"},{"id":"b","text":"只影響招牌設計"},{"id":"c","text":"所有業務同時消失"}],"correct":"a","difficulty":"medium"},{"id":"c15q17","stem":"平台化服務的主要價值之一為何？","options":[{"id":"a","text":"連結多方能力提供整合服務"},{"id":"b","text":"讓每個系統都保持封閉"},{"id":"c","text":"取消所有資料交換"},{"id":"d","text":"只有更多首頁連結"}],"correct":"a","difficulty":"medium"},{"id":"c15q18","stem":"「銀行服務融入生活」主要強調什麼？","options":[{"id":"b","text":"一定取消全部銀行機構"},{"id":"c","text":"任何生活 App 都可無限制放款"},{"id":"d","text":"只提高分行數量"},{"id":"a","text":"在需要的情境提供適合的金融功能"}],"correct":"a","difficulty":"medium"},{"id":"c15q19","stem":"從金融基本功能思考需求，哪組較適當？","options":[{"id":"c","text":"物流配送、餐點製作與影視播放"},{"id":"d","text":"感測器製造、晶片封裝與電池更換"},{"id":"a","text":"價值儲存、金錢移轉與取得信用"},{"id":"b","text":"廣告曝光、品牌命名與店面裝潢"}],"correct":"a","difficulty":"medium"},{"id":"c15q20","stem":"數位分行規劃應先了解什麼？","options":[{"id":"d","text":"只挑最大螢幕"},{"id":"a","text":"所在地客群需求與數位熟悉度"},{"id":"b","text":"只看設備單價"},{"id":"c","text":"只模仿旗艦店"}],"correct":"a","difficulty":"medium"},{"id":"c15q21","stem":"實體分行與數位通路的合理關係為何？","options":[{"id":"a","text":"依需求互補並接續客戶旅程"},{"id":"b","text":"彼此不共享任何進度"},{"id":"c","text":"全部功能必須完全重複"},{"id":"d","text":"任何臨櫃需求都代表失敗"}],"correct":"a","difficulty":"medium"},{"id":"c15q22","stem":"銀行與合作商共同設計新的服務，較接近什麼？","options":[{"id":"b","text":"單向公告"},{"id":"c","text":"固定收費"},{"id":"d","text":"純粹資料備份"},{"id":"a","text":"共同創造"}],"correct":"a","difficulty":"medium"},{"id":"c15q23","stem":"透過合作接觸過去沒有服務的族群，主要可帶來什麼？","options":[{"id":"c","text":"免除所有開戶審查"},{"id":"d","text":"所有資料都可自由共享"},{"id":"a","text":"新客群與需求理解"},{"id":"b","text":"自動保證所有客戶獲利"}],"correct":"a","difficulty":"medium"},{"id":"c15q24","stem":"合作商提供非傳統資料，銀行應先評估什麼？","options":[{"id":"d","text":"只看傳輸檔案大小"},{"id":"a","text":"適當用途、品質與風險相關性"},{"id":"b","text":"只要新資料就一定有價值"},{"id":"c","text":"所有資料都可無限保存"}],"correct":"a","difficulty":"medium"},{"id":"c15q25","stem":"AI 客服適合的導入目標為何？","options":[{"id":"a","text":"改善可處理問題與轉人工協作"},{"id":"b","text":"保證回答全部問題"},{"id":"c","text":"完全移除申訴窗口"},{"id":"d","text":"只增加回答長度"}],"correct":"a","difficulty":"medium"},{"id":"c15q26","stem":"以 AI 分析授信資料時，仍需什麼？","options":[{"id":"b","text":"只挑最高參數量"},{"id":"c","text":"所有輸出自動視為事實"},{"id":"d","text":"所有案件都不需解釋"},{"id":"a","text":"資料治理、模型驗證與適當監督"}],"correct":"a","difficulty":"medium"},{"id":"c15q27","stem":"把影像辨識與 RPA 串起表單處理，較合理的分工為何？","options":[{"id":"c","text":"RPA 必須自行訓練全部模型"},{"id":"d","text":"影像辨識可替代所有授權"},{"id":"a","text":"辨識擷取內容，流程工具執行後續步驟"},{"id":"b","text":"兩者都只負責提供利率"}],"correct":"a","difficulty":"medium"},{"id":"c15q28","stem":"優先選擇哪種流程導入 RPA 較合理？","options":[{"id":"d","text":"只因主管覺得熱門"},{"id":"a","text":"規則清楚、重複性高且效益可衡量"},{"id":"b","text":"所有步驟都無法描述"},{"id":"c","text":"每天任意變動且沒有規則"}],"correct":"a","difficulty":"medium"},{"id":"c15q29","stem":"流程原本包含不必要的重複審查，導入自動化前應怎麼做？","options":[{"id":"a","text":"先檢討流程再決定自動化範圍"},{"id":"b","text":"原封不動加快所有浪費"},{"id":"c","text":"增加更多重複步驟"},{"id":"d","text":"只改表單顏色"}],"correct":"a","difficulty":"medium"},{"id":"c15q30","stem":"RPA 跨系統操作帳戶，應如何管理？","options":[{"id":"b","text":"共用所有人的最高權限"},{"id":"c","text":"把密碼寫在公開說明"},{"id":"d","text":"完成後不用留下紀錄"},{"id":"a","text":"專屬身分、適當權限與操作紀錄"}],"correct":"a","difficulty":"medium"},{"id":"c15q31","stem":"系統畫面更新造成自動化流程失敗，反映什麼？","options":[{"id":"c","text":"更新畫面不可能影響軟體"},{"id":"d","text":"只要重打廣告即可修復"},{"id":"a","text":"流程工具仍需變更管理與維護"},{"id":"b","text":"RPA 永遠不能用於金融"}],"correct":"a","difficulty":"medium"},{"id":"c15q32","stem":"設立跨部門自動化推動組織，主要目的為何？","options":[{"id":"d","text":"只集中採購文具"},{"id":"a","text":"協調流程、責任與整體效益"},{"id":"b","text":"讓資訊單位承擔全部業務責任"},{"id":"c","text":"取消部門溝通"}],"correct":"a","difficulty":"medium"},{"id":"c15q33","stem":"員工擔心數位轉型影響職務，較合適的安排為何？","options":[{"id":"a","text":"溝通角色變化並提供技能培訓"},{"id":"b","text":"只要求立即接受"},{"id":"c","text":"停止所有回饋"},{"id":"d","text":"完全不討論職務調整"}],"correct":"a","difficulty":"medium"},{"id":"c15q34","stem":"領導者推動轉型需兼具什麼？","options":[{"id":"b","text":"只在啟動會致詞"},{"id":"c","text":"只要求短期下載量"},{"id":"d","text":"把所有決策交給廠商"},{"id":"a","text":"清楚方向、資源承諾與持續調整"}],"correct":"a","difficulty":"medium"},{"id":"c15q35","stem":"業務與資訊單位共同討論客戶旅程，主要改善什麼？","options":[{"id":"c","text":"程式自動理解所有商業規則"},{"id":"d","text":"所有專案都無需治理"},{"id":"a","text":"需求與技術解法的對齊"},{"id":"b","text":"各部門完全獨立"}],"correct":"a","difficulty":"medium"},{"id":"c15q36","stem":"轉型成功衡量指標，哪個較接近客戶價值？","options":[{"id":"d","text":"宣傳影片長度"},{"id":"a","text":"完成服務的時間與成功率"},{"id":"b","text":"新採購設備數量"},{"id":"c","text":"簡報總頁數"}],"correct":"a","difficulty":"medium"},{"id":"c15q37","stem":"持續關注異業案例，從業人員較應如何運用？","options":[{"id":"a","text":"理解原理並依自身情境調整"},{"id":"b","text":"把介面全部照搬"},{"id":"c","text":"認為所有產業規則相同"},{"id":"d","text":"只記住公司名稱"}],"correct":"a","difficulty":"medium"},{"id":"c15q38","stem":"數位服務推出後，應如何利用客戶回饋？","options":[{"id":"b","text":"只保留正面留言"},{"id":"c","text":"把所有抱怨自動刪除"},{"id":"d","text":"只在年終一次討論"},{"id":"a","text":"辨識痛點並驗證後續改善"}],"correct":"a","difficulty":"medium"},{"id":"c15q39","stem":"合作夥伴提供流量，銀行提供金融能力，合作設計需什麼？","options":[{"id":"c","text":"忽略資料與客戶權益"},{"id":"d","text":"不必考慮退出機制"},{"id":"a","text":"共同價值、責任與合理利益安排"},{"id":"b","text":"只由一方決定所有收益"}],"correct":"a","difficulty":"medium"},{"id":"c15q40","stem":"數位轉型與單純資訊化的差異，何者較精確？","options":[{"id":"d","text":"只要改用電子郵件就足夠"},{"id":"a","text":"轉型還涉及服務邏輯、組織與商業模式"},{"id":"b","text":"買電腦就必然完成轉型"},{"id":"c","text":"掃描文件即等於全面轉型"}],"correct":"a","difficulty":"medium"},{"id":"c15q41","stem":"App 下載很多但客戶仍須反覆臨櫃補件，應優先改善什麼？","options":[{"id":"a","text":"端到端流程與跨通路銜接"},{"id":"b","text":"只增加下載獎勵"},{"id":"c","text":"只更換 App 圖示"},{"id":"d","text":"把補件紀錄隱藏"}],"correct":"a","difficulty":"hard"},{"id":"c15q42","stem":"銀行把原先十個紙本步驟搬上手機，等待時間不變，應如何評價？","options":[{"id":"b","text":"只要沒有紙本就已成功"},{"id":"c","text":"步驟越多越代表成熟"},{"id":"d","text":"下載量足以證明效率"},{"id":"a","text":"介面數位化仍未充分改善流程"}],"correct":"a","difficulty":"hard"},{"id":"c15q43","stem":"AI 試辦節省人力但錯誤補救成本更高，擴大前應如何判斷？","options":[{"id":"c","text":"直接全面部署"},{"id":"d","text":"把補救成本排除"},{"id":"a","text":"比較總效益與風險後調整方案"},{"id":"b","text":"只公布節省工時"}],"correct":"a","difficulty":"hard"},{"id":"c15q44","stem":"數位服務加入大量功能使新客更難完成任務，應如何處理？","options":[{"id":"d","text":"停止收集使用者回饋"},{"id":"a","text":"依客戶旅程精簡並測試可用性"},{"id":"b","text":"功能越多就一定越好"},{"id":"c","text":"只增加教學頁數"}],"correct":"a","difficulty":"hard"},{"id":"c15q45","stem":"跨業合作取得新資料，但無法說明如何改善決策，應先做什麼？","options":[{"id":"a","text":"釐清用途與驗證價值再擴大蒐集"},{"id":"b","text":"只增加資料欄位"},{"id":"c","text":"永久保存全部資料"},{"id":"d","text":"把資料量當作最終成效"}],"correct":"a","difficulty":"hard"},{"id":"c15q46","stem":"各部門自動化都提高效率，跨部門案件仍大量卡住，問題可能是什麼？","options":[{"id":"b","text":"每個部門快就代表整體一定快"},{"id":"c","text":"只需再增加同款工具"},{"id":"d","text":"應停止所有部門協作"},{"id":"a","text":"局部最佳化未解決整體流程瓶頸"}],"correct":"a","difficulty":"hard"},{"id":"c15q47","stem":"RPA 節省每案 3 分鐘，每月 2,000 案，未扣例外成本前節省多少工時？","options":[{"id":"c","text":"10 小時"},{"id":"d","text":"60 小時"},{"id":"a","text":"100 小時"},{"id":"b","text":"6,000 小時"}],"correct":"a","difficulty":"hard"},{"id":"c15q48","stem":"轉型專案獎勵只看註冊數，可能導致什麼？","options":[{"id":"d","text":"自然提高每位客戶留存"},{"id":"a","text":"追求表面成長而忽略使用與服務價值"},{"id":"b","text":"必然增加長期客戶滿意度"},{"id":"c","text":"所有風險同時下降"}],"correct":"a","difficulty":"hard"},{"id":"c15q49","stem":"銀行降低自動流程人工參與，但例外案件無人承接，應補強什麼？","options":[{"id":"a","text":"例外處理、責任分工與人工協作"},{"id":"b","text":"只提高自動化比例"},{"id":"c","text":"直接隱藏失敗狀態"},{"id":"d","text":"不再接受複雜客戶"}],"correct":"a","difficulty":"hard"},{"id":"c15q50","stem":"合作平台控制客戶入口並可隨時改規則，銀行應評估什麼？","options":[{"id":"b","text":"只看短期流量"},{"id":"c","text":"只增加品牌露出"},{"id":"d","text":"把全部資料無限制交付"},{"id":"a","text":"依賴程度、客戶關係與替代及退出安排"}],"correct":"a","difficulty":"hard"}];</script><script>
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=crypto.getRandomValues(new Uint32Array(1))[0]%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
let questions=[],answers={},finished=false;const $=id=>document.getElementById(id);const escapeHtml=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){questions=shuffle(QUESTIONS).map(q=>({...q,options:shuffle(q.options)}));answers={};finished=false;$('result').classList.add('hidden');$('retry').classList.add('hidden');$('quiz').classList.remove('hidden');$('quiz').querySelector('.bottom').classList.remove('hidden');$('questions').innerHTML=questions.map((q,i)=>`<section class="question" id="${q.id}"><span class="number">QUESTION ${String(i+1).padStart(2,'0')} / 50</span><h2>${escapeHtml(q.stem)}</h2>${q.options.map((o,j)=>`<label><input type="radio" name="${q.id}" value="${o.id}"><span>${String.fromCharCode(65+j)}. ${escapeHtml(o.text)}</span></label>`).join('')}<div class="feedback"></div></section>`).join('');update()}
function update(){$('count').textContent=`已作答 ${Object.keys(answers).length} / 50 題`;$('progress').value=Object.keys(answers).length}
$('quiz').addEventListener('change',e=>{if(!finished&&e.target.type==='radio'){answers[e.target.name]=e.target.value;update()}});
$('quiz').addEventListener('submit',e=>{e.preventDefault();if(finished)return;const missing=50-Object.keys(answers).length;if(missing&&!confirm(`還有 ${missing} 題未作答，未答題以 0 分計算。確定完成？`))return;finished=true;let right=0;for(const q of questions){const section=$(q.id);const ok=answers[q.id]===q.correct;if(ok)right++;for(const input of section.querySelectorAll('input')){input.disabled=true;if(input.value===q.correct)input.closest('label').classList.add('correct');else if(input.checked)input.closest('label').classList.add('wrong')}section.querySelector('.feedback').textContent=ok?'答對了！':`${answers[q.id]?'本題答錯':'本題未作答'}。正確答案：${q.options.find(o=>o.id===q.correct).text}`}$('result').innerHTML=`<span>本次練習得分</span><strong>${right*2}<small style="font-size:22px"> 分</small></strong><p>答對 ${right} 題 · 答錯 ${50-right-missing} 題 · 未答 ${missing} 題</p><p>往下查看每題答案，或重新練習一次。</p>`;$('result').classList.remove('hidden');$('quiz').querySelector('.bottom').classList.add('hidden');$('retry').classList.remove('hidden');$('result').scrollIntoView({behavior:'smooth'});$('result').focus({preventScroll:true})});
$('retry').onclick=()=>{render();window.scrollTo({top:0,behavior:'smooth'})};render();
</script></body></html>
