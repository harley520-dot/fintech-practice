<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第9章｜存貸練習</title><style>
:root{font-family:"Microsoft JhengHei",sans-serif;color:#173d32;background:#f5f4ed}*{box-sizing:border-box}body{margin:0}header{background:#173d32;color:#fff;padding:22px max(20px,calc((100vw - 850px)/2));}header small{color:#d7ed8a;letter-spacing:3px}h1{font-size:clamp(26px,5vw,40px);margin:12px 0}header p{color:#c7d7cf;line-height:1.7}main{max-width:850px;margin:auto;padding:24px 18px 60px}.toolbar{display:flex;justify-content:space-between;gap:15px;align-items:center;position:sticky;top:0;background:#f5f4edf5;padding:14px 0;z-index:2}button{font:inherit;cursor:pointer;border:1px solid #cdd9d0;background:white;color:#173d32;border-radius:12px;padding:12px 18px}button:focus-visible,input:focus-visible{outline:3px solid #9ebf36;outline-offset:3px}.primary{background:#173d32;color:white;border:0}.question{background:white;border-radius:20px;padding:24px;margin:18px 0;border:1px solid #e0e5dd}.question h2{font-size:19px;line-height:1.7;margin:10px 0 20px}.number{font-size:12px;font-weight:bold;color:#608070}label{display:flex;align-items:flex-start;gap:12px;padding:14px;border:1px solid #e0e5dd;border-radius:12px;margin:10px 0;cursor:pointer;line-height:1.6}label:has(input:checked){background:#edf5da;border-color:#779a45}input{accent-color:#286247;margin-top:5px;flex-shrink:0}.correct{background:#e6f3e8!important;border-color:#58a16a!important}.wrong{background:#fce9e5!important;border-color:#c66b5e!important}.feedback{color:#42664f;font-size:14px;line-height:1.8}.bottom{display:grid;gap:15px;text-align:center}.bottom button{padding:18px}.note{color:#6c7e72;font-size:13px;line-height:1.7}.result{background:#173d32;color:white;border-radius:24px;padding:32px;text-align:center;margin:20px 0}.result strong{display:block;font-size:70px;color:#d7ed8a}.result p{line-height:1.8}.hidden{display:none}progress{width:100%;height:7px;accent-color:#6e982d}dialog{border:0;border-radius:20px;max-width:90vw;padding:26px;text-align:center}dialog::backdrop{background:#173d3299}dialog img{max-width:250px;width:100%}.share-url{overflow-wrap:anywhere;font-size:12px;max-width:300px}.badge{display:inline-block;background:#edf5da;color:#42664f;padding:5px 10px;border-radius:30px;font-size:12px}@media(max-width:480px){.question{padding:18px}label{padding:12px}.toolbar{font-size:13px}button{padding:11px 13px}}
header{display:flex;justify-content:space-between;align-items:center;gap:24px}.teacher-credit{text-align:right;flex-shrink:0;line-height:1.9}.teacher-credit strong{display:block;color:#d7ed8a;font-size:20px}.teacher-credit span{font-size:17px}@media(max-width:650px){header{flex-wrap:wrap;gap:8px}.teacher-credit{margin-left:auto}.teacher-credit strong{font-size:18px}.teacher-credit span{font-size:15px}}
</style></head><body><header><div><small>FINTECH PRACTICE · CHAPTER 09</small><h1>存貸</h1><p>50 題單選 · 每題 2 分 · 滿分 100 分<br>依自己的步調練習，完成後立即查看得分與正確答案。</p></div><div class="teacher-credit"><strong>數位金融服務</strong><span>楊智宇老師</span></div></header><main><div class="toolbar"><span id="count" aria-live="polite">已作答 0 / 50 題</span></div><progress id="progress" max="50" value="0" aria-label="作答進度"></progress><section id="result" class="result hidden" tabindex="-1"></section><form id="quiz"><div id="questions"></div><div class="bottom"><button class="primary" type="submit">完成作答，查看得分</button><p class="note">無須登入。姓名、學號及成績不會上傳。<br>題目與選項每次練習會重新排列。</p></div></form><button id="retry" class="primary hidden" style="width:100%">重新練習</button></main><script>const QUESTIONS=[{"id":"c9q1","stem":"銀行從存款端取得資金再辦理放款，主要扮演什麼角色？","options":[{"id":"a","text":"金融中介"},{"id":"b","text":"純資訊公告欄"},{"id":"c","text":"保險事故鑑定者"},{"id":"d","text":"股權募資發行人"}],"correct":"a","difficulty":"easy"},{"id":"c9q2","stem":"平台讓出資者直接選擇借款案件，最接近什麼服務？","options":[{"id":"b","text":"信用卡收單"},{"id":"c","text":"航班理賠"},{"id":"d","text":"存摺補登"},{"id":"a","text":"P2P 借貸"}],"correct":"a","difficulty":"easy"},{"id":"c9q3","stem":"銀行存款與 P2P 債權的關係，何者較適當？","options":[{"id":"c","text":"兩者必然都有相同保障"},{"id":"d","text":"P2P 債權一定隨時可提領"},{"id":"a","text":"法律性質與風險保障須分別確認"},{"id":"b","text":"兩者只要顯示餘額就相同"}],"correct":"a","difficulty":"easy"},{"id":"c9q4","stem":"借款人未能依約支付本息，主要屬於什麼風險？","options":[{"id":"d","text":"語音辨識風險"},{"id":"a","text":"信用或違約風險"},{"id":"b","text":"網路延遲風險"},{"id":"c","text":"資產稀釋風險"}],"correct":"a","difficulty":"easy"},{"id":"c9q5","stem":"投資人持有債權卻無法及時轉售，主要是哪種風險？","options":[{"id":"a","text":"流動性風險"},{"id":"b","text":"指紋誤拒風險"},{"id":"c","text":"匯率標示錯誤"},{"id":"d","text":"平台配色風險"}],"correct":"a","difficulty":"easy"},{"id":"c9q6","stem":"平台只提供資訊與媒合，較接近哪種營運模式？","options":[{"id":"b","text":"平台自有資金放款模式"},{"id":"c","text":"銀行吸收存款模式"},{"id":"d","text":"貨幣發行模式"},{"id":"a","text":"資訊中介模式"}],"correct":"a","difficulty":"easy"},{"id":"c9q7","stem":"平台直接動用自己的資金放款，較接近哪種模式？","options":[{"id":"c","text":"捐贈模式"},{"id":"d","text":"回饋預購模式"},{"id":"a","text":"資產負債表模式"},{"id":"b","text":"純資訊中介模式"}],"correct":"a","difficulty":"easy"},{"id":"c9q8","stem":"以應收帳款取得資金的安排，較接近什麼？","options":[{"id":"d","text":"ETF 再平衡"},{"id":"a","text":"應收帳款承購或發票融資"},{"id":"b","text":"保單理賠"},{"id":"c","text":"存款利息計算"}],"correct":"a","difficulty":"easy"},{"id":"c9q9","stem":"銀行先撥貸，再把相關債權轉給投資人，最接近哪類安排？","options":[{"id":"a","text":"銀行參與放款後轉讓的模式"},{"id":"b","text":"平台純粹公告資訊"},{"id":"c","text":"只募集捐款"},{"id":"d","text":"只有存款保管"}],"correct":"a","difficulty":"easy"},{"id":"c9q10","stem":"平台向借款或出資雙方收取媒合費，這主要是什麼？","options":[{"id":"b","text":"央行發行收益"},{"id":"c","text":"保證投資人收益"},{"id":"d","text":"存款保險給付"},{"id":"a","text":"平台的服務收入來源"}],"correct":"a","difficulty":"easy"},{"id":"c9q11","stem":"P2P 借貸可補充傳統融資，主要在哪方面創造機會？","options":[{"id":"c","text":"完全取消信用風險"},{"id":"d","text":"保證每位借款人核准"},{"id":"a","text":"接觸未被充分服務的資金需求"},{"id":"b","text":"讓所有借款都無須還款"}],"correct":"a","difficulty":"medium"},{"id":"c9q12","stem":"借款申請流程改為線上，最可能降低什麼？","options":[{"id":"d","text":"資金的機會成本"},{"id":"a","text":"部分時間與通路成本"},{"id":"b","text":"所有違約損失"},{"id":"c","text":"全部法遵成本"}],"correct":"a","difficulty":"medium"},{"id":"c9q13","stem":"投資人依風險偏好挑選案件，最需要什麼？","options":[{"id":"a","text":"可靠且足夠的案件與風險資訊"},{"id":"b","text":"只有宣傳收益率"},{"id":"c","text":"只有借款人的暱稱"},{"id":"d","text":"只看平台下載量"}],"correct":"a","difficulty":"medium"},{"id":"c9q14","stem":"借款人信用紀錄很少，替代資料可能如何幫助？","options":[{"id":"b","text":"直接證明零風險"},{"id":"c","text":"完全取代還款能力分析"},{"id":"d","text":"保證取得最高額度"},{"id":"a","text":"提供補充資訊，但仍需驗證相關性與公平性"}],"correct":"a","difficulty":"medium"},{"id":"c9q15","stem":"貸後新出現的逾期資訊回饋模型，主要用途是什麼？","options":[{"id":"c","text":"提高宣稱收益而不檢查"},{"id":"d","text":"讓所有借款人同時違約"},{"id":"a","text":"更新風險判斷與後續管理"},{"id":"b","text":"刪除原有契約"}],"correct":"a","difficulty":"medium"},{"id":"c9q16","stem":"P2P 平台把客戶資金與營運資金分離，主要降低什麼？","options":[{"id":"d","text":"投資人必然虧損"},{"id":"a","text":"資金挪用與混用風險"},{"id":"b","text":"所有借款人違約"},{"id":"c","text":"所有利率波動"}],"correct":"a","difficulty":"medium"},{"id":"c9q17","stem":"第三方資金保管對投資人有何限制？","options":[{"id":"a","text":"可降低部分保管風險，不代表債權保本"},{"id":"b","text":"代表任何案件一定還款"},{"id":"c","text":"代表所有平台都有存保"},{"id":"d","text":"代表資金永遠可立即贖回"}],"correct":"a","difficulty":"medium"},{"id":"c9q18","stem":"平台倒閉但借款尚未到期，最需要什麼安排？","options":[{"id":"b","text":"直接刪除所有借款紀錄"},{"id":"c","text":"要求投資人放棄債權"},{"id":"d","text":"只留下廣告網站"},{"id":"a","text":"持續收款、帳務與債權服務的接續機制"}],"correct":"a","difficulty":"medium"},{"id":"c9q19","stem":"設置風險準備金，評估時最應確認什麼？","options":[{"id":"c","text":"平台承諾語氣是否肯定"},{"id":"d","text":"只有帳面利率"},{"id":"a","text":"來源、規模、動用條件與不足時的處理"},{"id":"b","text":"名稱是否含保障二字"}],"correct":"a","difficulty":"medium"},{"id":"c9q20","stem":"平台承諾固定高收益，較合理的檢查是什麼？","options":[{"id":"d","text":"平台規模大即可忽略風險"},{"id":"a","text":"確認承諾主體、資金來源與實際承擔能力"},{"id":"b","text":"有保證二字就不需評估"},{"id":"c","text":"保證收益等於銀行存款"}],"correct":"a","difficulty":"medium"},{"id":"c9q21","stem":"一筆借款由許多出資者共同承擔，直接改善什麼？","options":[{"id":"a","text":"分散單一出資者的個別暴露"},{"id":"b","text":"消除借款人違約機率"},{"id":"c","text":"讓契約無需管理"},{"id":"d","text":"保證每人得到相同報酬"}],"correct":"a","difficulty":"medium"},{"id":"c9q22","stem":"出資者把全部資金放在同一地區同一產業案件，應注意什麼？","options":[{"id":"b","text":"案件筆數多就必然分散"},{"id":"c","text":"不同姓名就代表風險獨立"},{"id":"d","text":"只有平台倒閉才會損失"},{"id":"a","text":"共同經濟因素造成集中風險"}],"correct":"a","difficulty":"medium"},{"id":"c9q23","stem":"借款利率較高，可能反映什麼？","options":[{"id":"c","text":"必然代表借款人信用最佳"},{"id":"d","text":"完全不需檢查費用"},{"id":"a","text":"較高風險、成本或市場條件"},{"id":"b","text":"一定是沒有風險的額外獲利"}],"correct":"a","difficulty":"medium"},{"id":"c9q24","stem":"比較借款成本時，哪個方式較完整？","options":[{"id":"d","text":"只看申請按鈕大小"},{"id":"a","text":"一併計入利率、服務費與其他必要費用"},{"id":"b","text":"只比較廣告利率"},{"id":"c","text":"只看每月還款尾數"}],"correct":"a","difficulty":"medium"},{"id":"c9q25","stem":"借款 10,000 元先扣 500 元費用，評估成本時應注意什麼？","options":[{"id":"a","text":"實際取得金額只有 9,500 元"},{"id":"b","text":"實收仍是 10,000 元"},{"id":"c","text":"費用與借款成本無關"},{"id":"d","text":"本金已自動減為零"}],"correct":"a","difficulty":"medium"},{"id":"c9q26","stem":"平台顯示預期年報酬，出資者仍須扣除或考慮什麼？","options":[{"id":"b","text":"只有網站流量"},{"id":"c","text":"只有推薦碼折扣"},{"id":"d","text":"所有收益都已確定"},{"id":"a","text":"費用、逾期與違約損失"}],"correct":"a","difficulty":"medium"},{"id":"c9q27","stem":"平台以身分資料核對申請人，主要降低哪項風險？","options":[{"id":"c","text":"所有流動性風險"},{"id":"d","text":"借款人未來失業"},{"id":"a","text":"冒名與詐欺借貸"},{"id":"b","text":"所有市場利率風險"}],"correct":"a","difficulty":"medium"},{"id":"c9q28","stem":"短期大量帳戶出現可疑資金流，平台應怎麼做？","options":[{"id":"d","text":"以廣告獎勵促進更多轉帳"},{"id":"a","text":"依風險與程序調查及處理"},{"id":"b","text":"只因交易增加就持續放行"},{"id":"c","text":"取消身分確認加速成交"}],"correct":"a","difficulty":"medium"},{"id":"c9q29","stem":"借款人上傳收入證明，平台應如何看待？","options":[{"id":"a","text":"驗證真實性與還款能力相關性"},{"id":"b","text":"有檔案就必然可信"},{"id":"c","text":"照片清晰即代表收入穩定"},{"id":"d","text":"只看檔名是否正式"}],"correct":"a","difficulty":"medium"},{"id":"c9q30","stem":"平台信用評級與政府保障有何區別？","options":[{"id":"b","text":"評級越高就等於存保"},{"id":"c","text":"平台評級可代替所有契約"},{"id":"d","text":"評級 A 就保證永不違約"},{"id":"a","text":"評級是風險判斷，不是政府還款承諾"}],"correct":"a","difficulty":"medium"},{"id":"c9q31","stem":"線上媒合提高資訊透明度，仍可能存在什麼？","options":[{"id":"c","text":"借款人不可能隱瞞"},{"id":"d","text":"風險一定可全部量化"},{"id":"a","text":"資料不完整與投資人過度依賴平台"},{"id":"b","text":"所有資訊完全對稱"}],"correct":"a","difficulty":"medium"},{"id":"c9q32","stem":"債權有轉售功能，是否代表一定可立即變現？","options":[{"id":"d","text":"代表沒有流動性風險"},{"id":"a","text":"不代表，仍需買方與適當價格"},{"id":"b","text":"代表任何價格都有人承接"},{"id":"c","text":"代表平台必須無限買回"}],"correct":"a","difficulty":"medium"},{"id":"c9q33","stem":"平台只公告已完成還款案件的報酬，容易忽略什麼？","options":[{"id":"a","text":"尚在逾期或損失中的案件"},{"id":"b","text":"已結案的借款人姓名"},{"id":"c","text":"廣告點擊次數"},{"id":"d","text":"服務頁面數量"}],"correct":"a","difficulty":"medium"},{"id":"c9q34","stem":"出資者自動投標前，應確認什麼？","options":[{"id":"b","text":"只確認背景顏色"},{"id":"c","text":"讓系統不設任何上限"},{"id":"d","text":"完全不讀分配規則"},{"id":"a","text":"風險條件、分散限制與停止方式"}],"correct":"a","difficulty":"medium"},{"id":"c9q35","stem":"自動投標大量集中於同一借款人，應改善什麼？","options":[{"id":"c","text":"帳號字體大小"},{"id":"d","text":"只增加投標頻率"},{"id":"a","text":"借款人及關聯暴露上限"},{"id":"b","text":"網站圖片格式"}],"correct":"a","difficulty":"medium"},{"id":"c9q36","stem":"平台採用外部信評服務，仍須負責什麼？","options":[{"id":"d","text":"停止檢查評分輸入"},{"id":"a","text":"評估資料品質與模型適用性"},{"id":"b","text":"只依廠商品牌決定"},{"id":"c","text":"把所有錯誤轉給借款人"}],"correct":"a","difficulty":"medium"},{"id":"c9q37","stem":"投資人發現契約未說明催收與違約處理，最欠缺什麼？","options":[{"id":"a","text":"債權管理與權利義務資訊"},{"id":"b","text":"平台標誌"},{"id":"c","text":"推薦獎金表"},{"id":"d","text":"手機相容性表"}],"correct":"a","difficulty":"medium"},{"id":"c9q38","stem":"借款到期與出資者可退出時間不同，須關注什麼？","options":[{"id":"b","text":"指紋模板格式"},{"id":"c","text":"產品包裝"},{"id":"d","text":"交易畫面解析度"},{"id":"a","text":"資產與資金期限安排"}],"correct":"a","difficulty":"medium"},{"id":"c9q39","stem":"平台追求核貸速度時，仍應保留什麼？","options":[{"id":"c","text":"全部案件不留紀錄"},{"id":"d","text":"刪除任何拒貸理由"},{"id":"a","text":"必要審查與例外處理"},{"id":"b","text":"無條件自動核准"}],"correct":"a","difficulty":"medium"},{"id":"c9q40","stem":"評估平台成效較完整的指標為何？","options":[{"id":"d","text":"只看新戶獎勵"},{"id":"a","text":"成交效率、實際損失、費用與服務品質"},{"id":"b","text":"只看累積放款額"},{"id":"c","text":"只看最高宣稱利率"}],"correct":"a","difficulty":"medium"},{"id":"c9q41","stem":"平台以新投資人的錢支付舊投資人收益，缺乏真實借款現金流，代表什麼？","options":[{"id":"a","text":"資金運作與揭露有重大異常"},{"id":"b","text":"正常降低借款人利率"},{"id":"c","text":"典型的合法分散投資"},{"id":"d","text":"可自然消除所有違約"}],"correct":"a","difficulty":"hard"},{"id":"c9q42","stem":"出資者持有 100 筆貸款，但都來自同一企業集團，分散效果應如何評估？","options":[{"id":"b","text":"100 筆即代表 100 個獨立風險"},{"id":"c","text":"只要帳號不同就不相關"},{"id":"d","text":"全部風險只取決於筆數"},{"id":"a","text":"須按關聯對象計算整體暴露"}],"correct":"a","difficulty":"hard"},{"id":"c9q43","stem":"違約率以累積件數計算卻未區分借款期間，可能造成什麼？","options":[{"id":"c","text":"樣本多就不受期間影響"},{"id":"d","text":"所有指標都可直接比較"},{"id":"a","text":"新舊批次比較失真"},{"id":"b","text":"較新案件必然更安全"}],"correct":"a","difficulty":"hard"},{"id":"c9q44","stem":"平台信用模型在景氣好時建立，衰退期最應檢查什麼？","options":[{"id":"d","text":"全部評分是否仍維持原值"},{"id":"a","text":"風險關係變化與壓力下的模型表現"},{"id":"b","text":"網站載入動畫"},{"id":"c","text":"借款人照片尺寸"}],"correct":"a","difficulty":"hard"},{"id":"c9q45","stem":"風險準備金可支付少數違約，遇到大量同時違約時應注意什麼？","options":[{"id":"a","text":"準備金可能不足且損失仍由相關方承擔"},{"id":"b","text":"有準備金就不會有損失"},{"id":"c","text":"小額案件完全不受景氣影響"},{"id":"d","text":"平台可自動增發法幣"}],"correct":"a","difficulty":"hard"},{"id":"c9q46","stem":"平台兼任評分、收費與保證人，應特別關注什麼？","options":[{"id":"b","text":"只看職稱是否正式"},{"id":"c","text":"角色越多必然越獨立"},{"id":"d","text":"全部責任自然消失"},{"id":"a","text":"角色衝突與風險集中"}],"correct":"a","difficulty":"hard"},{"id":"c9q47","stem":"借款利率下降而服務費大幅上升，如何比較新舊方案？","options":[{"id":"c","text":"只看申請速度"},{"id":"d","text":"只看每期付款畫面"},{"id":"a","text":"以同期限下的實際總成本比較"},{"id":"b","text":"只看名目利率下降"}],"correct":"a","difficulty":"hard"},{"id":"c9q48","stem":"平台停止營業後，客戶資金仍在獨立保管帳戶，債權風險是否全部消失？","options":[{"id":"d","text":"有，平台紀錄不再需要"},{"id":"a","text":"沒有，借款人還款與服務接續仍需處理"},{"id":"b","text":"有，獨立保管保證全部本息"},{"id":"c","text":"有，所有貸款自動變存款"}],"correct":"a","difficulty":"hard"},{"id":"c9q49","stem":"某模型以社群活躍度作信用依據，可能忽略什麼？","options":[{"id":"a","text":"不使用社群者的資料代表性與公平性"},{"id":"b","text":"所有低活躍者都會違約"},{"id":"c","text":"所有高活躍者都必還款"},{"id":"d","text":"社群數據天然沒有偏差"}],"correct":"a","difficulty":"hard"},{"id":"c9q50","stem":"同一張發票在不同平台融資，平台治理應加強什麼？","options":[{"id":"b","text":"只增加上傳速度"},{"id":"c","text":"讓借款人自行口頭保證即可"},{"id":"d","text":"只檢查圖片亮度"},{"id":"a","text":"驗證債權真實性與重複融資風險"}],"correct":"a","difficulty":"hard"}];</script><script>
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=crypto.getRandomValues(new Uint32Array(1))[0]%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
let questions=[],answers={},finished=false;const $=id=>document.getElementById(id);const escapeHtml=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){questions=shuffle(QUESTIONS).map(q=>({...q,options:shuffle(q.options)}));answers={};finished=false;$('result').classList.add('hidden');$('retry').classList.add('hidden');$('quiz').classList.remove('hidden');$('quiz').querySelector('.bottom').classList.remove('hidden');$('questions').innerHTML=questions.map((q,i)=>`<section class="question" id="${q.id}"><span class="number">QUESTION ${String(i+1).padStart(2,'0')} / 50</span><h2>${escapeHtml(q.stem)}</h2>${q.options.map((o,j)=>`<label><input type="radio" name="${q.id}" value="${o.id}"><span>${String.fromCharCode(65+j)}. ${escapeHtml(o.text)}</span></label>`).join('')}<div class="feedback"></div></section>`).join('');update()}
function update(){$('count').textContent=`已作答 ${Object.keys(answers).length} / 50 題`;$('progress').value=Object.keys(answers).length}
$('quiz').addEventListener('change',e=>{if(!finished&&e.target.type==='radio'){answers[e.target.name]=e.target.value;update()}});
$('quiz').addEventListener('submit',e=>{e.preventDefault();if(finished)return;const missing=50-Object.keys(answers).length;if(missing&&!confirm(`還有 ${missing} 題未作答，未答題以 0 分計算。確定完成？`))return;finished=true;let right=0;for(const q of questions){const section=$(q.id);const ok=answers[q.id]===q.correct;if(ok)right++;for(const input of section.querySelectorAll('input')){input.disabled=true;if(input.value===q.correct)input.closest('label').classList.add('correct');else if(input.checked)input.closest('label').classList.add('wrong')}section.querySelector('.feedback').textContent=ok?'答對了！':`${answers[q.id]?'本題答錯':'本題未作答'}。正確答案：${q.options.find(o=>o.id===q.correct).text}`}$('result').innerHTML=`<span>本次練習得分</span><strong>${right*2}<small style="font-size:22px"> 分</small></strong><p>答對 ${right} 題 · 答錯 ${50-right-missing} 題 · 未答 ${missing} 題</p><p>往下查看每題答案，或重新練習一次。</p>`;$('result').classList.remove('hidden');$('quiz').querySelector('.bottom').classList.add('hidden');$('retry').classList.remove('hidden');$('result').scrollIntoView({behavior:'smooth'});$('result').focus({preventScroll:true})});
$('retry').onclick=()=>{render();window.scrollTo({top:0,behavior:'smooth'})};render();
</script></body></html>
